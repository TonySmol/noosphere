<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOOmium</title>
  
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/csp@3.14.1/dist/cdn.min.js"></script>
  
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-base-100 min-h-screen">
  
  <div x-data="app" x-init="init" x-cloak>
    
    <!-- HEADER -->
    <div class="navbar bg-base-200 shadow-lg sticky top-0 z-40">
      <div class="flex-1">
        <span class="text-xl font-bold px-4">NOO<span class="text-primary">.</span>mium</span>
      </div>
      <div class="flex-none gap-2">
        <div class="badge badge-ghost gap-2">
          <span class="w-2 h-2 rounded-full" :class="storageStatusClass"></span>
          <span class="text-xs" x-text="storageStatusText"></span>
        </div>
        <div class="badge badge-ghost gap-2">
          <span class="w-2 h-2 rounded-full" :class="aiStatusClass"></span>
          <span class="text-xs" x-text="aiStatusText"></span>
        </div>
      </div>
    </div>

    <!-- MAIN -->
    <main class="container mx-auto p-4 max-w-4xl">
      
      <!-- EDITOR -->
      <div class="card bg-base-200 shadow-xl mb-6">
        <div class="card-body">
          <textarea 
            x-model="editorText"
            @input="onEditorInput"
            class="textarea textarea-bordered h-24 text-lg"
            placeholder="О чём думаешь?"
          ></textarea>
          <div class="flex justify-between items-center mt-2">
            <span class="text-sm opacity-70" x-text="charCount"></span>
            <div class="flex gap-2">
              <div class="btn-group">
                <button class="btn btn-sm"
                        :class="privateBtnClass"
                        @click="setPrivateMode">Личное</button>
                <button class="btn btn-sm"
                        :class="worldBtnClass"
                        @click="setWorldMode">Мир</button>
              </div>
              <button class="btn btn-primary"
                      :disabled="!canSend"
                      @click="sendNote">
                Послать
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- TABS -->
      <div role="tablist" class="tabs tabs-lifted mb-4">
        <a role="tab" class="tab" :class="streamTabClass" @click="setStreamTab">Поток</a>
        <a role="tab" class="tab" :class="baseTabClass" @click="setBaseTab">База</a>
      </div>

      <!-- STREAM TAB -->
      <div x-show="isStreamTab" class="space-y-6">
        
        <section x-show="hasMyResults">
          <h3 class="text-lg font-bold mb-2">Моё</h3>
          <div class="space-y-2">
            <template x-for="note in myResults" :key="note.id">
              <div class="card bg-base-200 shadow">
                <div class="card-body p-4">
                  <p x-text="note.text"></p>
                  <div class="flex justify-between items-center mt-2">
                    <span class="badge badge-primary badge-sm" x-text="note.scoreText"></span>
                    <div class="flex gap-1">
                      <button class="btn btn-ghost btn-xs" @click="toggleShared(note.id)" x-text="note.toggleText"></button>
                      <button class="btn btn-ghost btn-xs btn-error" @click="deleteNote(note.id)">Удалить</button>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </section>

        <section x-show="hasInsightsResults">
          <h3 class="text-lg font-bold mb-2">Озарения</h3>
          <div class="space-y-2">
            <template x-for="note in insightsResults" :key="note.id">
              <div class="card bg-base-200 shadow">
                <div class="card-body p-4">
                  <p x-text="note.text"></p>
                  <div class="flex justify-end mt-2">
                    <span class="badge badge-accent badge-sm" x-text="note.scoreText"></span>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </section>

        <div x-show="showNoResults" class="text-center py-10 opacity-50">
          <p>Ничего не найдено.</p>
        </div>
        
        <div x-show="showEmptyState" class="text-center py-10 opacity-50">
          <p>Начните печатать.</p>
        </div>
      </div>

      <!-- BASE TAB -->
      <div x-show="isBaseTab">
        <div class="stats shadow mb-4 w-full">
          <div class="stat">
            <div class="stat-title">Всего</div>
            <div class="stat-value text-lg" x-text="totalNotes"></div>
          </div>
          <div class="stat">
            <div class="stat-title">Открыто</div>
            <div class="stat-value text-lg" x-text="sharedNotes"></div>
          </div>
          <div class="stat">
            <div class="stat-title">Лично</div>
            <div class="stat-value text-lg" x-text="privateNotes"></div>
          </div>
        </div>
        <div class="space-y-2">
          <template x-for="note in allNotes" :key="note.id">
            <div class="card bg-base-200 shadow cursor-pointer">
              <div class="card-body p-4">
                <p class="line-clamp-3" x-text="note.text"></p>
                <div class="flex justify-between items-center mt-2">
                  <span class="badge badge-sm" :class="note.badgeClass" x-text="note.statusText"></span>
                  <span class="text-xs opacity-60" x-text="note.dateText"></span>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>

    </main>

    <!-- PASSWORD MODAL -->
    <dialog class="modal" :class="modalClass">
      <div class="modal-box">
        <h3 class="font-bold text-lg">Защита данных</h3>
        <p class="py-4 opacity-70" x-text="passwordModalText"></p>
        <div class="form-control">
          <input type="password" x-model="password" @keydown.enter="confirmPassword" placeholder="Пароль" class="input input-bordered" />
        </div>
        <div class="modal-action">
          <button class="btn btn-primary" @click="confirmPassword">Сохранить</button>
        </div>
      </div>
    </dialog>

  </div>

  <script>
    // ================================================================
    // ALPINE COMPONENT (CSP-compliant)
    // ================================================================
    document.addEventListener('alpine:init', () => {
      Alpine.data('app', () => ({
        // State
        editorText: '',
        editorMode: 'private',
        activeTab: 'stream',
        allNotes: [],
        myResults: [],
        insightsResults: [],
        showPasswordModal: false,
        passwordModalText: 'Придумайте пароль для шифрования.',
        password: '',
        storageStatus: 'loading',
        aiStatus: 'loading',
        _searchTimer: null,

        // Lifecycle
        async init() {
          console.log('[INFO] App initialized');
          this.storageStatus = 'ready';
          this.showPasswordModal = true;
        },

        // Computed properties (getters)
        get charCount() {
          return `${this.editorText.length} симв.`;
        },

        get canSend() {
          return this.editorText.trim().length > 0;
        },

        get privateBtnClass() {
          return this.editorMode === 'private' ? 'btn-primary' : 'btn-ghost';
        },

        get worldBtnClass() {
          return this.editorMode === 'world' ? 'btn-primary' : 'btn-ghost';
        },

        get streamTabClass() {
          return { 'tab-active': this.activeTab === 'stream' };
        },

        get baseTabClass() {
          return { 'tab-active': this.activeTab === 'base' };
        },

        get isStreamTab() {
          return this.activeTab === 'stream';
        },

        get isBaseTab() {
          return this.activeTab === 'base';
        },

        get hasMyResults() {
          return this.myResults.length > 0;
        },

        get hasInsightsResults() {
          return this.insightsResults.length > 0;
        },

        get showNoResults() {
          return this.myResults.length === 0 && this.insightsResults.length === 0 && this.editorText.length > 0;
        },

        get showEmptyState() {
          return this.editorText.length === 0;
        },

        get totalNotes() {
          return this.allNotes.length;
        },

        get sharedNotes() {
          return this.allNotes.filter(n => n.shared).length;
        },

        get privateNotes() {
          return this.allNotes.filter(n => !n.shared).length;
        },

        get storageStatusClass() {
          const classes = {
            loading: 'bg-warning animate-pulse',
            ready: 'bg-success',
            error: 'bg-error'
          };
          return classes[this.storageStatus] || 'bg-warning';
        },

        get storageStatusText() {
          return this.storageStatus;
        },

        get aiStatusClass() {
          const classes = {
            loading: 'bg-warning animate-pulse',
            ready: 'bg-success',
            error: 'bg-error'
          };
          return classes[this.aiStatus] || 'bg-warning';
        },

        get aiStatusText() {
          return this.aiStatus;
        },

        get modalClass() {
          return { 'modal-open': this.showPasswordModal };
        },

        // Methods
        setPrivateMode() {
          this.editorMode = 'private';
        },

        setWorldMode() {
          this.editorMode = 'world';
        },

        setStreamTab() {
          this.activeTab = 'stream';
        },

        setBaseTab() {
          this.activeTab = 'base';
        },

        onEditorInput() {
          clearTimeout(this._searchTimer);
          this._searchTimer = setTimeout(() => {
            this.runSearch();
          }, 800);
        },

        async runSearch() {
          // TODO: Implement search logic
          this.myResults = [];
          this.insightsResults = [];
        },

        async sendNote() {
          if (!this.canSend) return;
          
          const note = {
            id: 'n' + Date.now().toString(36),
            text: this.editorText.trim(),
            shared: this.editorMode === 'world',
            createdAt: Date.now(),
            badgeClass: this.editorMode === 'world' ? 'badge-secondary' : 'badge-ghost',
            statusText: this.editorMode === 'world' ? 'открыто' : 'лично',
            dateText: 'только что'
          };
          
          this.allNotes.unshift(note);
          this.editorText = '';
          this.myResults = [];
          this.insightsResults = [];
        },

        async toggleShared(id) {
          const note = this.allNotes.find(n => n.id === id);
          if (note) {
            note.shared = !note.shared;
            note.badgeClass = note.shared ? 'badge-secondary' : 'badge-ghost';
            note.statusText = note.shared ? 'открыто' : 'лично';
          }
        },

        async deleteNote(id) {
          if (!confirm('Удалить эту мысль навсегда?')) return;
          this.allNotes = this.allNotes.filter(n => n.id !== id);
        },

        async confirmPassword() {
          if (!this.password || this.password.length < 4) {
            this.passwordModalText = 'Пароль должен быть не менее 4 символов.';
            return;
          }
          
          this.showPasswordModal = false;
          this.password = '';
          console.log('[INFO] Password confirmed');
        }
      }));
    });
  </script>
</body>
</html>
