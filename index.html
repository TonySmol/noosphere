    function renderCarousel() {
      const wrap = document.getElementById('carousel-wrap');
      if (!wrap) return;

      if (state.carouselObserver) {
        try { state.carouselObserver.disconnect(); } catch (_) { /* ignore */ }
        state.carouselObserver = null;
      }

      const list = state.lists[state.seg];
      if (!list || list.length === 0) {
        const emptyMessages = {
          local: { t: translate('empty.local.t'), d: translate('empty.local.d') },
          world: { t: translate('empty.world.t'), d: translate('empty.world.d') },
          seren: { t: translate('empty.seren.t'), d: translate('empty.seren.d') }
        };
        const msg = emptyMessages[state.seg];
        wrap.innerHTML = '<div class="feed-empty"><div class="feed-empty-ic">◇</div>' +
          '<div class="feed-empty-t">' + Utils.esc(msg.t) + '</div>' +
          '<div class="feed-empty-d">' + Utils.esc(msg.d) + '</div></div>';
        return;
      }

      let html = '<div class="carousel" id="carousel">';
      for (let i = 0; i < list.length; i++) {
        html += '<div class="carousel-item" data-idx="' + i + '">' + renderItemHTML(list[i]) + '</div>';
      }
      html += '</div>';
      html += '<div class="carousel-dots" id="carousel-dots">';
      for (let j = 0; j < Math.min(list.length, 12); j++) {
        html += '<span class="carousel-dot' + (j === 0 ? ' active' : '') + '" data-i="' + j + '"></span>';
      }
      html += '<span class="carousel-counter" id="carousel-counter">1 / ' + list.length + '</span>';
      html += '</div>';
      wrap.innerHTML = html;

      const carousel = document.getElementById('carousel');
      if (carousel && 'IntersectionObserver' in window) {
        state.carouselObserver = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting && entry.intersectionRatio >= 0.55) {
              const idx = parseInt(entry.target.getAttribute('data-idx') || '0', 10);
              state.activeIdx[state.seg] = idx;
              updateCarouselDots(idx, list.length);
              carousel.querySelectorAll('.fi').forEach(function(fi) { fi.classList.remove('active'); });
              const fi = entry.target.querySelector('.fi');
              if (fi) fi.classList.add('active');
            }
          });
        }, { root: carousel, threshold: [0.55] });
        carousel.querySelectorAll('.carousel-item').forEach(function(item) {
          state.carouselObserver.observe(item);
        });
      }

      if (carousel) {
        carousel.scrollLeft = 0;
      }
      state.activeIdx[state.seg] = 0;
    }

    function updateCarouselDots(idx, total) {
      const dots = document.querySelectorAll('#carousel-dots .carousel-dot');
      dots.forEach(function(d, i) { d.classList.toggle('active', i === idx); });
      const counter = document.getElementById('carousel-counter');
      if (counter) counter.textContent = (idx + 1) + ' / ' + total;
    }

    function handleItemAction(action, element) {
      if (!element) return;
      const id = element.getAttribute('data-id');

      if (action === 'develop') {
        let item = null;
        const list = state.lists[state.seg];
        for (let i = 0; i < list.length; i++) {
          if (list[i].id === id) { item = list[i]; break; }
        }
        if (item) {
          setEditorValue(item.text);
          updateCounter();
          const ta = document.getElementById('ed-ta');
          if (ta) ta.focus();
        }
        return;
      }

      if (action === 'copy') {
        let item = null;
        const list = state.lists[state.seg];
        for (let i = 0; i < list.length; i++) {
          if (list[i].id === id) { item = list[i]; break; }
        }
        if (item) copyToClipboard(item.text);
        return;
      }

      if (action === 'del') {
        if (!confirm(translate('base.wipe.confirm').replace('все ваши мысли', 'эту мысль'))) return;
        DB.del(id).then(function() {
          toast(translate('toast.deleted'), 'ok');
          state.lists[state.seg] = state.lists[state.seg].filter(function(n) { return n.id !== id; });
          if (state.activeIdx[state.seg] >= state.lists[state.seg].length) {
            state.activeIdx[state.seg] = Math.max(0, state.lists[state.seg].length - 1);
          }
          renderCarousel();
          if (state.view === 'base') renderBase();
        }).catch(function(err) {
          toast(String(err && err.message || err) || 'Delete failed', 'err');
        });
        return;
      }

      if (action === 'toggle') {
        DB.get(id).then(function(record) {
          if (!record) return;
          record.shared = !record.shared;
          return DB.put(record).then(function() {
            toast(record.shared ? translate('toast.saved.public') : translate('toast.saved.private'), 'ok');
            executeSearch();
            if (state.view === 'base') renderBase();
          });
        }).catch(function(err) {
          toast(String(err && err.message || err) || 'Toggle failed', 'err');
        });
        return;
      }
    }

    function copyToClipboard(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            function() { toast(translate('toast.copied'), 'ok'); },
            function() { toast(translate('toast.copy.fail'), 'err'); }
          );
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.top = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); toast(translate('toast.copied'), 'ok'); }
          catch (err) { toast(translate('toast.copy.fail'), 'err'); }
          document.body.removeChild(ta);
        }
      } catch (err) {
        toast(translate('toast.copy.fail'), 'err');
      }
    }

    function updateCounter() {
      const value = getEditorValue();
      const counter = document.getElementById('ed-cnt');
      if (counter) counter.textContent = Utils.word('symbols', value.length, I18n.getLang());
    }

    function handleSend() {
      if (state.sendLock) return;
      const text = getEditorValue().trim();
      if (!text) { toast(translate('toast.empty'), 'warn'); return; }
      if (!AI.ready()) { toast(translate('toast.ai.notready'), 'err'); return; }

      const isWorld = state.sendMode === 'world';
      const btn = document.getElementById('btn-send');
      state.sendLock = true;

      if (btn) {
        btn.classList.add('sending');
        btn.disabled = true;
        btn.innerHTML = SPINNER_SVG;
      }

      AI.embed(text)
        .then(function(vector) {
          return DB.put({
            id: Math.random().toString(36).slice(2, 10),
            text: text,
            vector: vector,
            shared: !!isWorld,
            createdAt: Date.now()
          });
        })
        .then(function() {
          setEditorValue('');
          updateCounter();
          state.lastVec = null;
          toast(isWorld ? translate('toast.saved.public') : translate('toast.saved.private'), 'ok');
          executeSearch();
          if (state.view === 'base') renderBase();
        })
        .catch(function(err) {
          toast(String(err && err.message || err) || 'Send failed', 'err');
        })
        .finally(function() {
          state.sendLock = false;
          if (btn) {
            btn.classList.remove('sending');
            btn.disabled = false;
            btn.innerHTML = PAPER_PLANE_SVG;
          }
        });
    }

    function handleToggleMode(newMode) {
      if (newMode === state.sendMode) return;
      state.sendMode = newMode;
      const toggleEl = document.getElementById('mode-toggle');
      if (!toggleEl) return;
      toggleEl.setAttribute('data-mode', state.sendMode);
      toggleEl.querySelectorAll('.tog-sw-opt').forEach(function(opt) {
        opt.classList.toggle('on', opt.getAttribute('data-v') === state.sendMode);
      });
    }

    // executeSearch: логика озарений — попадают и локальные, и мировые с нужным score
    function executeSearch(force) {
      const text = getEditorValue();
      if (!text || !AI.ready()) {
        state.lists = { local: [], world: [], seren: [] };
        updateCounts();
        renderCarousel();
        return Promise.resolve();
      }
      return AI.embed(text).then(function(vec) {
        if (!vec) return;
        if (!state.lastVec || AI.cosine(vec, state.lastVec) < 0.98 || force) {
          state.lastVec = vec;
          state.lastQuery = Date.now();
          if (AI.getMode() === 'model' && Net && typeof Net.send === 'function') {
            Net.send(vec);
          }
        }
        return DB.all().then(function(notes) {
          const localScored = [];
          for (let i = 0; i < notes.length; i++) {
            const note = notes[i];
            if (note && note.vector) {
              localScored.push(Object.assign({}, note, { score: AI.cosine(vec, note.vector) }));
            }
          }
          const worldAnswers = Net.activeAnswers();
          const worldScored = [];
          for (let i = 0; i < worldAnswers.length; i++) {
            worldScored.push(Object.assign({}, worldAnswers[i], { score: AI.cosine(vec, worldAnswers[i].vector) }));
          }
          const threshold = Config.get('threshold', 0.30);
          const serendipityDelta = Config.get('serendipity', 0.15);

          state.lists.local = localScored.filter(function(n) { return n.score >= threshold; })
            .sort(function(a, b) { return b.score - a.score; });
          state.lists.world = worldScored.filter(function(n) { return n.score >= threshold; })
            .sort(function(a, b) { return b.score - a.score; });
          // Озарения: score в диапазоне [threshold - serendipityDelta, threshold)
          // Включает и локальные, и мировые мысли
          state.lists.seren = localScored.concat(worldScored)
            .filter(function(n) { return n.score >= (threshold - serendipityDelta) && n.score < threshold; })
            .sort(function(a, b) { return b.score - a.score; });

          updateCounts();
          renderCarousel();
        });
      }).catch(function(err) {
        toast(String(err && err.message || err) || 'Search failed', 'err');
        if (Logger) Logger.warn('executeSearch error', String(err && err.message || err));
      });
    }

    function updateCounts() {
      ['local', 'world', 'seren'].forEach(function(key) {
        const el = document.getElementById('c-' + key);
        if (el) el.textContent = state.lists[key].length;
      });
    }

    function buildStatCard(value, label) {
      return '<div class="stat"><div class="stat-v">' + Utils.esc(String(value)) + '</div>' +
             '<div class="stat-l">' + Utils.esc(label) + '</div></div>';
    }

    function renderBase() {
      DB.all().then(function(allNotes) {
        const statsEl = document.getElementById('base-stats');
        if (statsEl) {
          let sharedCount = 0;
          for (let i = 0; i < allNotes.length; i++) {
            if (allNotes[i] && allNotes[i].shared) sharedCount++;
          }
          statsEl.innerHTML =
            buildStatCard(allNotes.length, translate('base.stat.total')) +
            buildStatCard(sharedCount, translate('base.stat.open')) +
            buildStatCard(allNotes.length - sharedCount, translate('base.stat.priv'));
        }

        const queryInput = document.getElementById('base-q');
        const sortSelect = document.getElementById('base-sort');
        const queryValue = queryInput ? queryInput.value.trim().toLowerCase() : '';
        const sortValue = sortSelect ? sortSelect.value : 'new';

        let list = allNotes.slice();
        if (queryValue) {
          list = list.filter(function(n) { return n.text && n.text.toLowerCase().indexOf(queryValue) >= 0; });
        }
        if (sortValue === 'old') {
          list.sort(function(a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
        } else if (sortValue === 'az') {
          list.sort(function(a, b) { return (a.text || '').localeCompare(b.text || '', I18n.getLang() === 'en' ? 'en' : 'ru'); });
        } else {
          list.sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
        }

        const container = document.getElementById('base-list');
        if (!container) return;

        if (list.length === 0) {
          const emptyTitle = translate('empty.base.t');
          const emptyDesc = allNotes.length === 0 ? translate('empty.base.d') : translate('empty.base.empty');
          container.innerHTML = '<div class="feed-empty"><div class="feed-empty-ic">▤</div>' +
            '<div class="feed-empty-t">' + Utils.esc(emptyTitle) + '</div>' +
            '<div class="feed-empty-d">' + Utils.esc(emptyDesc) + '</div>' +
            (allNotes.length === 0 ? '<button class="btn-send" id="btn-seed" style="margin-top:12px">' + Utils.esc(translate('base.seed')) + '</button>' : '') +
            '</div>';
          const seedBtn = document.getElementById('btn-seed');
          if (seedBtn) seedBtn.onclick = seedSamples;
          return;
        }

        container.innerHTML = list.map(function(note) {
          const dateStr = Utils.fmtDate(note.createdAt, I18n.getLang());
          const escapedText = Utils.esc(note.text);
          const isLongText = escapedText.length > 120;
          return '<div class="bi ' + (note.shared ? 'shared' : '') + '" data-id="' + Utils.esc(note.id) + '">' +
            '<div class="bi-t' + (isLongText ? ' truncated' : '') + '">' + escapedText + '</div>' +
            '<div class="bi-f"><div class="bi-meta">' +
              '<span class="bi-tag">' + Utils.esc(note.shared ? translate('base.tag.shared') : translate('base.tag.private')) + '</span>' +
              '<span class="bi-date">' + Utils.esc(dateStr) + '</span>' +
            '</div></div></div>';
        }).join('');
      }).catch(function(err) {
        toast(String(err && err.message || err) || 'Base load failed', 'err');
        if (Logger) Logger.warn('renderBase error', String(err && err.message || err));
      });
    }

    // openNoteView: кнопки в футере в один ряд (flex-wrap: nowrap в CSS)
    function openNoteView(id) {
      DB.get(id).then(function(record) {
        if (!record) return;

        let isEditing = false;
        let nvOverlay = null;
        let nvEscHandler = null;

        function renderNoteView() {
          if (!nvOverlay) {
            nvOverlay = document.createElement('div');
            nvOverlay.className = 'nv on';
            document.body.appendChild(nvOverlay);
          }

          const dateStr = Utils.fmtDate(record.createdAt, I18n.getLang());
          const tagLabel = record.shared ? translate('base.tag.shared') : translate('base.tag.private');

          let bodyContent = '';
          if (isEditing) {
            bodyContent = '<textarea class="nv-ta" id="nv-ta">' + Utils.esc(record.text) + '</textarea>';
          } else {
            bodyContent = '<div class="nv-text">' + Utils.esc(record.text) + '</div>';
          }

          let footerContent = '';
          if (isEditing) {
            footerContent =
              '<button class="nv-act" id="nv-cancel">' + Utils.esc(translate('btn.cancel')) + '</button>' +
              '<button class="nv-act primary" id="nv-save">' + Utils.esc(translate('btn.save')) + '</button>';
          } else {
            footerContent =
              '<button class="nv-act danger" id="nv-del">' + Utils.esc(translate('btn.del')) + '</button>' +
              '<button class="nv-act" id="nv-copy">' + Utils.esc(translate('btn.copy')) + '</button>' +
              '<button class="nv-act" id="nv-toggle">' + Utils.esc(record.shared ? translate('btn.toggle.priv') : translate('btn.toggle.pub')) + '</button>' +
              '<button class="nv-act primary" id="nv-edit">' + Utils.esc(translate('btn.edit')) + '</button>';
          }

          nvOverlay.innerHTML =
            '<div class="nv-h">' +
              '<button class="nv-back" id="nv-back" aria-label="' + Utils.esc(translate('btn.back')) + '">←</button>' +
              '<div class="nv-title">' + Utils.esc(translate('nv.title')) + '</div>' +
              '<div class="nv-meta"><span class="bi-tag">' + Utils.esc(tagLabel) + '</span><span>' + Utils.esc(dateStr) + '</span></div>' +
            '</div>' +
            '<div class="nv-b">' + bodyContent + '</div>' +
            '<div class="nv-f">' + footerContent + '</div>';

          const backBtn = document.getElementById('nv-back');
          if (backBtn) backBtn.onclick = closeNoteView;

          if (isEditing) {
            const cancelBtn = document.getElementById('nv-cancel');
            const saveBtn = document.getElementById('nv-save');
            if (cancelBtn) cancelBtn.onclick = function() {
              isEditing = false;
              renderNoteView();
            };
            if (saveBtn) saveBtn.onclick = function() {
              const ta = document.getElementById('nv-ta');
              if (!ta) return;
              const newText = ta.value.trim();
              if (!newText) { toast(translate('toast.empty'), 'err'); return; }
              record.text = newText;
              AI.embed(newText).then(function(v) {
                record.vector = v;
                return DB.put(record);
              }).then(function() {
                toast(translate('toast.edit.saved'), 'ok');
                isEditing = false;
                renderNoteView();
                renderBase();
                executeSearch();
              }).catch(function(err) {
                toast(String(err && err.message || err) || 'Edit failed', 'err');
              });
            };
          } else {
            const delBtn = document.getElementById('nv-del');
            const copyBtn = document.getElementById('nv-copy');
            const toggleBtn = document.getElementById('nv-toggle');
            const editBtn = document.getElementById('nv-edit');

            if (delBtn) delBtn.onclick = function() {
              if (!confirm(translate('nv.delete.confirm'))) return;
              DB.del(id).then(function() {
                toast(translate('toast.deleted'), 'ok');
                closeNoteView();
                renderBase();
                executeSearch();
              }).catch(function(err) {
                toast(String(err && err.message || err) || 'Delete failed', 'err');
              });
            };
            if (copyBtn) copyBtn.onclick = function() {
              copyToClipboard(record.text);
            };
            if (toggleBtn) toggleBtn.onclick = function() {
              record.shared = !record.shared;
              DB.put(record).then(function() {
                toast(record.shared ? translate('toast.saved.public') : translate('toast.saved.private'), 'ok');
                renderNoteView();
                renderBase();
                executeSearch();
              }).catch(function(err) {
                toast(String(err && err.message || err) || 'Toggle failed', 'err');
              });
            };
            if (editBtn) editBtn.onclick = function() {
              isEditing = true;
              renderNoteView();
            };
          }
        }

        function closeNoteView() {
          if (nvEscHandler) {
            document.removeEventListener('keydown', nvEscHandler);
            nvEscHandler = null;
          }
          if (nvOverlay) {
            nvOverlay.classList.remove('on');
            setTimeout(function() {
              if (nvOverlay && nvOverlay.parentNode) {
                try { nvOverlay.parentNode.removeChild(nvOverlay); } catch (_) { /* ignore */ }
              }
              nvOverlay = null;
            }, 200);
          }
        }

        nvEscHandler = function(e) {
          if (e.key === 'Escape') {
            closeNoteView();
          }
        };
        document.addEventListener('keydown', nvEscHandler);

        renderNoteView();
      }).catch(function(err) {
        toast(String(err && err.message || err) || 'Load note failed', 'err');
      });
    }

    function seedSamples() {
      if (!AI.ready()) {
        toast(translate('toast.ai.notready'), 'err');
        return Promise.resolve();
      }
      toast(translate('toast.samples.done').replace('{n}', '0'), 'info');
      const notes = [];

      function step(index) {
        if (index >= SAMPLES.length) {
          return DB.bulkPut(notes).then(function() {
            toast(translate('toast.samples.done').replace('{n}', String(notes.length)), 'ok');
            executeSearch();
            if (state.view === 'base') renderBase();
          });
        }
        return AI.embed(SAMPLES[index]).then(function(vector) {
          notes.push({
            id: 's' + Math.random().toString(36).slice(2, 10),
            text: SAMPLES[index],
            vector: vector,
            shared: true,
            createdAt: Date.now() - Math.floor(Math.random() * 1e7)
          });
          return step(index + 1);
        });
      }

      return step(0).catch(function(err) {
        toast(String(err && err.message || err) || 'Sample load failed', 'err');
        if (Logger) Logger.warn('seedSamples error', String(err && err.message || err));
      });
    }

    function exportData() {
      DB.all().then(function(notes) {
        if (!notes || notes.length === 0) { toast('0', 'err'); return; }
        const capsule = { app: 'noomium', format: 'v1', version: 1, exportedAt: Date.now(), notes: notes };
        const blob = new Blob([JSON.stringify(capsule, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = 'noomium-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(anchor);
        anchor.click();
        URL.revokeObjectURL(url);
        anchor.remove();
        toast('✓ ' + notes.length, 'ok');
      }).catch(function(err) {
        toast(String(err && err.message || err) || 'Export failed', 'err');
      });
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.onchange = function() {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function() {
          try {
            const data = JSON.parse(String(reader.result || '{}'));
            const notes = Array.isArray(data) ? data : (data.notes || []);
            if (!Array.isArray(notes)) throw new Error('bad format');
            const clean = [];
            for (let i = 0; i < notes.length; i++) {
              const note = notes[i];
              if (!note || typeof note.text !== 'string' || !note.text.trim()) continue;
              clean.push({
                id: note.id || ('i' + Math.random().toString(36).slice(2, 10)),
                text: note.text.trim(),
                vector: Array.isArray(note.vector) ? note.vector : null,
                shared: !!note.shared,
                createdAt: typeof note.createdAt === 'number' ? note.createdAt : Date.now()
              });
            }
            DB.bulkPut(clean).then(function() {
              toast('✓ ' + clean.length, 'ok');
              if (state.view === 'base') renderBase();
              executeSearch();
            }).catch(function(err) {
              toast(String(err && err.message || err) || 'Import failed', 'err');
            });
          } catch (err) {
            toast(String(err && err.message || err) || 'Import parse failed', 'err');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

          e.preventDefault();

        setStatus('net',
          count > 0
            ? translate('st.net.online') + ' · ' + Utils.word('peers', count, I18n.getLang())
            : translate('st.net.listen'),
          count > 0 ? 'ok' : 'load'
        );
        if (state.view === 'stream') executeSearch();
      });

      Bus.on('net:status', function(payload) {
        const status = payload && payload.status ? payload.status : 'disconnected';
        let text = translate('st.net');
        let cls = 'load';
        if (status === 'connected') {
          text = translate('st.net.online') + ' · ' + Utils.word('peers', Net.peerCount(), I18n.getLang());
          cls = 'ok';
        } else if (status === 'connecting') {
          text = translate('st.net.connecting'); cls = 'load';
        } else if (status === 'reconnecting') {
          text = translate('st.net.reconnecting'); cls = 'warn';
        } else if (status === 'failed') {
          text = translate('st.net.failed'); cls = 'err';
        }
        setStatus('net', text, cls);
      });
    }

    function bootApp() {
      setStatus('net', translate('st.net.connecting'), 'load');
      setStatus('ai', translate('st.ai.loading'), 'load');
      Progress.show();

      AI.load().then(function() {
        Progress.hide();
        setStatus('ai',
          AI.getMode() === 'model' ? translate('st.ai.ready') : translate('st.ai.demo'),
          AI.getMode() === 'model' ? 'ok' : 'warn'
        );
        if (!Config.get('onboarded', false)) {
          setTimeout(function() {
            seedSamples();
            Config.set('onboarded', true);
            Config.save();
          }, 300);
        }
      }).catch(function(err) {
        Progress.hide();
        if (Logger) Logger.error('AI', String(err && err.message || err));
        setStatus('ai', translate('st.ai.demo'), 'warn');
      });

      Net.init(function() { executeSearch(); }).then(function() {
        // init success
      }).catch(function(err) {
        if (Logger) Logger.error('Net', String(err && err.message || err));
        setStatus('net', translate('st.net.failed'), 'err');
      });
    }

    function setupWindowListeners() {
      const handlers = state.windowHandlers;

      if (handlers.resize) window.removeEventListener('resize', handlers.resize);
      if (handlers.focusin) window.removeEventListener('focusin', handlers.focusin);
      if (handlers.focusout) window.removeEventListener('focusout', handlers.focusout);
      if (handlers.orientationchange) window.removeEventListener('orientationchange', handlers.orientationchange);

      const setVH = function() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', vh + 'px');
      };

      handlers.resize = setVH;
      handlers.focusin = setVH;
      handlers.focusout = setVH;
      handlers.orientationchange = function() { setTimeout(setVH, 100); };

      window.addEventListener('resize', handlers.resize);
      window.addEventListener('focusin', handlers.focusin);
      window.addEventListener('focusout', handlers.focusout);
      window.addEventListener('orientationchange', handlers.orientationchange);

      setVH();
    }

    applyTheme(Config.get('theme', 'dark'));

    function mountApp() {
      try {
        let root = document.getElementById('app-root');
        if (!root) {
          root = document.createElement('div');
          root.id = 'app-root';
          document.body.appendChild(root);
        }
        document.body.classList.add('show-app');
        root.innerHTML = buildMarkup();
        setupWindowListeners();
        bindEvents();
        bootApp();
        if (Logger) Logger.info('App mounted');
      } catch (err) {
        console.error('App mount failed:', err);
        const root = document.getElementById('app-root');
        if (root) {
          root.textContent = '';
          const wrapper = document.createElement('div');
          wrapper.style.cssText = 'padding:40px;text-align:center;color:#ef4444';

          const heading = document.createElement('h2');
          heading.textContent = 'NOOmium failed to start';

          const message = document.createElement('p');
          message.style.cssText = 'color:#a0a0ae;margin-top:10px';
          message.textContent = String(err && err.message || err);

          const reloadBtn = document.createElement('button');
          reloadBtn.style.cssText = 'margin-top:20px;padding:10px 20px;background:#8b7cff;color:white;border:none;border-radius:8px;cursor:pointer';
          reloadBtn.textContent = 'Reload';
          reloadBtn.onclick = function() { location.reload(); };

          wrapper.appendChild(heading);
          wrapper.appendChild(message);
          wrapper.appendChild(reloadBtn);
          root.appendChild(wrapper);
          document.body.classList.add('show-app');
        }
      }
    }

    return { mount: mountApp };
  }, ['Logger', 'Bus', 'Store', 'Config', 'Utils', 'DB', 'AI', 'Net', 'I18n', 'Modal', 'Toast', 'Progress']);

  // ============================================================
  // Bootstrap
  // ============================================================
  function bootstrap() {
    try {
      const app = DI.resolve('App');
      app.mount();
    } catch (err) {
      console.error('Bootstrap failed:', err);
      let root = document.getElementById('app-root');
      if (!root) {
        root = document.createElement('div');
        root.id = 'app-root';
        document.body.appendChild(root);
      }
      root.textContent = '';
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'padding:40px;text-align:center;color:#ef4444';

      const heading = document.createElement('h2');
      heading.textContent = 'Startup failed';

      const message = document.createElement('p');
      message.style.cssText = 'color:#a0a0ae;margin-top:10px';
      message.textContent = String(err && err.message || err);

      const reloadBtn = document.createElement('button');
      reloadBtn.style.cssText = 'margin-top:20px;padding:10px 20px;background:#8b7cff;color:white;border:none;border-radius:8px;cursor:pointer';
      reloadBtn.textContent = 'Reload';
      reloadBtn.onclick = function() { location.reload(); };

      wrapper.appendChild(heading);
      wrapper.appendChild(message);
      wrapper.appendChild(reloadBtn);
      root.appendChild(wrapper);
      document.body.classList.add('show-app');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrap);
  } else {
    bootstrap();
  }
})();
</script>
</body>
</html>
