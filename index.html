<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1d232a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>NOOmium</title>
  
  <!-- Tailwind CSS + DaisyUI -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  
  <!-- Dexie.js (IndexedDB wrapper) -->
  <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.7/dist/dexie.min.js"></script>
  
  <!-- Day.js (dates) -->
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/locale/ru.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/locale/en.js"></script>
  
  <!-- NDK (Nostr Development Kit) -->
  <script src="https://cdn.jsdelivr.net/npm/@nostr-dev-kit/ndk@2.10.0/dist/index.umd.js"></script>
  
  <!-- nostr-tools (keys, signing) -->
  <script src="https://cdn.jsdelivr.net/npm/nostr-tools@2.7.2/lib/index.umd.js"></script>
  
  <!-- Transformers.js (AI models) -->
  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
    window.TransformersPipeline = pipeline;
    window.TransformersEnv = env;
  </script>

  <style>
    /* Custom styles (minimal) */
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-base-100 min-h-screen">
  
  <div id="app" x-data="app()" x-init="init()" x-cloak>
    
    <!-- HEADER COMPONENT -->
    <div x-data="header()" x-show="$store.app.initialized">
      <!-- TODO: Header with logo, status indicators, notifications badge -->
      <div class="navbar bg-base-200 shadow-lg">
        <div class="flex-1">
          <span class="text-xl font-bold px-4">NOOmium</span>
        </div>
        <div class="flex-none gap-2">
          <!-- Network status -->
          <div class="badge badge-ghost gap-2">
            <span class="w-2 h-2 rounded-full" :class="getNetworkStatusClass()"></span>
            <span x-text="getNetworkStatusText()"></span>
          </div>
          <!-- AI status -->
          <div class="badge badge-ghost gap-2">
            <span class="w-2 h-2 rounded-full" :class="getAIStatusClass()"></span>
            <span x-text="getAIStatusText()"></span>
          </div>
          <!-- Notifications -->
          <button class="btn btn-ghost btn-circle" @click="$store.notifications.showModal = true">
            <div class="indicator">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
              </svg>
              <span x-show="$store.notifications.unreadCount > 0" 
                    x-text="$store.notifications.unreadCount"
                    class="badge badge-sm badge-primary indicator-item"></span>
            </div>
          </button>
          <!-- Menu -->
          <button class="btn btn-ghost btn-circle" @click="$store.app.showMenu = true">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="container mx-auto p-4 max-w-4xl" x-show="$store.app.initialized">
      
      <!-- EDITOR COMPONENT -->
      <div x-data="editor()" class="mb-6">
        <!-- TODO: Textarea with send button, mode toggle (Private/World) -->
        <div class="card bg-base-200 shadow-xl">
          <div class="card-body">
            <textarea 
              x-model="text"
              @input="debouncedSearch()"
              class="textarea textarea-bordered h-24 text-lg"
              :placeholder="$store.app.t('editor.placeholder')"
            ></textarea>
            <div class="flex justify-between items-center mt-2">
              <span class="text-sm opacity-70" x-text="charCount"></span>
              <div class="flex gap-2">
                <!-- Mode toggle -->
                <div class="btn-group">
                  <button 
                    class="btn btn-sm"
                    :class="mode === 'private' ? 'btn-primary' : 'btn-ghost'"
                    @click="mode = 'private'"
                    x-text="$store.app.t('mode.private')"
                  ></button>
                  <button 
                    class="btn btn-sm"
                    :class="mode === 'world' ? 'btn-primary' : 'btn-ghost'"
                    @click="mode = 'world'"
                    x-text="$store.app.t('mode.world')"
                  ></button>
                </div>
                <button 
                  class="btn btn-primary"
                  :disabled="!text.trim() || !$store.app.aiReady"
                  @click="send()"
                  x-text="$store.app.t('btn.send')"
                ></button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- TABS NAVIGATION -->
      <div role="tablist" class="tabs tabs-lifted mb-4">
        <a 
          role="tab" 
          class="tab"
          :class="{ 'tab-active': activeTab === 'stream' }"
          @click="activeTab = 'stream'"
          x-text="$store.app.t('tab.stream')"
        ></a>
        <a 
          role="tab" 
          class="tab"
          :class="{ 'tab-active': activeTab === 'feed' }"
          @click="activeTab = 'feed'"
          x-text="$store.app.t('tab.feed')"
        ></a>
        <a 
          role="tab" 
          class="tab"
          :class="{ 'tab-active': activeTab === 'base' }"
          @click="activeTab = 'base'"
          x-text="$store.app.t('tab.base')"
        ></a>
      </div>

      <!-- STREAM TAB (Search results) -->
      <div x-show="activeTab === 'stream'" x-data="stream()">
        <!-- TODO: Three sections - My, World, Insights -->
        <div class="grid gap-4">
          <!-- My thoughts -->
          <div x-show="results.my.length > 0">
            <h3 class="text-lg font-bold mb-2" x-text="$store.app.t('stream.my')"></h3>
            <div class="space-y-2">
              <template x-for="note in results.my" :key="note.id">
                <div x-data="{ note }" class="card bg-base-200 shadow">
                  <div class="card-body p-4">
                    <p x-text="note.text"></p>
                    <div class="flex justify-between items-center mt-2">
                      <span class="badge badge-primary" x-text="Math.round(note.score * 100) + '%'"></span>
                      <div class="flex gap-1">
                        <button class="btn btn-ghost btn-xs" @click="edit(note)">
                          <span x-text="$store.app.t('btn.edit')"></span>
                        </button>
                        <button class="btn btn-ghost btn-xs" @click="toggleShare(note)">
                          <span x-text="note.shared ? $store.app.t('btn.hide') : $store.app.t('btn.share')"></span>
                        </button>
                        <button class="btn btn-ghost btn-xs btn-error" @click="delete(note)">
                          <span x-text="$store.app.t('btn.delete')"></span>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- World (public thoughts) -->
          <div x-show="results.world.length > 0">
            <h3 class="text-lg font-bold mb-2" x-text="$store.app.t('stream.world')"></h3>
            <div class="space-y-2">
              <template x-for="note in results.world" :key="note.id">
                <div class="card bg-base-200 shadow">
                  <div class="card-body p-4">
                    <p x-text="note.text"></p>
                    <div class="flex justify-between items-center mt-2">
                      <span class="badge badge-secondary" x-text="Math.round(note.score * 100) + '%'"></span>
                      <button class="btn btn-ghost btn-xs" @click="reply(note)">
                        <span x-text="$store.app.t('btn.reply')"></span>
                      </button>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- Insights (serendipity) -->
          <div x-show="results.insights.length > 0">
            <h3 class="text-lg font-bold mb-2" x-text="$store.app.t('stream.insights')"></h3>
            <div class="space-y-2">
              <template x-for="note in results.insights" :key="note.id">
                <div class="card bg-base-200 shadow">
                  <div class="card-body p-4">
                    <p x-text="note.text"></p>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>

      <!-- FEED TAB (Public thoughts stream) -->
      <div x-show="activeTab === 'feed'" x-data="feed()">
        <!-- TODO: Real-time feed of public thoughts from Nostr -->
        <div class="space-y-2">
          <template x-for="note in publicFeed" :key="note.id">
            <div class="card bg-base-200 shadow">
              <div class="card-body p-4">
                <div class="flex justify-between items-start mb-2">
                  <span class="badge badge-ghost" x-text="note.author.slice(0, 8)"></span>
                  <span class="text-xs opacity-60" x-text="formatDate(note.createdAt)"></span>
                </div>
                <p x-text="note.text"></p>
                <button class="btn btn-ghost btn-sm mt-2" @click="reply(note)">
                  <span x-text="$store.app.t('btn.reply')"></span>
                </button>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- BASE TAB (All notes) -->
      <div x-show="activeTab === 'base'" x-data="base()">
        <!-- TODO: Search, stats, list of all notes -->
        <div class="mb-4">
          <input 
            type="text" 
            x-model="searchQuery"
            @input="debouncedFilter()"
            :placeholder="$store.app.t('base.search')"
            class="input input-bordered w-full"
          />
        </div>
        <div class="stats shadow mb-4 w-full">
          <div class="stat">
            <div class="stat-title" x-text="$store.app.t('base.total')"></div>
            <div class="stat-value" x-text="stats.total"></div>
          </div>
          <div class="stat">
            <div class="stat-title" x-text="$store.app.t('base.shared')"></div>
            <div class="stat-value" x-text="stats.shared"></div>
          </div>
          <div class="stat">
            <div class="stat-title" x-text="$store.app.t('base.private')"></div>
            <div class="stat-value" x-text="stats.private"></div>
          </div>
        </div>
        <div class="space-y-2">
          <template x-for="note in filteredNotes" :key="note.id">
            <div class="card bg-base-200 shadow cursor-pointer" @click="openNote(note)">
              <div class="card-body p-4">
                <p class="line-clamp-3" x-text="note.text"></p>
                <div class="flex justify-between items-center mt-2">
                  <span class="badge" :class="note.shared ? 'badge-secondary' : 'badge-ghost'" 
                        x-text="note.shared ? $store.app.t('tag.shared') : $store.app.t('tag.private')"></span>
                  <span class="text-xs opacity-60" x-text="formatDate(note.createdAt)"></span>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>

    </main>

    <!-- MODALS -->
    
    <!-- Notifications Modal -->
    <div x-show="$store.notifications.showModal" 
         x-data="notificationsModal()"
         class="modal"
         :class="{ 'modal-open': $store.notifications.showModal }">
      <div class="modal-box">
        <h3 class="font-bold text-lg" x-text="$store.app.t('notifications.title')"></h3>
        <div class="py-4 space-y-2">
          <template x-for="notif in $store.notifications.list" :key="notif.id">
            <div class="alert" :class="notif.read ? 'alert-info' : 'alert-warning'">
              <div>
                <span x-text="notif.type === 'echo' ? '🔔' : '💬'"></span>
                <span x-text="notif.text"></span>
              </div>
              <button class="btn btn-sm btn-ghost" @click="markAsRead(notif)">✓</button>
            </div>
          </template>
        </div>
        <div class="modal-action">
          <button class="btn" @click="clearAll()" x-text="$store.app.t('btn.clearAll')"></button>
          <button class="btn btn-primary" @click="$store.notifications.showModal = false" x-text="$store.app.t('btn.close')"></button>
        </div>
      </div>
    </div>

    <!-- Menu Modal -->
    <div x-show="$store.app.showMenu" 
         x-data="menuModal()"
         class="modal"
         :class="{ 'modal-open': $store.app.showMenu }">
      <div class="modal-box">
        <h3 class="font-bold text-lg" x-text="$store.app.t('menu.title')"></h3>
        <div class="py-4 space-y-4">
          <!-- Theme toggle -->
          <div class="form-control">
            <label class="label cursor-pointer">
              <span class="label-text" x-text="$store.app.t('menu.darkMode')"></span>
              <input type="checkbox" class="toggle" 
                     :checked="$store.settings.theme === 'dark'"
                     @change="toggleTheme()" />
            </label>
          </div>
          <!-- Language -->
          <div class="form-control">
            <label class="label">
              <span class="label-text" x-text="$store.app.t('menu.language')"></span>
            </label>
            <select class="select select-bordered" 
                    x-model="$store.settings.lang"
                    @change="changeLang()">
              <option value="ru">Русский</option>
              <option value="en">English</option>
            </select>
          </div>
          <!-- Export/Import -->
          <div class="flex gap-2">
            <button class="btn btn-outline flex-1" @click="exportData()">
              <span x-text="$store.app.t('menu.export')"></span>
            </button>
            <button class="btn btn-outline flex-1" @click="importData()">
              <span x-text="$store.app.t('menu.import')"></span>
            </button>
          </div>
          <!-- Danger zone -->
          <div class="divider" x-text="$store.app.t('menu.danger')"></div>
          <button class="btn btn-error w-full" @click="wipeData()">
            <span x-text="$store.app.t('menu.wipe')"></span>
          </button>
        </div>
        <div class="modal-action">
          <button class="btn btn-primary" @click="$store.app.showMenu = false" x-text="$store.app.t('btn.close')"></button>
        </div>
      </div>
    </div>

    <!-- Onboarding Modal -->
    <div x-show="$store.app.showOnboarding" 
         x-data="onboardingModal()"
         class="modal"
         :class="{ 'modal-open': $store.app.showOnboarding }">
      <div class="modal-box">
        <h3 class="font-bold text-lg" x-text="$store.app.t('onboarding.title')"></h3>
        <div class="py-4 space-y-4">
          <p x-text="$store.app.t('onboarding.intro')"></p>
          <div class="space-y-2">
            <h4 class="font-bold" x-text="$store.app.t('onboarding.local')"></h4>
            <p class="text-sm opacity-70" x-text="$store.app.t('onboarding.localDesc')"></p>
            <h4 class="font-bold" x-text="$store.app.t('onboarding.world')"></h4>
            <p class="text-sm opacity-70" x-text="$store.app.t('onboarding.worldDesc')"></p>
            <h4 class="font-bold" x-text="$store.app.t('onboarding.insights')"></h4>
            <p class="text-sm opacity-70" x-text="$store.app.t('onboarding.insightsDesc')"></p>
          </div>
        </div>
        <div class="modal-action">
          <button class="btn btn-primary" @click="completeOnboarding()" x-text="$store.app.t('btn.gotIt')"></button>
        </div>
      </div>
    </div>

    <!-- Password Modal (First run or decrypt) -->
    <div x-show="$store.app.showPassword" 
         x-data="passwordModal()"
         class="modal"
         :class="{ 'modal-open': $store.app.showPassword }">
      <div class="modal-box">
        <h3 class="font-bold text-lg" x-text="isNewUser ? $store.app.t('password.create') : $store.app.t('password.enter')"></h3>
        <div class="py-4 space-y-4">
          <div class="form-control">
            <label class="label">
              <span class="label-text" x-text="$store.app.t('password.label')"></span>
            </label>
            <input type="password" x-model="password" class="input input-bordered" />
          </div>
          <div x-show="isNewUser" class="form-control">
            <label class="label">
              <span class="label-text" x-text="$store.app.t('password.confirm')"></span>
            </label>
            <input type="password" x-model="passwordConfirm" class="input input-bordered" />
          </div>
          <div x-show="error" class="alert alert-error">
            <span x-text="error"></span>
          </div>
        </div>
        <div class="modal-action">
          <button x-show="!isNewUser" class="btn btn-ghost" @click="resetStorage()">
            <span x-text="$store.app.t('password.forgot')"></span>
          </button>
          <button class="btn btn-primary" @click="submitPassword()">
            <span x-text="isNewUser ? $store.app.t('btn.save') : $store.app.t('btn.login')"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- AI Loading Progress -->
    <div x-show="$store.app.aiLoading" 
         class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
      <div class="bg-base-100 p-8 rounded-lg shadow-xl text-center">
        <div class="loading loading-spinner loading-lg mb-4"></div>
        <p x-text="$store.app.t('ai.loading')"></p>
        <p class="text-sm opacity-70 mt-2" x-text="$store.app.aiProgress + '%'"></p>
      </div>
    </div>

  </div>
