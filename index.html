    function setStatus(which, text, cls) {
      const dot = document.getElementById('st-' + which + '-dot');
      const txtEl = document.getElementById('st-' + which + '-txt');
      if (dot) dot.className = 'st-dot ' + (cls || '');
      if (txtEl) txtEl.textContent = text;
    }

    function switchView(viewName) {
      state.view = viewName;
      document.querySelectorAll('.btab-b').forEach(function(b) {
        b.classList.toggle('on', b.getAttribute('data-v') === viewName);
      });
      const streamEl = document.getElementById('ws-stream');
      const baseEl = document.getElementById('ws-base');
      if (streamEl) streamEl.style.display = viewName === 'stream' ? 'flex' : 'none';
      if (baseEl) baseEl.style.display = viewName === 'base' ? 'flex' : 'none';
      if (viewName === 'base') renderBase();
    }

    // === setSegment теперь прокручивает к нужной панели ===
    function setSegment(segKey) {
      if (state.seg === segKey) return;
      state.seg = segKey;
      document.querySelectorAll('.seg-b').forEach(function(b) {
        b.classList.toggle('on', b.getAttribute('data-k') === segKey);
      });
      const panel = document.getElementById('panel-' + segKey);
      if (panel) {
        panel.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
      }
    }

    function highlightText(text, query) {
      if (!query) return Utils.esc(text);
      let out = Utils.esc(text);
      const words = query.toLowerCase().split(/\s+/).filter(function(w) { return w.length > 2; });
      for (let i = 0; i < words.length; i++) {
        const re = new RegExp('(' + Utils.escRe(words[i]) + ')', 'gi');
        out = out.replace(re, '<mark>$1</mark>');
      }
      return out;
    }

    function isOwnItem(item) { return !item.peer; }

    // === Упрощённая разметка карточки: adopt УДАЛЁН ===
    function renderItemHTML(item, seg) {
      if (!item) return '';
      const own = isOwnItem(item);
      const typeLabel = own
        ? (item.shared ? translate('base.tag.shared') : translate('base.tag.private'))
        : ('· ' + item.peer);
      const score = typeof item.score === 'number' ? Math.round(item.score * 100) + '%' : '';
      const queryText = getEditorValue();
      let actions = '';

      if (own) {
        // Свои мысли: toggle, copy, develop, del
        actions =
          '<button class="fi-act" data-act="toggle" data-id="' + Utils.esc(item.id) + '">' +
            (item.shared ? translate('btn.toggle.priv') : translate('btn.toggle.pub')) +
          '</button>' +
          '<button class="fi-act" data-act="copy" data-id="' + Utils.esc(item.id) + '">' + translate('btn.copy') + '</button>' +
          '<button class="fi-act" data-act="develop" data-id="' + Utils.esc(item.id) + '">' + translate('btn.develop') + '</button>' +
          '<button class="fi-act danger" data-act="del" data-id="' + Utils.esc(item.id) + '">' + translate('btn.del') + '</button>';
      } else {
        // Чужие мысли: только develop
        actions =
          '<button class="fi-act primary" data-act="develop" data-id="' + Utils.esc(item.id) + '">' + translate('btn.develop') + '</button>';
      }

      return '<div class="fi t-' + Utils.esc(seg) + '" data-id="' + Utils.esc(item.id) + '">' +
        '<div class="fi-h"><span class="fi-badge">' + Utils.esc(typeLabel) + '</span><span class="fi-score">' + Utils.esc(score) + '</span></div>' +
        '<div class="fi-body">' + highlightText(item.text, queryText) + '</div>' +
        '<div class="fi-foot">' + actions + '</div></div>';
    }

    // === renderPanels — рендерит карточки в три вертикальные панели ===
    function renderPanels() {
      ['local', 'world', 'seren'].forEach(function(seg) {
        const panel = document.getElementById('panel-' + seg);
        if (!panel) return;
        const list = state.lists[seg];
        if (!list || list.length === 0) {
          const emptyMessages = {
            local: { t: translate('empty.local.t'), d: translate('empty.local.d') },
            world: { t: translate('empty.world.t'), d: translate('empty.world.d') },
            seren: { t: translate('empty.seren.t'), d: translate('empty.seren.d') }
          };
          const msg = emptyMessages[seg];
          panel.innerHTML = '<div class="feed-empty"><div class="feed-empty-ic">◇</div>' +
            '<div class="feed-empty-t">' + Utils.esc(msg.t) + '</div>' +
            '<div class="feed-empty-d">' + Utils.esc(msg.d) + '</div></div>';
          return;
        }
        panel.innerHTML = list.map(function(item) {
          return renderItemHTML(item, seg);
        }).join('');
      });
    }

    // === handleItemAction — adopt УДАЛЁН, develop работает для всех ===
    function handleItemAction(action, element) {
      if (!element) return;
      const id = element.getAttribute('data-id');

      if (action === 'develop') {
        // Ищем элемент во всех списках
        let item = null;
        for (const seg of ['local', 'world', 'seren']) {
          const list = state.lists[seg];
          for (let i = 0; i < list.length; i++) {
            if (list[i].id === id) { item = list[i]; break; }
          }
          if (item) break;
        }
        if (item) {
          setEditorValue(item.text);
          updateCounter();
          const ta = document.getElementById('ed-ta');
          if (ta) ta.focus();
        }
        return;
      }

      if (action === 'copy') {
        let item = null;
        for (const seg of ['local', 'world', 'seren']) {
          const list = state.lists[seg];
          for (let i = 0; i < list.length; i++) {
            if (list[i].id === id) { item = list[i]; break; }
          }
          if (item) break;
        }
        if (item) copyToClipboard(item.text);
        return;
      }

      if (action === 'del') {
        if (!confirm(translate('base.wipe.confirm').replace('все ваши мысли', 'эту мысль'))) return;
        DB.del(id).then(function() {
          toast(translate('toast.deleted'), 'ok');
          for (const seg of ['local', 'world', 'seren']) {
            state.lists[seg] = state.lists[seg].filter(function(n) { return n.id !== id; });
          }
          renderPanels();
          if (state.view === 'base') renderBase();
        }).catch(function(err) {
          toast(String(err && err.message || err) || 'Delete failed', 'err');
        });
        return;
      }

      if (action === 'toggle') {
        DB.get(id).then(function(record) {
          if (!record) return;
          record.shared = !record.shared;
          return DB.put(record).then(function() {
            toast(record.shared ? translate('toast.saved.public') : translate('toast.saved.private'), 'ok');
            executeSearch();
            if (state.view === 'base') renderBase();
          });
        }).catch(function(err) {
          toast(String(err && err.message || err) || 'Toggle failed', 'err');
        });
        return;
      }
    }

    function copyToClipboard(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            function() { toast(translate('toast.copied'), 'ok'); },
            function() { toast(translate('toast.copy.fail'), 'err'); }
          );
        } else {
          const ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
          document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); toast(translate('toast.copied'), 'ok'); }
          catch (err) { toast(translate('toast.copy.fail'), 'err'); }
          document.body.removeChild(ta);
        }
      } catch (err) { toast(translate('toast.copy.fail'), 'err'); }
    }

    function updateCounter() {
      const value = getEditorValue();
      const counter = document.getElementById('ed-cnt');
      if (counter) counter.textContent = Utils.word('symbols', value.length, I18n.getLang());
    }

    function handleSend() {
      if (state.sendLock) return;
      const text = getEditorValue().trim();
      if (!text) { toast(translate('toast.empty'), 'warn'); return; }
      if (!AI.ready()) { toast(translate('toast.ai.notready'), 'err'); return; }

      const isWorld = state.sendMode === 'world';
      const btn = document.getElementById('btn-send');
      state.sendLock = true;
      if (btn) { btn.classList.add('sending'); btn.disabled = true; btn.innerHTML = SPINNER_SVG; }

      AI.embed(text)
        .then(function(vector) {
          return DB.put({
            id: Math.random().toString(36).slice(2, 10), text: text, vector: vector,
            shared: !!isWorld, createdAt: Date.now()
          });
        })
        .then(function() {
          setEditorValue(''); updateCounter(); state.lastVec = null;
          toast(isWorld ? translate('toast.saved.public') : translate('toast.saved.private'), 'ok');
          executeSearch(); if (state.view === 'base') renderBase();
        })
        .catch(function(err) { toast(String(err && err.message || err) || 'Send failed', 'err'); })
        .finally(function() {
          state.sendLock = false;
          if (btn) { btn.classList.remove('sending'); btn.disabled = false; btn.innerHTML = PAPER_PLANE_SVG; }
        });
    }

    function handleToggleMode(newMode) {
      if (newMode === state.sendMode) return;
      state.sendMode = newMode;
      const toggleEl = document.getElementById('mode-toggle');
      if (!toggleEl) return;
      toggleEl.setAttribute('data-mode', state.sendMode);
      toggleEl.querySelectorAll('.tog-sw-opt').forEach(function(opt) {
        opt.classList.toggle('on', opt.getAttribute('data-v') === state.sendMode);
      });
    }

    function bindEditorSwipe() {
      const ta = document.getElementById('ed-ta');
      if (!ta) return;
      let startY = 0, startX = 0, startTime = 0, active = false;
      ta.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) return;
        startY = e.touches[0].clientY; startX = e.touches[0].clientX;
        startTime = Date.now(); active = true;
      }, { passive: true });
      ta.addEventListener('touchend', function(e) {
        if (!active) return; active = false;
        const dt = Date.now() - startTime;
        const endY = e.changedTouches[0].clientY, endX = e.changedTouches[0].clientX;
        const dy = endY - startY, dx = endX - startX;
        if (dt < 700 && Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx) * 1.5) {
          if (dy < 0) handleToggleMode('world'); else handleToggleMode('private');
          setTimeout(handleSend, 80);
        }
      }, { passive: true });
    }

    function executeSearch(force) {
      const text = getEditorValue();
      if (!text || !AI.ready()) {
        state.lists = { local: [], world: [], seren: [] };
        updateCounts(); renderPanels();
        return Promise.resolve();
      }
      return AI.embed(text).then(function(vec) {
        if (!vec) return;
        if (!state.lastVec || AI.cosine(vec, state.lastVec) < 0.98 || force) {
          state.lastVec = vec; state.lastQuery = Date.now();
          if (AI.getMode() === 'model' && Net && typeof Net.send === 'function') Net.send(vec);
        }
        return DB.all().then(function(notes) {
          const localScored = [];
          for (let i = 0; i < notes.length; i++) {
            const note = notes[i];
            if (note && note.vector) localScored.push(Object.assign({}, note, { score: AI.cosine(vec, note.vector) }));
          }
          const worldAnswers = Net.activeAnswers();
          const worldScored = [];
          for (let i = 0; i < worldAnswers.length; i++) {
            worldScored.push(Object.assign({}, worldAnswers[i], { score: AI.cosine(vec, worldAnswers[i].vector) }));
          }
          const threshold = Config.get('threshold', 0.30);
          const serendipityDelta = Config.get('serendipity', 0.15);
          state.lists.local = localScored.filter(function(n) { return n.score >= threshold; })
            .sort(function(a, b) { return b.score - a.score; });
          state.lists.world = worldScored.filter(function(n) { return n.score >= threshold; })
            .sort(function(a, b) { return b.score - a.score; });
          state.lists.seren = localScored.concat(worldScored)
            .filter(function(n) { return n.score >= (threshold - serendipityDelta) && n.score < threshold; })
            .sort(function(a, b) { return b.score - a.score; });
          updateCounts(); renderPanels();
        });
      }).catch(function(err) {
        toast(String(err && err.message || err) || 'Search failed', 'err');
        if (Logger) Logger.warn('executeSearch error', String(err && err.message || err));
      });
    }

    function updateCounts() {
      ['local', 'world', 'seren'].forEach(function(key) {
        const el = document.getElementById('c-' + key);
        if (el) el.textContent = state.lists[key].length;
      });
    }

    function buildStatCard(value, label) {
      return '<div class="stat"><div class="stat-v">' + Utils.esc(String(value)) + '</div>' +
             '<div class="stat-l">' + Utils.esc(label) + '</div></div>';
    }

    function renderBase() {
      DB.all().then(function(allNotes) {
        const statsEl = document.getElementById('base-stats');
        if (statsEl) {
          let sharedCount = 0;
          for (let i = 0; i < allNotes.length; i++) { if (allNotes[i] && allNotes[i].shared) sharedCount++; }
          statsEl.innerHTML =
            buildStatCard(allNotes.length, translate('base.stat.total')) +
            buildStatCard(sharedCount, translate('base.stat.open')) +
            buildStatCard(allNotes.length - sharedCount, translate('base.stat.priv'));
        }
        const queryInput = document.getElementById('base-q');
        const sortSelect = document.getElementById('base-sort');
        const queryValue = queryInput ? queryInput.value.trim().toLowerCase() : '';
        const sortValue = sortSelect ? sortSelect.value : 'new';
        let list = allNotes.slice();
        if (queryValue) list = list.filter(function(n) { return n.text && n.text.toLowerCase().indexOf(queryValue) >= 0; });
        if (sortValue === 'old') list.sort(function(a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
        else if (sortValue === 'az') list.sort(function(a, b) { return (a.text || '').localeCompare(b.text || '', I18n.getLang() === 'en' ? 'en' : 'ru'); });
        else list.sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });

        const container = document.getElementById('base-list');
        if (!container) return;
        if (list.length === 0) {
          const emptyTitle = translate('empty.base.t');
          const emptyDesc = allNotes.length === 0 ? translate('empty.base.d') : translate('empty.base.empty');
          container.innerHTML = '<div class="feed-empty"><div class="feed-empty-ic">▤</div>' +
            '<div class="feed-empty-t">' + Utils.esc(emptyTitle) + '</div>' +
            '<div class="feed-empty-d">' + Utils.esc(emptyDesc) + '</div>' +
            (allNotes.length === 0 ? '<button class="btn-send" id="btn-seed" style="margin-top:12px">' + Utils.esc(translate('base.seed')) + '</button>' : '') +
            '</div>';
          const seedBtn = document.getElementById('btn-seed');
          if (seedBtn) seedBtn.onclick = seedSamples;
          return;
        }
        container.innerHTML = list.map(function(note) {
          const dateStr = Utils.fmtDate(note.createdAt, I18n.getLang());
          const escapedText = Utils.esc(note.text);
          const isLongText = escapedText.length > 280;
          return '<div class="bi ' + (note.shared ? 'shared' : '') + '" data-id="' + Utils.esc(note.id) + '">' +
            '<div class="bi-t' + (isLongText ? ' truncated' : '') + '">' + escapedText + '</div>' +
            '<div class="bi-f"><div class="bi-meta">' +
              '<span class="bi-tag">' + Utils.esc(note.shared ? translate('base.tag.shared') : translate('base.tag.private')) + '</span>' +
              '<span class="bi-date">' + Utils.esc(dateStr) + '</span>' +
            '</div>' +
            '<div class="bi-acts">' +
              '<button class="bi-act" data-act="edit" data-id="' + Utils.esc(note.id) + '">' + Utils.esc(translate('btn.edit')) + '</button>' +
              '<button class="bi-act" data-act="toggle" data-id="' + Utils.esc(note.id) + '">' +
                Utils.esc(note.shared ? translate('btn.toggle.priv') : translate('btn.toggle.pub')) +
              '</button>' +
              '<button class="bi-act" data-act="copy" data-id="' + Utils.esc(note.id) + '">' + Utils.esc(translate('btn.copy')) + '</button>' +
              '<button class="bi-act danger" data-act="del" data-id="' + Utils.esc(note.id) + '">' + Utils.esc(translate('btn.del')) + '</button>' +
            '</div></div></div>';
        }).join('');
      }).catch(function(err) {
        toast(String(err && err.message || err) || 'Base load failed', 'err');
        if (Logger) Logger.warn('renderBase error', String(err && err.message || err));
      });
    }

    function handleBaseAction(action, id) {
      if (action === 'edit') {
        DB.get(id).then(function(record) {
          if (!record) return;
          const bodyEl = document.createElement('div');
          const textarea = document.createElement('textarea');
          textarea.className = 'fi-textarea'; textarea.value = record.text; textarea.style.minHeight = '140px';
          const privLabel = document.createElement('label');
          privLabel.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--text-2);cursor:pointer';
          const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = record.shared;
          privLabel.appendChild(checkbox); privLabel.appendChild(document.createTextNode(' ' + translate('base.tag.shared')));
          bodyEl.appendChild(textarea); bodyEl.appendChild(privLabel);
          Modal.open({
            title: translate('btn.edit'), body: bodyEl,
            buttons: [
              { text: translate('btn.cancel'), onClick: function() { Modal.close(); } },
              { text: translate('btn.save'), primary: true, onClick: function() {
                record.text = textarea.value.trim(); record.shared = checkbox.checked;
                if (!record.text) { toast(translate('toast.empty'), 'err'); return; }
                AI.embed(record.text).then(function(v) { record.vector = v; return DB.put(record); })
                  .then(function() {
                    toast(translate('toast.edit.saved'), 'ok'); Modal.close();
                    renderBase(); executeSearch();
                  }).catch(function(err) { toast(String(err && err.message || err) || 'Edit failed', 'err'); });
              }}
            ]
          });
        }).catch(function(err) { toast(String(err && err.message || err) || 'Load for edit failed', 'err'); });
      } else if (action === 'toggle') {
        DB.get(id).then(function(record) {
          if (!record) return; record.shared = !record.shared;
          return DB.put(record).then(function() {
            toast(record.shared ? translate('toast.saved.public') : translate('toast.saved.private'), 'ok');
            renderBase(); executeSearch();
          });
        }).catch(function(err) { toast(String(err && err.message || err) || 'Toggle failed', 'err'); });
      } else if (action === 'copy') {
        DB.get(id).then(function(record) { if (record) copyToClipboard(record.text); })
          .catch(function(err) { toast(String(err && err.message || err) || 'Copy failed', 'err'); });
      } else if (action === 'del') {
        if (!confirm(translate('base.wipe.confirm'))) return;
        DB.del(id).then(function() { toast(translate('toast.deleted'), 'ok'); renderBase(); executeSearch(); })
          .catch(function(err) { toast(String(err && err.message || err) || 'Delete failed', 'err'); });
      }
    }

    function seedSamples() {
      if (!AI.ready()) { toast(translate('toast.ai.notready'), 'err'); return Promise.resolve(); }
      toast(translate('toast.samples.done').replace('{n}', '0'), 'info');
      const notes = [];
      function step(index) {
        if (index >= SAMPLES.length) {
          return DB.bulkPut(notes).then(function() {
            toast(translate('toast.samples.done').replace('{n}', String(notes.length)), 'ok');
            executeSearch(); if (state.view === 'base') renderBase();
          });
        }
        return AI.embed(SAMPLES[index]).then(function(vector) {
          notes.push({
            id: 's' + Math.random().toString(36).slice(2, 10), text: SAMPLES[index],
            vector: vector, shared: true, createdAt: Date.now() - Math.floor(Math.random() * 1e7)
          });
          return step(index + 1);
        });
      }
      return step(0).catch(function(err) {
        toast(String(err && err.message || err) || 'Sample load failed', 'err');
        if (Logger) Logger.warn('seedSamples error', String(err && err.message || err));
      });
    }

    function exportData() {
      DB.all().then(function(notes) {
        if (!notes || notes.length === 0) { toast('0', 'err'); return; }
        const capsule = { app: 'noomium', format: 'v1', version: 1, exportedAt: Date.now(), notes: notes };
        const blob = new Blob([JSON.stringify(capsule, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url; anchor.download = 'noomium-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(anchor); anchor.click(); URL.revokeObjectURL(url); anchor.remove();
        toast('✓ ' + notes.length, 'ok');
      }).catch(function(err) { toast(String(err && err.message || err) || 'Export failed', 'err'); });
    }

    function importData() {
      const input = document.createElement('input'); input.type = 'file'; input.accept = 'application/json,.json';
      input.onchange = function() {
        const file = input.files && input.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function() {
          try {
            const data = JSON.parse(String(reader.result || '{}'));
            const notes = Array.isArray(data) ? data : (data.notes || []);
            if (!Array.isArray(notes)) throw new Error('bad format');
            const clean = [];
            for (let i = 0; i < notes.length; i++) {
              const note = notes[i];
              if (!note || typeof note.text !== 'string' || !note.text.trim()) continue;
              clean.push({
                id: note.id || ('i' + Math.random().toString(36).slice(2, 10)),
                text: note.text.trim(), vector: Array.isArray(note.vector) ? note.vector : null,
                shared: !!note.shared, createdAt: typeof note.createdAt === 'number' ? note.createdAt : Date.now()
              });
            }
            DB.bulkPut(clean).then(function() {
              toast('✓ ' + clean.length, 'ok');
              if (state.view === 'base') renderBase(); executeSearch();
            }).catch(function(err) { toast(String(err && err.message || err) || 'Import failed', 'err'); });
          } catch (err) { toast(String(err && err.message || err) || 'Import parse failed', 'err'); }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function openMenu() {
      const body = document.createElement('div');
      const appSection = document.createElement('div');
      appSection.className = 'set-sec';
      appSection.innerHTML = '<div class="set-sec-t">' + Utils.esc(translate('menu.settings')) + '</div>';

      const themeRow = document.createElement('button');
      themeRow.className = 'tog ' + (Config.get('theme', 'dark') === 'light' ? 'on' : '');
      themeRow.innerHTML = '<span class="tog-ic">◐</span><span class="tog-lbl">' + Utils.esc(translate('menu.theme')) + '</span><div class="tog-track"><div class="tog-thumb"></div></div>';
      themeRow.onclick = function() {
        const current = Config.get('theme', 'dark'); const next = current === 'dark' ? 'light' : 'dark';
        applyTheme(next); themeRow.classList.toggle('on', next === 'light');
      };
      appSection.appendChild(themeRow);

      const langRow = document.createElement('div');
      langRow.style.marginTop = '8px';
      langRow.innerHTML = '<div class="fl" style="margin-bottom:5px">' + Utils.esc(translate('menu.lang')) + '</div>';
      const langSwitch = document.createElement('div'); langSwitch.className = 'lang-sw';
      ['ru', 'en'].forEach(function(lang) {
        const langBtn = document.createElement('button');
        langBtn.className = 'lang-sw-b' + (I18n.getLang() === lang ? ' on' : '');
        langBtn.textContent = lang.toUpperCase();
        langBtn.onclick = function() {
          I18n.setLang(lang);
          langSwitch.querySelectorAll('.lang-sw-b').forEach(function(x) {
            x.classList.toggle('on', x.textContent.toLowerCase() === lang);
          });
          Modal.close();
          setTimeout(function() {
            const root = document.getElementById('app-root');
            if (root) root.innerHTML = '';
            mountApp();
          }, 50);
        };
        langSwitch.appendChild(langBtn);
      });
      langRow.appendChild(langSwitch); appSection.appendChild(langRow);

      const helpBtn = document.createElement('button'); helpBtn.className = 'tog'; helpBtn.style.marginTop = '8px';
      helpBtn.innerHTML = '<span class="tog-ic">?</span><span class="tog-lbl">' + Utils.esc(translate('menu.help')) + '</span><span class="tog-arr">→</span>';
      helpBtn.onclick = function() { Modal.close(); setTimeout(openHelp, 200); };
      appSection.appendChild(helpBtn); body.appendChild(appSection);

      const netSection = document.createElement('div'); netSection.className = 'set-sec';
      netSection.innerHTML = '<div class="set-sec-t">' + Utils.esc(translate('set.advanced')) + '</div>';
      const roomInput = document.createElement('input'); roomInput.type = 'text';
      roomInput.className = 'fi-input'; roomInput.value = Config.get('room', 'noomium-main');
      const roomGroup = document.createElement('div'); roomGroup.className = 'fg';
      roomGroup.innerHTML = '<label class="fl">' + Utils.esc(translate('set.room')) + '</label>';
      roomGroup.appendChild(roomInput);
      const roomHint = document.createElement('div'); roomHint.className = 'fh';
      roomHint.textContent = translate('set.room.hint'); roomGroup.appendChild(roomHint);
      netSection.appendChild(roomGroup);

      const thresholdInput = document.createElement('input'); thresholdInput.type = 'range';
      thresholdInput.className = 'fr'; thresholdInput.min = '0.1'; thresholdInput.max = '0.7';
      thresholdInput.step = '0.05'; thresholdInput.value = Config.get('threshold', 0.30);
      const thresholdValue = document.createElement('span'); thresholdValue.className = 'rv';
      thresholdValue.textContent = Number(Config.get('threshold', 0.30)).toFixed(2);
      thresholdInput.oninput = function(e) { thresholdValue.textContent = parseFloat(e.target.value).toFixed(2); };
      const thresholdGroup = document.createElement('div'); thresholdGroup.className = 'fg';
      thresholdGroup.innerHTML = '<label class="fl">' + Utils.esc(translate('set.threshold')) + '</label>';
      const thresholdWrapper = document.createElement('div');
      thresholdWrapper.appendChild(thresholdInput); thresholdWrapper.appendChild(thresholdValue);
      thresholdGroup.appendChild(thresholdWrapper);
      const thresholdHint = document.createElement('div'); thresholdHint.className = 'fh';
      thresholdHint.textContent = translate('set.threshold.hint'); thresholdGroup.appendChild(thresholdHint);
      netSection.appendChild(thresholdGroup);

      const serenInput = document.createElement('input'); serenInput.type = 'range';
      serenInput.className = 'fr'; serenInput.min = '0.05'; serenInput.max = '0.3';
      serenInput.step = '0.01'; serenInput.value = Config.get('serendipity', 0.15);
      const serenValue = document.createElement('span'); serenValue.className = 'rv';
      serenValue.textContent = Number(Config.get('serendipity', 0.15)).toFixed(2);
      serenInput.oninput = function(e) { serenValue.textContent = parseFloat(e.target.value).toFixed(2); };
      const serenGroup = document.createElement('div'); serenGroup.className = 'fg';
      serenGroup.innerHTML = '<label class="fl">' + Utils.esc(translate('set.seren')) + '</label>';
      const serenWrapper = document.createElement('div');
      serenWrapper.appendChild(serenInput); serenWrapper.appendChild(serenValue);
      serenGroup.appendChild(serenWrapper);
      const serenHint = document.createElement('div'); serenHint.className = 'fh';
      serenHint.textContent = translate('set.seren.hint'); serenGroup.appendChild(serenHint);
      netSection.appendChild(serenGroup);

      const relaysInput = document.createElement('textarea'); relaysInput.className = 'fi-textarea';
      relaysInput.value = Config.get('relays', []).join('\n');
      const relaysGroup = document.createElement('div'); relaysGroup.className = 'fg';
      relaysGroup.innerHTML = '<label class="fl">' + Utils.esc(translate('set.relays')) + '</label>';
      relaysGroup.appendChild(relaysInput);
      const relaysHint = document.createElement('div'); relaysHint.className = 'fh';
      relaysHint.textContent = translate('set.relays.hint'); relaysGroup.appendChild(relaysHint);
      netSection.appendChild(relaysGroup); body.appendChild(netSection);

      const dataSection = document.createElement('div'); dataSection.className = 'set-sec';
      dataSection.innerHTML = '<div class="set-sec-t">' + Utils.esc(translate('set.data')) + '</div>';
      const seedBtn = document.createElement('button'); seedBtn.className = 'tog';
      seedBtn.innerHTML = '<span class="tog-ic">◇</span><span class="tog-lbl">' + Utils.esc(translate('set.samples')) + '</span><span class="tog-arr">→</span>';
      seedBtn.onclick = function() { Modal.close(); setTimeout(seedSamples, 200); };
      dataSection.appendChild(seedBtn);

      const exportBtn = document.createElement('button'); exportBtn.className = 'tog'; exportBtn.style.marginTop = '4px';
      exportBtn.innerHTML = '<span class="tog-ic">↓</span><span class="tog-lbl">' + Utils.esc(translate('menu.export')) + '</span><span class="tog-arr">→</span>';
      exportBtn.onclick = function() { Modal.close(); setTimeout(exportData, 200); };
      dataSection.appendChild(exportBtn);

      const importBtn = document.createElement('button'); importBtn.className = 'tog'; importBtn.style.marginTop = '4px';
      importBtn.innerHTML = '<span class="tog-ic">↑</span><span class="tog-lbl">' + Utils.esc(translate('menu.import')) + '</span><span class="tog-arr">→</span>';
      importBtn.onclick = function() { Modal.close(); setTimeout(importData, 200); };
      dataSection.appendChild(importBtn); body.appendChild(dataSection);

      const dangerSection = document.createElement('div'); dangerSection.className = 'set-sec';
      dangerSection.innerHTML = '<div class="set-sec-t">' + Utils.esc(translate('set.danger')) + '</div>';
      const wipeBtn = document.createElement('button'); wipeBtn.className = 'btn-send';
      wipeBtn.style.cssText = 'width:100%;background:var(--danger-glow);color:var(--danger);border:1px solid rgba(239,68,68,.3);box-shadow:none';
      wipeBtn.textContent = translate('base.wipe');
      wipeBtn.onclick = function() {
        if (!confirm(translate('base.wipe.confirm'))) return;
        DB.reset().then(function() { toast(translate('toast.base.wiped'), 'ok'); setTimeout(function() { location.reload(); }, 500); })
          .catch(function(err) { toast(String(err && err.message || err) || 'Wipe failed', 'err'); });
      };
      dangerSection.appendChild(wipeBtn); body.appendChild(dangerSection);

      Modal.open({
        title: '', body: body,
        buttons: [
          { text: translate('btn.cancel'), onClick: function() { Modal.close(); } },
          { text: translate('btn.save'), primary: true, onClick: function() {
            Config.set('room', roomInput.value.trim() || 'noomium-main');
            Config.set('threshold', parseFloat(thresholdInput.value));
            Config.set('serendipity', parseFloat(serenInput.value));
            const relaysText = relaysInput.value.trim();
            const relays = relaysText
              ? relaysText.split(/[\n,]+/).map(function(r) { return r.trim(); }).filter(function(r) { return r && /^wss?:\/\//.test(r); })
              : Config.defaults().relays;
            Config.set('relays', relays); Config.save(); Modal.close();
            toast(translate('toast.net.restart'), 'info');
            setTimeout(function() { if (Net && Net.restart) Net.restart(function() { executeSearch(); }); }, 300);
          }}
        ]
      });
    }

    function openHelp() {
      const body = document.createElement('div');
      body.innerHTML =
        '<div class="help-sec"><div class="help-st">' + Utils.esc(translate('seg.local')) + '</div><div class="help-sd">' + Utils.esc(translate('help.local')) + '</div></div>' +
        '<div class="help-sec"><div class="help-st">' + Utils.esc(translate('seg.world')) + '</div><div class="help-sd">' + Utils.esc(translate('help.world')) + '</div></div>' +
        '<div class="help-sec"><div class="help-st">' + Utils.esc(translate('seg.seren')) + '</div><div class="help-sd">' + Utils.esc(translate('help.seren')) + '</div></div>' +
        '<div class="help-box">' + Utils.esc(translate('help.philosophy')) + '</div>' +
        '<div class="help-box">' + Utils.esc(translate('help.gestures')) + '</div>' +
        '<div style="margin-top:12px"><div class="help-st">' + Utils.esc(translate('help.keys')) + '</div>' +
        '<div class="help-keys"><div>' + Utils.esc(translate('help.k1')) + '</div><div>' + Utils.esc(translate('help.k2')) + '</div></div></div>';
      Modal.open({
        title: translate('help.title'), body: body,
        buttons: [{ text: translate('btn.close'), primary: true, onClick: function() { Modal.close(); } }]
      });
    }

    // === Обработчик горизонтального скролла: синхронизирует активную категорию ===
    function handleContainerScroll() {
      const container = document.getElementById('cards-container');
      if (!container) return;
      const scrollLeft = container.scrollLeft;
      const panelWidth = container.clientWidth;
      if (panelWidth <= 0) return;
      const panels = ['local', 'world', 'seren'];
      const idx = Math.round(scrollLeft / panelWidth);
      const newSeg = panels[Math.min(Math.max(idx, 0), 2)];
      if (newSeg !== state.seg) {
        state.seg = newSeg;
        document.querySelectorAll('.seg-b').forEach(function(b) {
          b.classList.toggle('on', b.getAttribute('data-k') === newSeg);
        });
      }
    }

    function bindEvents() {
      const editor = document.getElementById('ed-ta');
      if (editor) {
        editor.addEventListener('input', function() {
          updateCounter();
          if (state.searchTimer) clearTimeout(state.searchTimer);
          state.searchTimer = setTimeout(function() { executeSearch(); }, Config.get('debounce', 800));
        });
      }
      const sendBtn = document.getElementById('btn-send');
      if (sendBtn) sendBtn.onclick = handleSend;

      const modeToggle = document.getElementById('mode-toggle');
      if (modeToggle) {
        modeToggle.addEventListener('click', function(e) {
          const opt = e.target.closest('.tog-sw-opt');
          if (opt) { const value = opt.getAttribute('data-v'); if (value) handleToggleMode(value); }
        });
      }

      // Сегменты: клик вызывает setSegment, который прокручивает к панели
      document.querySelectorAll('.seg-b').forEach(function(b) {
        b.onclick = function() { setSegment(b.getAttribute('data-k')); };
      });
      document.querySelectorAll('.btab-b').forEach(function(b) {
        b.onclick = function() { switchView(b.getAttribute('data-v')); };
      });

      // === Обработчик кликов и скролла на cards-container ===
      const cardsContainer = document.getElementById('cards-container');
      if (cardsContainer) {
        cardsContainer.addEventListener('click', function(e) {
          const el = e.target.closest('[data-act]');
          if (el) handleItemAction(el.getAttribute('data-act'), el);
        });
        // Удаляем старый обработчик, если был (защита от дубликатов)
        if (state.scrollHandler) {
          cardsContainer.removeEventListener('scroll', state.scrollHandler);
        }
        state.scrollHandler = handleContainerScroll;
        cardsContainer.addEventListener('scroll', state.scrollHandler, { passive: true });
      }

      const baseContainer = document.getElementById('ws-base');
      if (baseContainer) {
        baseContainer.addEventListener('click', function(e) {
          const el = e.target.closest('[data-act]');
          if (el) handleBaseAction(el.getAttribute('data-act'), el.getAttribute('data-id'));
        });
      }

      const baseSearchInput = document.getElementById('base-q');
      if (baseSearchInput) {
        baseSearchInput.addEventListener('input', function() {
          if (state.baseSearchTimer) clearTimeout(state.baseSearchTimer);
          state.baseSearchTimer = setTimeout(renderBase, 200);
        });
      }
      const baseSortSelect = document.getElementById('base-sort');
      if (baseSortSelect) baseSortSelect.onchange = renderBase;

      const menuBtn = document.getElementById('btn-menu');
      if (menuBtn) menuBtn.onclick = openMenu;

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') Modal.close();
        if (e.key === '/' && document.activeElement && document.activeElement !== editor) {
          e.preventDefault(); if (editor) editor.focus();
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && document.activeElement === editor) {
          e.preventDefault(); handleSend();
        }
      });

      AI.onProgress(function(percent) {
        setStatus('ai', translate('st.ai.loading') + ' ' + Math.round(percent) + '%', 'load');
        Progress.update(percent);
      });

      Net.onPeers(function(count) {
        setStatus('net',
          count > 0 ? translate('st.net.online') + ' · ' + Utils.word('peers', count, I18n.getLang()) : translate('st.net.listen'),
          count > 0 ? 'ok' : 'load');
        if (state.view === 'stream') executeSearch();
      });

      Bus.on('net:status', function(payload) {
        const status = payload && payload.status ? payload.status : 'disconnected';
        let text = translate('st.net'), cls = 'load';
        if (status === 'connected') {
          text = translate('st.net.online') + ' · ' + Utils.word('peers', Net.peerCount(), I18n.getLang()); cls = 'ok';
        } else if (status === 'connecting') { text = translate('st.net.connecting'); cls = 'load'; }
        else if (status === 'reconnecting') { text = translate('st.net.reconnecting'); cls = 'warn'; }
        else if (status === 'failed') { text = translate('st.net.failed'); cls = 'err'; }
        setStatus('net', text, cls);
      });

      bindEditorSwipe();
    }

    function bootApp() {
      setStatus('net', translate('st.net.connecting'), 'load');
      setStatus('ai', translate('st.ai.loading'), 'load');
      Progress.show();
      AI.load().then(function() {
        Progress.hide();
        setStatus('ai',
          AI.getMode() === 'model' ? translate('st.ai.ready') : translate('st.ai.demo'),
          AI.getMode() === 'model' ? 'ok' : 'warn');
        if (!Config.get('onboarded', false)) {
          setTimeout(function() { seedSamples(); Config.set('onboarded', true); Config.save(); }, 300);
        }
      }).catch(function(err) {
        Progress.hide();
        if (Logger) Logger.error('AI', String(err && err.message || err));
        setStatus('ai', translate('st.ai.demo'), 'warn');
      });
      Net.init(function() { executeSearch(); }).catch(function(err) {
        if (Logger) Logger.error('Net', String(err && err.message || err));
        setStatus('net', translate('st.net.failed'), 'err');
      });
    }

    function setupWindowListeners() {
      const handlers = state.windowHandlers;
      if (handlers.resize) window.removeEventListener('resize', handlers.resize);
      if (handlers.focusin) window.removeEventListener('focusin', handlers.focusin);
      if (handlers.focusout) window.removeEventListener('focusout', handlers.focusout);
      if (handlers.orientationchange) window.removeEventListener('orientationchange', handlers.orientationchange);
      const setVH = function() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', vh + 'px');
      };
      handlers.resize = setVH; handlers.focusin = setVH; handlers.focusout = setVH;
      handlers.orientationchange = function() { setTimeout(setVH, 100); };
      window.addEventListener('resize', handlers.resize);
      window.addEventListener('focusin', handlers.focusin);
      window.addEventListener('focusout', handlers.focusout);
      window.addEventListener('orientationchange', handlers.orientationchange);
      setVH();
    }

    applyTheme(Config.get('theme', 'dark'));

    function mountApp() {
      try {
        let root = document.getElementById('app-root');
        if (!root) { root = document.createElement('div'); root.id = 'app-root'; document.body.appendChild(root); }
        document.body.classList.add('show-app');
        root.innerHTML = buildMarkup();
        setupWindowListeners(); bindEvents(); bootApp();
        if (Logger) Logger.info('App mounted');
      } catch (err) {
        console.error('App mount failed:', err);
        const root = document.getElementById('app-root');
        if (root) {
          root.textContent = '';
          const wrapper = document.createElement('div');
          wrapper.style.cssText = 'padding:40px;text-align:center;color:#ef4444';
          const heading = document.createElement('h2'); heading.textContent = 'NOOmium failed to start';
          const message = document.createElement('p');
          message.style.cssText = 'color:#a0a0ae;margin-top:10px';
          message.textContent = String(err && err.message || err);
          const reloadBtn = document.createElement('button');
          reloadBtn.style.cssText = 'margin-top:20px;padding:10px 20px;background:#8b7cff;color:white;border:none;border-radius:8px;cursor:pointer';
          reloadBtn.textContent = 'Reload'; reloadBtn.onclick = function() { location.reload(); };
          wrapper.appendChild(heading); wrapper.appendChild(message); wrapper.appendChild(reloadBtn);
          root.appendChild(wrapper); document.body.classList.add('show-app');
        }
      }
    }

    return { mount: mountApp };
  }, ['Logger', 'Bus', 'Store', 'Config', 'Utils', 'DB', 'AI', 'Net', 'I18n', 'Modal', 'Toast', 'Progress']);

  // ============================================================
  // Bootstrap
  // ============================================================
  function bootstrap() {
    try {
      const app = DI.resolve('App'); app.mount();
    } catch (err) {
      console.error('Bootstrap failed:', err);
      let root = document.getElementById('app-root');
      if (!root) { root = document.createElement('div'); root.id = 'app-root'; document.body.appendChild(root); }
      root.textContent = '';
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'padding:40px;text-align:center;color:#ef4444';
      const heading = document.createElement('h2'); heading.textContent = 'Startup failed';
      const message = document.createElement('p');
      message.style.cssText = 'color:#a0a0ae;margin-top:10px';
      message.textContent = String(err && err.message || err);
      const reloadBtn = document.createElement('button');
      reloadBtn.style.cssText = 'margin-top:20px;padding:10px 20px;background:#8b7cff;color:white;border:none;border-radius:8px;cursor:pointer';
      reloadBtn.textContent = 'Reload'; reloadBtn.onclick = function() { location.reload(); };
      wrapper.appendChild(heading); wrapper.appendChild(message); wrapper.appendChild(reloadBtn);
      root.appendChild(wrapper); document.body.classList.add('show-app');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrap);
  } else { bootstrap(); }
})();
</script>
</body>
</html>
