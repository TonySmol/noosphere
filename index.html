  <meta name="theme-color" content="#1d232a">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Dexie.js -->

  <!-- Day.js -->

<body class="bg-base-100 min-h-screen">

    <div x-show="$store.app.initialized" class="navbar bg-base-200 shadow-lg sticky top-0 z-40">

      </div>

        <div class="badge badge-ghost gap-2">

          <span x-text="$store.nostr.statusText"></span>
        </div>
        <div class="badge badge-ghost gap-2">
          <span class="w-2 h-2 rounded-full" :class="$store.ai.statusDotClass"></span>
          <span x-text="$store.ai.statusText"></span>
        </div>

              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            <span x-show="$store.notifications.unreadCount > 0" 
                  x-text="$store.notifications.unreadCount"
                  class="badge badge-sm badge-primary indicator-item"></span>
          </div>
        </button>
        <button class="btn btn-ghost btn-circle" @click="$store.app.showMenu = true">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>

    <!-- MAIN -->
    <main class="container mx-auto p-4 max-w-4xl" x-show="$store.app.initialized">
      
      <!-- EDITOR -->
      <div x-data="editorComponent()" class="mb-6">
        <div class="card bg-base-200 shadow-xl">
          <div class="card-body">
            <textarea 
              x-model="$store.editor.text"
              @input="$store.editor.onInput()"
              class="textarea textarea-bordered h-24 text-lg"
              :placeholder="$store.i18n.t('editor.placeholder')"
            ></textarea>
            <div class="flex justify-between items-center mt-2">
              <span class="text-sm opacity-70" x-text="$store.editor.charCountText"></span>
              <div class="flex gap-2">
                <div class="btn-group">
                  <button class="btn btn-sm"
                          :class="$store.editor.mode === 'private' ? 'btn-primary' : 'btn-ghost'"
                          @click="$store.editor.setMode('private')"
                          x-text="$store.i18n.t('mode.private')"></button>
                  <button class="btn btn-sm"
                          :class="$store.editor.mode === 'world' ? 'btn-primary' : 'btn-ghost'"
                          @click="$store.editor.setMode('world')"
                          x-text="$store.i18n.t('mode.world')"></button>
                </div>
                <button class="btn btn-primary"
                        :disabled="!$store.editor.canSend"
                        @click="$store.editor.send()"
                        x-text="$store.i18n.t('btn.send')"></button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- TABS -->
      <div role="tablist" class="tabs tabs-lifted mb-4">
        <a role="tab" class="tab" :class="{ 'tab-active': $store.app.activeTab === 'stream' }"
           @click="$store.app.activeTab = 'stream'" x-text="$store.i18n.t('tab.stream')"></a>
        <a role="tab" class="tab" :class="{ 'tab-active': $store.app.activeTab === 'feed' }"
           @click="$store.app.activeTab = 'feed'" x-text="$store.i18n.t('tab.feed')"></a>
        <a role="tab" class="tab" :class="{ 'tab-active': $store.app.activeTab === 'base' }"
           @click="$store.app.activeTab = 'base'" x-text="$store.i18n.t('tab.base')"></a>
      </div>

      <!-- STREAM TAB -->
      <div x-show="$store.app.activeTab === 'stream'">
        <div class="grid gap-4">
          <section x-show="$store.search.results.my.length > 0">
            <h3 class="text-lg font-bold mb-2" x-text="$store.i18n.t('stream.my')"></h3>
            <div class="space-y-2">
              <template x-for="note in $store.search.results.my" :key="note.id">
                <div class="card bg-base-200 shadow">
                  <div class="card-body p-4">
                    <p x-text="note.text"></p>
                    <div class="flex justify-between items-center mt-2">
                      <span class="badge badge-primary" x-text="Math.round(note.score * 100) + '%'"></span>
                      <div class="flex gap-1">
                        <button class="btn btn-ghost btn-xs" @click="$store.editor.edit(note)" x-text="$store.i18n.t('btn.edit')"></button>
                        <button class="btn btn-ghost btn-xs" @click="$store.db.toggleShared(note.id)" 
                                x-text="note.shared ? $store.i18n.t('btn.hide') : $store.i18n.t('btn.share')"></button>
                        <button class="btn btn-ghost btn-xs btn-error" @click="$store.db.delete(note.id)" x-text="$store.i18n.t('btn.delete')"></button>
                      </div>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </section>

          <section x-show="$store.search.results.world.length > 0">
            <h3 class="text-lg font-bold mb-2" x-text="$store.i18n.t('stream.world')"></h3>
            <div class="space-y-2">
              <template x-for="note in $store.search.results.world" :key="note.id">
                <div class="card bg-base-200 shadow">
                  <div class="card-body p-4">
                    <p x-text="note.text"></p>
                    <div class="flex justify-between items-center mt-2">
                      <span class="badge badge-secondary" x-text="Math.round(note.score * 100) + '%'"></span>
                      <button class="btn btn-ghost btn-xs" @click="$store.editor.replyTo(note)" x-text="$store.i18n.t('btn.reply')"></button>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </section>

          <section x-show="$store.search.results.insights.length > 0">
            <h3 class="text-lg font-bold mb-2" x-text="$store.i18n.t('stream.insights')"></h3>
            <div class="space-y-2">
              <template x-for="note in $store.search.results.insights" :key="note.id">
                <div class="card bg-base-200 shadow">
                  <div class="card-body p-4">
                    <p x-text="note.text"></p>
                  </div>
                </div>
              </template>
            </div>
          </section>
        </div>
      </div>

      <!-- FEED TAB -->
      <div x-show="$store.app.activeTab === 'feed'">
        <div class="space-y-2">
          <template x-for="note in $store.nostr.publicThoughts" :key="note.id">
            <div class="card bg-base-200 shadow">
              <div class="card-body p-4">
                <div class="flex justify-between items-start mb-2">
                  <span class="badge badge-ghost" x-text="note.author.slice(0, 8)"></span>
                  <span class="text-xs opacity-60" x-text="$store.nostr.formatDate(note.createdAt)"></span>
                </div>
                <p x-text="note.text"></p>
                <button class="btn btn-ghost btn-sm mt-2" @click="$store.editor.replyTo(note)" x-text="$store.i18n.t('btn.reply')"></button>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- BASE TAB -->
      <div x-show="$store.app.activeTab === 'base'">
        <div class="mb-4">
          <input type="text" x-model="$store.base.query" @input="$store.base.onQueryChange()"
                 :placeholder="$store.i18n.t('base.search')" class="input input-bordered w-full" />
        </div>
        <div class="stats shadow mb-4 w-full">
          <div class="stat">
            <div class="stat-title" x-text="$store.i18n.t('base.total')"></div>
            <div class="stat-value" x-text="$store.base.stats.total"></div>
          </div>
          <div class="stat">
            <div class="stat-title" x-text="$store.i18n.t('base.shared')"></div>
            <div class="stat-value" x-text="$store.base.stats.shared"></div>
          </div>
          <div class="stat">
            <div class="stat-title" x-text="$store.i18n.t('base.private')"></div>
            <div class="stat-value" x-text="$store.base.stats.private"></div>
          </div>
        </div>
        <div class="space-y-2">
          <template x-for="note in $store.base.visibleNotes" :key="note.id">
            <div class="card bg-base-200 shadow cursor-pointer" @click="$store.base.openNote(note)">

                <div class="flex justify-between items-center mt-2">

                        x-text="note.shared ? $store.i18n.t('tag.shared') : $store.i18n.t('tag.private')"></span>
                  <span class="text-xs opacity-60" x-text="$store.base.formatDate(note.createdAt)"></span>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>

    </main>

    <!-- MODALS (Notifications, Menu, Onboarding, Password) -->

  lang: 'ru',
  _storageKey: 'noomium:lang',

  init() {
    try {
      const saved = localStorage.getItem(this._storageKey);
      if (saved && (saved === 'ru' || saved === 'en')) {
        this.lang = saved;
      } else {
        const nav = (navigator.language || 'ru').toLowerCase();
        this.lang = nav.startsWith('ru') ? 'ru' : 'en';
      }
    } catch (e) {
      this.lang = 'ru';
    }
    document.documentElement.setAttribute('lang', this.lang);
  },

  t(key, params = {}) {
    const dict = this.dicts[this.lang] || this.dicts['en'] || {};
    const fallback = this.dicts['en'] || {};
    let text = dict[key] !== undefined ? dict[key] : fallback[key];
    if (text === undefined) return key; // ключ не найден — возвращаем как есть
    // Простая интерполяция {n}, {name} и т.д.
    return String(text).replace(/\{(\w+)\}/g, (m, k) =>
      params[k] !== undefined ? String(params[k]) : m
    );
  },

  setLang(lang) {
    if (lang !== 'ru' && lang !== 'en') return;
    this.lang = lang;
    document.documentElement.setAttribute('lang', lang);
    try {
      localStorage.setItem(this._storageKey, lang);
    } catch (e) {
      console.warn('i18n: persist failed', e);
    }
  }
});

// STORE: settings (user preferences)
// ============================================================
Alpine.store('settings', {
  theme: 'dark',
  onboarded: false,

  _keys: {
    theme: 'noomium:theme',
    onboarded: 'noomium:onboarded'
  },

  init() {
    // Тема
    try {
      const savedTheme = localStorage.getItem(this._keys.theme);
      if (savedTheme === 'dark' || savedTheme === 'light') {
        this.theme = savedTheme;
      } else {
        // Автоопределение по системным настройкам
        const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches;
        this.theme = prefersDark ? 'dark' : 'light';
      }
    } catch (e) {
      this.theme = 'dark';
    }
    this._applyTheme();

    // Онбординг
    try {
      this.onboarded = localStorage.getItem(this._keys.onboarded) === '1';
    } catch (e) {
      this.onboarded = false;
    }
  },

  setTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    this.theme = theme;
    this._applyTheme();
    try {
      localStorage.setItem(this._keys.theme, theme);
    } catch (e) {
      console.warn('settings: persist theme failed', e);
    }
    // Обновляем theme-color для мобильной браузерной рамки
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#1d232a' : '#ffffff');
  },

  toggleTheme() {
    this.setTheme(this.theme === 'dark' ? 'light' : 'dark');
  },

  markOnboarded() {
    this.onboarded = true;
    try {
      localStorage.setItem(this._keys.onboarded, '1');
    } catch (e) {
      console.warn('settings: persist onboarded failed', e);
    }
  },

  _applyTheme() {
    document.documentElement.setAttribute('data-theme', this.theme);
    document.body?.setAttribute('data-theme', this.theme);
  }
});

// ============================================================
// STORE: crypto (Web Crypto API — key derivation, encrypt/decrypt)
// ============================================================
Alpine.store('crypto', {

  /**
   * Генерирует cryptographically secure случайные байты.
   * @param {number} len — длина в байтах
   * @returns {Uint8Array}
   */
  randomBytes(len) {
    if (!Number.isInteger(len) || len <= 0) {
      throw new Error('crypto.randomBytes: invalid length');
    }
    return crypto.getRandomValues(new Uint8Array(len));
  },

  /**
   * PBKDF2 -> AES-GCM-256 key.
   * @param {string} password
   * @param {Uint8Array} salt
   * @returns {Promise<CryptoKey>}
   */
  async deriveKey(password, salt) {
    if (!password || typeof password !== 'string') {
      throw new Error('crypto.deriveKey: password required');
    }
    if (!(salt instanceof Uint8Array) || salt.length === 0) {
      throw new Error('crypto.deriveKey: salt required');
    }
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw',
      enc.encode(password),
      { name: 'PBKDF2' },
      false,
      ['deriveKey']
    );
    return await crypto.subtle.deriveKey(
      {
        name: 'PBKDF2',
        salt: salt,
        iterations: $store.config.crypto.iterations,
        hash: 'SHA-256'
      },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  },

  /**
   * Шифрует hex-строку ключа паролем.
   * Возвращает base64(salt[16] + iv[12] + ciphertext).
   * @param {string} hexKey — 64 hex-символа (32 байта)
   * @param {string} password
   * @returns {Promise<string>}
   */
  async encryptKey(hexKey, password) {
    if (typeof hexKey !== 'string' || !/^[0-9a-f]+$/i.test(hexKey)) {
      throw new Error('crypto.encryptKey: hexKey must be a hex string');
    }
    const salt = this.randomBytes($store.config.crypto.saltLen);
    const iv = this.randomBytes($store.config.crypto.ivLen);
    const key = await this.deriveKey(password, salt);

    const enc = new TextEncoder();
    const ciphertext = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv: iv },
      key,
      enc.encode(hexKey)
    );

    const ctBytes = new Uint8Array(ciphertext);
    const combined = new Uint8Array(salt.length + iv.length + ctBytes.length);
    combined.set(salt, 0);
    combined.set(iv, salt.length);
    combined.set(ctBytes, salt.length + iv.length);

    return this._bytesToBase64(combined);
  },

  /**
   * Расшифровывает base64(salt+iv+ciphertext) обратно в hex-строку ключа.
   * @param {string} base64
   * @param {string} password
   * @returns {Promise<string>} hex-строка
   * @throws если пароль неверный (decrypt выбросит ошибку)
   */
  async decryptKey(base64, password) {
    if (typeof base64 !== 'string' || base64.length === 0) {
      throw new Error('crypto.decryptKey: base64 required');
    }
    const combined = this._base64ToBytes(base64);
    const saltLen = $store.config.crypto.saltLen;
    const ivLen = $store.config.crypto.ivLen;

    if (combined.length <= saltLen + ivLen) {
      throw new Error('crypto.decryptKey: malformed payload');
    }

    const salt = combined.slice(0, saltLen);
    const iv = combined.slice(saltLen, saltLen + ivLen);
    const ciphertext = combined.slice(saltLen + ivLen);

    const key = await this.deriveKey(password, salt);
    const decrypted = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: iv },
      key,
      ciphertext
    );
    return new TextDecoder().decode(decrypted);
  },

  // ---------- Приватные хелперы ----------

  _bytesToBase64(bytes) {
    // Быстрый безопасный способ: через reduce, чтобы не упереться в
    // ограничение apply по длине массива на больших объёмах.
    let binary = '';
    for (let i = 0; i < bytes.length; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
  },

  _base64ToBytes(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
  }
});

// ============================================================
// STORE: db (Dexie wrapper)
// ============================================================
Alpine.store('db', {
  _dexie: null,
  _cache: [],

  /**
   * Инициализация Dexie: создание схемы, открытие, загрузка кеша.
   * Схема notes: id (primary key), индексы на shared, createdAt, replyTo, parentId.
   * vector и text не индексируются (vector — массив, text — полнотекст не нужен).
   */
  async init() {
    if (typeof Dexie === 'undefined') {
      throw new Error('Dexie.js is not loaded');
    }
    const dbName = $store.config.dbName;

    try {
      this._dexie = new Dexie(dbName);
      this._dexie.version(1).stores({
        notes: 'id, shared, createdAt, replyTo, parentId'
      });
      await this._dexie.open();
      this._cache = await this._dexie.notes.toArray();
    } catch (err) {
      console.error('db.init failed:', err);
      this._dexie = null;
      this._cache = [];
      throw err;
    }
  },

  /**
   * Сохранить или обновить заметку.
   * @param {Object} note — объект с полем id и остальными полями
   * @returns {Promise<string>} id сохранённой заметки
   */
  async put(note) {
    if (!note || typeof note.id !== 'string' || !note.id) {
      throw new Error('db.put: note with id required');
    }
    if (!this._dexie) throw new Error('db.put: db not initialized');

    const normalized = {
      id: note.id,
      text: typeof note.text === 'string' ? note.text : '',
      vector: Array.isArray(note.vector) ? note.vector : null,
      shared: !!note.shared,
      createdAt: typeof note.createdAt === 'number' ? note.createdAt : Date.now(),
      replyTo: typeof note.replyTo === 'string' ? note.replyTo : null,
      parentId: typeof note.parentId === 'string' ? note.parentId : null
    };

    await this._dexie.notes.put(normalized);
    this._syncCache(normalized);
    return normalized.id;
  },

  /**
   * Получить заметку по id. Сначала в кеше, потом в БД.
   * @param {string} id
   * @returns {Promise<Object|null>}
   */
  async get(id) {
    if (typeof id !== 'string' || !id) return null;

    // Быстрый путь: кеш
    const cached = this._cache.find(n => n.id === id);
    if (cached) return cached;

    if (!this._dexie) return null;

    try {
      const fromDb = await this._dexie.notes.get(id);
      if (fromDb) {
        this._syncCache(fromDb);
        return fromDb;
      }
      return null;
    } catch (err) {
      console.warn('db.get failed:', err);
      return null;
    }
  },

  /**
   * Удалить заметку по id.
   * @param {string} id
   */
  async delete(id) {
    if (typeof id !== 'string' || !id) return;
    if (!this._dexie) return;

    try {
      await this._dexie.notes.delete(id);
      this._cache = this._cache.filter(n => n.id !== id);
    } catch (err) {
      console.warn('db.delete failed:', err);
    }
  },

  /**
   * Переключить флаг shared у заметки.
   * @param {string} id
   */
  async toggleShared(id) {
    if (typeof id !== 'string' || !id) return;
    if (!this._dexie) return;

    const note = await this.get(id);
    if (!note) return;

    const updated = { ...note, shared: !note.shared };
    await this._dexie.notes.put(updated);
    this._syncCache(updated);
  },

  /**
   * Возвращает актуальный кеш. Синхронный метод.
   * @returns {Array<Object>}
   */
  all() {
    return this._cache;
  },

  /**
   * Массовая вставка/обновление.
   * @param {Array<Object>} notes
   */
  async bulkPut(notes) {
    if (!Array.isArray(notes) || notes.length === 0) return;
    if (!this._dexie) throw new Error('db.bulkPut: db not initialized');

    const normalized = notes.map(note => ({
      id: String(note.id),
      text: typeof note.text === 'string' ? note.text : '',
      vector: Array.isArray(note.vector) ? note.vector : null,
      shared: !!note.shared,
      createdAt: typeof note.createdAt === 'number' ? note.createdAt : Date.now(),
      replyTo: typeof note.replyTo === 'string' ? note.replyTo : null,
      parentId: typeof note.parentId === 'string' ? note.parentId : null
    }));

    await this._dexie.notes.bulkPut(normalized);
    // Перезагружаем кеш из БД, чтобы гарантировать консистентность
    this._cache = await this._dexie.notes.toArray();
  },

  /**
   * Полное удаление базы и очистка кеша.
   */
  async reset() {
    const dbName = $store.config.dbName;
    try {
      if (this._dexie) {
        try { this._dexie.close(); } catch (_) { /* ignore */ }
        this._dexie = null;
      }
      await Dexie.delete(dbName);
      this._cache = [];
    } catch (err) {
      console.warn('db.reset failed:', err);
      this._cache = [];
    }
  },

  // ---------- Приватные хелперы ----------

  /**
   * Обновить или добавить запись в _cache.
   */
  _syncCache(note) {
    const idx = this._cache.findIndex(n => n.id === note.id);
    if (idx >= 0) {
      this._cache[idx] = note;
    } else {
      this._cache.push(note);
    }
  }
});

// ============================================================
// STORE: ai (Transformers.js embeddings)
// ============================================================
Alpine.store('ai', {
  mode: 'loading',          // 'loading' | 'model' | 'hash'
  progress: 0,
  _extractor: null,
  _cache: new Map(),
  _loadPromise: null,

  get ready() {
    return this.mode !== 'loading';
  },

  get statusDotClass() {
    return this.mode === 'model' ? 'bg-success'
         : this.mode === 'hash'  ? 'bg-warning'
         : 'bg-info animate-pulse';
  },

  get statusText() {
    if (this.mode === 'model') return 'AI';
    if (this.mode === 'hash')  return 'AI/hash';
    return `AI ${Math.round(this.progress)}%`;
  },

  /**
   * Загрузка модели Transformers.js.
   * Повторные вызовы возвращают тот же промис (singleton).
   */
  async load() {
    if (this._extractor || this.mode === 'hash') return;
    if (this._loadPromise) return this._loadPromise;

    this._loadPromise = this._doLoad().finally(() => {
      this._loadPromise = null;
    });
    return this._loadPromise;
  },

  async _doLoad() {
    const model = $store.config.ai.model;
    try {
      const mod = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
      const { pipeline, env } = mod;

      if (typeof pipeline !== 'function') {
        throw new Error('transformers: pipeline is not a function');
      }

      env.allowLocalModels = false;
      env.useBrowserCache = true;

      this._extractor = await pipeline('feature-extraction', model, {
        quantized: true,
        progress_callback: (p) => {
          if (p && p.status === 'progress' && typeof p.total === 'number' && p.total > 0) {
            this.progress = Math.min(100, (p.loaded / p.total) * 100);
          }
        }
      });

      this.mode = 'model';
      this.progress = 100;
    } catch (err) {
      console.warn('ai.load failed, fallback to hash:', err && err.message || err);
      this.mode = 'hash';
      this._extractor = null;
      this.progress = 0;
    }
  },

  /**
   * Получить векторное представление текста.
   * @param {string} text
   * @returns {Promise<number[]|null>}
   */
  async embed(text) {
    const t = typeof text === 'string' ? text.trim() : '';
    if (!t) return null;

    // LRU-кеш: при доступе удаляем и добавляем в конец (Map сохраняет порядок)
    if (this._cache.has(t)) {
      const cached = this._cache.get(t);
      this._cache.delete(t);
      this._cache.set(t, cached);
      return cached;
    }

    let vec;
    if (this.mode === 'model' && this._extractor) {
      vec = await this._embedWithModel(t);
    }
    // Если model не сработал или mode === 'hash'
    if (!vec) {
      vec = this._hashEmbed(t);
    }

    // Сохраняем в кеш с лимитом
    this._cache.set(t, vec);
    const limit = $store.config.ai.cacheLimit;
    if (this._cache.size > limit) {
      // Удаляем самую старую запись (первую в Map)
      const oldestKey = this._cache.keys().next().value;
      this._cache.delete(oldestKey);
    }
    return vec;
  },

  /**
   * Эмбеддинг через модель с таймаутом.
   * При ошибке возвращает null — вызывающий код использует _hashEmbed.
   */
  async _embedWithModel(text) {
    const timeoutMs = $store.config.ai.embedTimeout;
    try {
      const result = await Promise.race([
        this._extractor(text, { pooling: 'mean', normalize: true }),
        new Promise((_, reject) =>
          setTimeout(() => reject(new Error('embed timeout')), timeoutMs)
        )
      ]);
      if (result && result.data) {
        return Array.from(result.data);
      }
      return null;
    } catch (err) {
      console.warn('ai._embedWithModel failed, will use hash:', err && err.message || err);
      return null;
    }
  },

  /**
   * Детерминированный хеш-эмбеддинг (FNV-1a).
   * Используется как fallback при недоступности модели.
   * @param {string} text
   * @returns {number[]} массив длины dim
   */
  _hashEmbed(text) {
    const DIM = $store.config.ai.dim;
    const vec = new Float32Array(DIM);
    const tokens = (text || '').toLowerCase().match(/[a-zа-яё0-9]+/gi) || [];

    for (let t = 0; t < tokens.length; t++) {
      const tok = tokens[t];
      // FNV-1a
      let h = 2166136261;
      for (let i = 0; i < tok.length; i++) {
        h ^= tok.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      vec[Math.abs(h) % DIM] += 1;

      // Дополнительная псевдо-хеш функция для распределения
      const h2 = Math.imul(h ^ 0x9e3779b9, 2654435761);
      vec[Math.abs(h2) % DIM] += 0.5;
    }

    // L2-нормализация
    let norm = 0;
    for (let i = 0; i < DIM; i++) norm += vec[i] * vec[i];
    norm = Math.sqrt(norm) || 1;
    for (let i = 0; i < DIM; i++) vec[i] /= norm;

    return Array.from(vec);
  },

  /**
   * Косинусное сходство двух векторов.
   * @param {number[]} a
   * @param {number[]} b
   * @returns {number} значение в диапазоне [-1, 1], или 0 при ошибке
   */
  cosine(a, b) {
    if (!Array.isArray(a) || !Array.isArray(b)) return 0;
    if (a.length === 0 || b.length === 0) return 0;
    if (a.length !== b.length) return 0;

    let sum = 0;
    let normA = 0;
    let normB = 0;
    for (let i = 0; i < a.length; i++) {
      sum += a[i] * b[i];
      normA += a[i] * a[i];
      normB += b[i] * b[i];
    }
    const denom = Math.sqrt(normA) * Math.sqrt(normB);
    if (denom < 1e-10) return 0;
    const score = sum / denom;
    // Защита от NaN/Infinity
    return Number.isFinite(score) ? score : 0;
  }
});

// ============================================================
// STORE: nostr (NDK + nostr-tools for keys)
// ============================================================
Alpine.store('nostr', {
  status: 'disconnected',      // 'disconnected' | 'connecting' | 'connected' | 'failed'
  publicKey: null,
  _secretKey: null,            // hex-строка (приватное)
  _ndk: null,
  _subscription: null,
  publicThoughts: [],
  peers: new Map(),
  _myEventIds: new Set(),

  _storageKeys: {
    sk: 'noomium:sk',
    myEventIds: 'noomium:myEventIds'
  },

  _MAX_PUBLIC_THOUGHTS: 500,
  _MAX_MY_EVENT_IDS: 1000,

  get statusDotClass() {
    return this.status === 'connected'   ? 'bg-success'
         : this.status === 'connecting'  ? 'bg-info animate-pulse'
         : this.status === 'failed'      ? 'bg-error'
         : 'bg-warning';
  },

  get statusText() {
    if (this.status === 'connected') {
      return `online · ${this.peers.size}`;
    }
    return this.status;
  },

  /**
   * Основная инициализация: ключи → NDK → подписка.
   * @param {string} password
   */
  async init(password) {
    if (!password || typeof password !== 'string') {
      throw new Error('nostr.init: password required');
    }
    this.status = 'connecting';

    try {
      // 1. Загрузка/генерация секретного ключа
      let skHex;
      let stored = null;
      try { stored = localStorage.getItem(this._storageKeys.sk); } catch (_) {}

      if (stored) {
        try {
          skHex = await $store.crypto.decryptKey(stored, password);
        } catch (e) {
          // Пароль неверный
          const err = new Error('WRONG_PASSWORD');
          err.cause = e;
          throw err;
        }
      } else {
        const nt = this._getNostrTools();
        const skBytes = nt.generateSecretKey();
        skHex = Array.from(skBytes)
          .map(b => b.toString(16).padStart(2, '0'))
          .join('');
        const encrypted = await $store.crypto.encryptKey(skHex, password);
        try { localStorage.setItem(this._storageKeys.sk, encrypted); } catch (_) {}
      }
      this._secretKey = skHex;

      // 2. Публичный ключ
      const nt = this._getNostrTools();
      this.publicKey = nt.getPublicKey(skHex);

      // 3. Загрузка своих eventId
      try {
        const raw = localStorage.getItem(this._storageKeys.myEventIds);
        const arr = raw ? JSON.parse(raw) : [];
        this._myEventIds = new Set(Array.isArray(arr) ? arr : []);
      } catch (_) {
        this._myEventIds = new Set();
      }

      // 4. NDK
      if (typeof NDK === 'undefined') {
        throw new Error('NDK is not loaded');
      }
      const SignerClass = window.NDKPrivateKeySigner;
      const signer = SignerClass ? new SignerClass(skHex) : null;

      this._ndk = new NDK({
        explicitRelayUrls: $store.config.relays,
        signer
      });

      await this._ndk.connect();

      // 5. Подписка на публичные мысли
      const filter = {
        kinds: [$store.config.nostr.kindThought],
        '#t': ['noomium-main'],
        since: Math.floor(Date.now() / 1000) - $store.config.nostr.subWindowSec
      };
      this._subscription = this._ndk.subscribe(filter);

      // NDK v2: subscription.on('event', handler)
      if (this._subscription && typeof this._subscription.on === 'function') {
        this._subscription.on('event', (e) => this._onEvent(e));
      }

      this.status = 'connected';
    } catch (err) {
      this.status = 'failed';
      throw err;
    }
  },

  /**
   * Получить глобальный объект nostr-tools.
   * @private
   */
  _getNostrTools() {
    const nt = window.nostrTools || window.NostrTools || window.Nostr;
    if (!nt || typeof nt.generateSecretKey !== 'function' || typeof nt.getPublicKey !== 'function') {
      throw new Error('nostr-tools is not available');
    }
    return nt;
  },

  /**
   * Получить класс NDKEvent.
   * @private
   */
  _getNDKEventClass() {
    const cls = window.NDKEvent || (this._ndk && this._ndk.NDKEvent);
    if (!cls) throw new Error('NDKEvent class is not available');
    return cls;
  },

  /**
   * Опубликовать свою мысль в Nostr.
   * @param {string} text
   * @param {number[]} vector
   * @param {boolean} isShared
   * @returns {Promise<string>} eventId
   */
  async publishThought(text, vector, isShared) {
    if (!this._ndk || !this._secretKey) {
      throw new Error('nostr.publishThought: not initialized');
    }
    if (typeof text !== 'string' || !text.trim()) {
      throw new Error('nostr.publishThought: text required');
    }
    if (!Array.isArray(vector)) {
      throw new Error('nostr.publishThought: vector required');
    }

    const NDKEventClass = this._getNDKEventClass();
    const event = new NDKEventClass(this._ndk, {
      kind: $store.config.nostr.kindThought,
      created_at: Math.floor(Date.now() / 1000),
      content: JSON.stringify({ text, vector }),
      tags: [['t', 'noomium-main']]
    });

    // sign() использует signer из NDK, если он был передан при создании
    await event.sign();
    await event.publish();

    // Сохраняем свой eventId
    if (event.id) {
      this._myEventIds.add(event.id);
      this._persistMyEventIds();
    }

    // Если shared — показываем свою мысль в ленте
    if (isShared) {
      this._addThought({
        id: event.id,
        text,
        vector,
        author: this.publicKey,
        createdAt: event.created_at * 1000,
        replyTo: null,
        own: true
      });
    }

    return event.id;
  },

  /**
   * Опубликовать ответ на чужую/свою мысль.
   * @param {string} text
   * @param {number[]} vector
   * @param {string} replyToId
   * @returns {Promise<string>} eventId
   */
  async reply(text, vector, replyToId) {
    if (!this._ndk || !this._secretKey) {
      throw new Error('nostr.reply: not initialized');
    }
    if (typeof text !== 'string' || !text.trim()) {
      throw new Error('nostr.reply: text required');
    }
    if (!Array.isArray(vector)) {
      throw new Error('nostr.reply: vector required');
    }
    if (typeof replyToId !== 'string' || !replyToId) {
      throw new Error('nostr.reply: replyToId required');
    }

    const NDKEventClass = this._getNDKEventClass();
    const event = new NDKEventClass(this._ndk, {
      kind: $store.config.nostr.kindThought,
      created_at: Math.floor(Date.now() / 1000),
      content: JSON.stringify({ text, vector }),
      tags: [
        ['t', 'noomium-main'],
        ['e', replyToId]
      ]
    });

    await event.sign();
    await event.publish();

    if (event.id) {
      this._myEventIds.add(event.id);
      this._persistMyEventIds();
    }

    this._addThought({
      id: event.id,
      text,
      vector,
      author: this.publicKey,
      createdAt: event.created_at * 1000,
      replyTo: replyToId,
      own: true
    });

    return event.id;
  },

  /**
   * Обработчик входящего события.
   * @private
   */
  _onEvent(event) {
    try {
      if (!event || typeof event !== 'object') return;
      if (typeof event.pubkey !== 'string') return;
      if (event.pubkey === this.publicKey) return; // свои игнорируем
      if (event.kind !== $store.config.nostr.kindThought) return;

      // Проверка тега #t
      const tags = Array.isArray(event.tags) ? event.tags : [];
      const hasRoomTag = tags.some(
        t => Array.isArray(t) && t[0] === 't' && t[1] === 'noomium-main'
      );
      if (!hasRoomTag) return;

      // Парсим content
      let content;
      try {
        content = JSON.parse(event.content || '{}');
      } catch (_) {
        return;
      }
      if (!content || typeof content !== 'object') return;
      if (typeof content.text !== 'string' || !content.text) return;
      if (!Array.isArray(content.vector)) return;
      for (let i = 0; i < content.vector.length; i++) {
        if (typeof content.vector[i] !== 'number') return;
      }

      // Ищем replyTo
      let replyTo = null;
      for (const tag of tags) {
        if (Array.isArray(tag) && tag[0] === 'e' && typeof tag[1] === 'string') {
          replyTo = tag[1];
          break;
        }
      }

      const thought = {
        id: event.id,
        text: content.text,
        vector: content.vector,
        author: event.pubkey,
        createdAt: (typeof event.created_at === 'number' ? event.created_at : 0) * 1000,
        replyTo,
        own: false
      };

      this._addThought(thought);
      this.peers.set(event.pubkey, Date.now());

      // Ответ на нашу мысль?
      if (replyTo && this._myEventIds.has(replyTo)) {
        try {
          $store.notifications.add('reply', {
            thoughtId: event.id,
            text: content.text,
            pubkey: event.pubkey
          });
        } catch (e) {
          console.warn('nostr: notifications.add failed', e);
        }
      }

      // Эхо
      if ($store.echo && typeof $store.echo.check === 'function') {
        try {
          $store.echo.check(thought);
        } catch (e) {
          console.warn('nostr: echo.check failed', e);
        }
      }
    } catch (err) {
      console.warn('nostr._onEvent error:', err);
    }
  },

  /**
   * Добавить мысль в publicThoughts с дедупликацией и лимитом.
   * @private
   */
  _addThought(thought) {
    if (!thought || !thought.id) return;
    if (this.publicThoughts.some(t => t.id === thought.id)) return;

    // Присваивание массива — реактивно для Alpine
    this.publicThoughts = [thought, ...this.publicThoughts];

    if (this.publicThoughts.length > this._MAX_PUBLIC_THOUGHTS) {
      this.publicThoughts = this.publicThoughts.slice(0, this._MAX_PUBLIC_THOUGHTS);
    }
  },

  /**
   * Сохранить _myEventIds в localStorage.
   * @private
   */
  _persistMyEventIds() {
    try {
      const arr = Array.from(this._myEventIds);
      const toSave = arr.length > this._MAX_MY_EVENT_IDS
        ? arr.slice(arr.length - this._MAX_MY_EVENT_IDS)
        : arr;
      localStorage.setItem(this._storageKeys.myEventIds, JSON.stringify(toSave));
    } catch (e) {
      console.warn('nostr._persistMyEventIds failed:', e);
    }
  },

  /**
   * Отключение от сети.
   */
  stop() {
    if (this._subscription) {
      try {
        if (typeof this._subscription.stop === 'function') {
          this._subscription.stop();
        } else if (typeof this._subscription.unsub === 'function') {
          this._subscription.unsub();
        }
      } catch (_) {}
      this._subscription = null;
    }
    if (this._ndk) {
      try {
        if (this._ndk.pool && typeof this._ndk.pool.disconnect === 'function') {
          this._ndk.pool.disconnect();
        }
      } catch (_) {}
      this._ndk = null;
    }
    this.publicThoughts = [];
    this.peers.clear();
    this.status = 'disconnected';
  },

  /**
   * Форматирование даты через Day.js (relative time).
   * @param {number} ts — миллисекунды
   * @returns {string}
   */
  formatDate(ts) {
    if (!ts) return '';
    try {
      if (typeof dayjs === 'undefined') return '';
      // Относительное время требует плагина relativeTime —
      // если он не подключён, fallback на обычный формат
      if (typeof dayjs().fromNow === 'function') {
        return dayjs(ts).fromNow();
      }
      return dayjs(ts).format('DD.MM.YY HH:mm');
    } catch (e) {
      return '';
    }
  }
});

// ============================================================
// STORE: search (semantic search orchestration)
// ============================================================
Alpine.store('search', {
  results: { my: [], world: [], insights: [] },
  _lastQueryVec: null,
  _debounceTimer: null,

  /**
   * Выполнить поиск по тексту.
   * @param {string} queryText
   */
  async run(queryText) {
    const text = typeof queryText === 'string' ? queryText.trim() : '';
    if (!text) {
      this.clear();
      return;
    }
    if (!$store.ai || !$store.ai.ready) {
      return;
    }

    const vec = await $store.ai.embed(text);
    if (!vec) {
      this.clear();
      return;
    }

    const threshold = $store.config.search.threshold;
    const serendipity = $store.config.search.serendipity;
    const insightFloor = threshold - serendipity;

    // ---- 1. Локальные заметки (my + insightsLocal) ----
    const localNotes = Array.isArray($store.db.all) ? $store.db.all() : [];
    const my = [];
    const insightsLocal = [];

    for (let i = 0; i < localNotes.length; i++) {
      const note = localNotes[i];
      if (!note || !Array.isArray(note.vector)) continue;

      const score = $store.ai.cosine(vec, note.vector);
      if (score >= threshold) {
        my.push({
          id: note.id,
          text: note.text,
          score,
          shared: !!note.shared,
          createdAt: note.createdAt,
          own: true
        });
      } else if (score >= insightFloor && score < threshold) {
        insightsLocal.push({
          id: note.id,
          text: note.text,
          score,
          shared: !!note.shared,
          createdAt: note.createdAt,
          own: true
        });
      }
    }

    // ---- 2. Публичные мысли из Nostr (world + insightsWorld) ----
    const publicThoughts = Array.isArray($store.nostr.publicThoughts)
      ? $store.nostr.publicThoughts
      : [];
    const myPk = $store.nostr.publicKey;
    const world = [];
    const insightsWorld = [];

    for (let i = 0; i < publicThoughts.length; i++) {
      const note = publicThoughts[i];
      if (!note || !Array.isArray(note.vector)) continue;
      // Пропускаем свои, попавшие в publicThoughts
      if (myPk && note.author === myPk) continue;

      const score = $store.ai.cosine(vec, note.vector);
      const peerShort = note.author ? String(note.author).slice(0, 8) : '';

      if (score >= threshold) {
        world.push({
          id: note.id,
          text: note.text,
          score,
          peer: peerShort,
          fullPubkey: note.author,
          createdAt: note.createdAt,
          replyTo: note.replyTo || null,
          own: false
        });
      } else if (score >= insightFloor && score < threshold) {
        insightsWorld.push({
          id: note.id,
          text: note.text,
          score,
          peer: peerShort,
          fullPubkey: note.author,
          createdAt: note.createdAt,
          replyTo: note.replyTo || null,
          own: false
        });
      }
    }

    // ---- 3. Сортировка ----
    my.sort((a, b) => b.score - a.score);
    world.sort((a, b) => b.score - a.score);
    const insights = [...insightsLocal, ...insightsWorld]
      .sort((a, b) => b.score - a.score);

    // ---- 4. Обновление реактивно ----
    this.results = { my, world, insights };
    this._lastQueryVec = vec;
  },

  /**
   * Запустить run с дебаунсом.
   * @param {string} queryText
   */
  schedule(queryText) {
    if (this._debounceTimer) {
      clearTimeout(this._debounceTimer);
      this._debounceTimer = null;
    }
    const delay = $store.config.search.debounceMs;
    this._debounceTimer = setTimeout(() => {
      this._debounceTimer = null;
      this.run(queryText).catch(err => {
        console.warn('search.run failed:', err);
      });
    }, delay);
  },

  /**
   * Очистить результаты и отменить запланированный поиск.
   */
  clear() {
    this.results = { my: [], world: [], insights: [] };
    this._lastQueryVec = null;
    if (this._debounceTimer) {
      clearTimeout(this._debounceTimer);
      this._debounceTimer = null;
    }
  }
});
