<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b10">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: wss:; worker-src 'self' blob:; connect-src * https: wss:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src * data: blob:;">
<title>NOOmium</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>">
<style>
:root{
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.7,.2,1);
  --gap:8px;
  --r:12px;--r-sm:8px;--r-xs:5px;
  --font:ui-sans-serif,-apple-system,'SF Pro Text','Inter','Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --hdr-h:48px;--btab-h:56px;
}
[data-theme="dark"]{
  --bg:#0b0b10;--bg-2:#121218;--surface:#16161e;--surface-2:#1c1c26;--surface-3:#242430;
  --text:#ececf1;--text-2:#a0a0ae;--text-3:#6c6c7a;--text-dim:#484855;
  --line:rgba(255,255,255,.06);--line-strong:rgba(255,255,255,.11);
  --brand:#8b7cff;--brand-glow:rgba(139,124,255,.14);
  --world:#38bdf8;--world-glow:rgba(56,189,248,.12);
  --seren:#4ade80;--seren-glow:rgba(74,222,128,.12);
  --danger:#ef4444;--warning:#eab308;--ok:#22c55e;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#fafafa;--bg-2:#ffffff;--surface:#ffffff;--surface-2:#f4f4f6;--surface-3:#eaeaed;
  --text:#1a1a22;--text-2:#52525c;--text-3:#8a8a95;--text-dim:#b4b4be;
  --line:rgba(0,0,0,.06);--line-strong:rgba(0,0,0,.12);
  --brand:#6d5ef5;--brand-glow:rgba(109,94,245,.10);
  --world:#0284c7;--world-glow:rgba(2,132,199,.08);
  --seren:#16a34a;--seren-glow:rgba(22,163,74,.08);
  --danger:#dc2626;--warning:#ca8a04;--ok:#16a34a;
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
  font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;outline:none}
button[disabled]{opacity:.45;cursor:not-allowed}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
#app-root{height:100vh;height:100dvh;display:none;flex-direction:column;overflow:hidden}
body.show-app #app-root{display:flex}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
  padding-top:calc(10px + var(--safe-top));background:var(--surface);
  border-bottom:1px solid var(--line);flex-shrink:0;height:var(--hdr-h);gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.01em;flex-shrink:0}
.logo-mark{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:6px;background:var(--brand);color:white;font-weight:800;font-size:12px}
.logo-dot{color:var(--brand);margin:0 .5px}
/* Статусная строка в хедере */
.hdr-status{display:flex;align-items:center;gap:10px;flex:1;min-width:0;justify-content:flex-end;
  font-size:11px;color:var(--text-3);font-family:var(--mono);letter-spacing:.02em;overflow:hidden}
.hdr-st-item{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0}
.hdr-st-dot{width:6px;height:6px;border-radius:50%;background:var(--text-dim);flex-shrink:0}
.hdr-st-dot.ok{background:var(--ok)}
.hdr-st-dot.warn{background:var(--warning)}
.hdr-st-dot.err{background:var(--danger)}
.hdr-st-dot.load{background:var(--brand);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.hdr-st-sep{color:var(--line-strong);flex-shrink:0}
.burger{min-width:44px;min-height:44px;padding:10px;border-radius:10px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transition:background .15s var(--ease);flex-shrink:0}
.burger:active{background:var(--surface-2)}
.burger-line{width:16px;height:2px;background:var(--text-2);border-radius:1px}
/* Рабочая область с равномерными отступами через gap */
.ws{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0;gap:var(--gap)}
.ed{background:var(--surface);margin:0 12px;border:1px solid var(--line);
  border-radius:var(--r);padding:10px 12px;flex-shrink:0;transition:border-color .15s var(--ease)}
.ed:focus-within{border-color:var(--brand)}
.ed-ta{width:100%;min-height:44px;max-height:110px;background:transparent;border:none;
  outline:none;resize:none;font:15px/1.5 var(--font);color:var(--text);padding:4px 0}
.ed-ta::placeholder{color:var(--text-dim)}
.ed-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line);gap:8px}
.ed-cnt{font-size:11px;color:var(--text-3);font-family:var(--mono);font-variant-numeric:tabular-nums}
.ed-acts{display:flex;gap:8px;align-items:center;flex:1;justify-content:flex-end}
.tog-sw{display:inline-flex;align-items:center;background:var(--surface-2);
  border:1px solid var(--line);border-radius:999px;padding:3px;position:relative;
  height:40px;min-width:140px;user-select:none}
.tog-sw-opt{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  height:100%;padding:0 12px;font-size:13px;font-weight:600;color:var(--text-3);
  border-radius:999px;z-index:2;position:relative;cursor:pointer;
  transition:color .2s var(--ease);white-space:nowrap;min-width:62px}
.tog-sw-opt.on{color:var(--text)}
.tog-sw-thumb{position:absolute;top:3px;bottom:3px;width:calc(50% - 3px);
  background:var(--surface-3);border-radius:999px;left:3px;
  transition:left .25s var(--ease),background .2s var(--ease);z-index:1;
  box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tog-sw[data-mode="world"] .tog-sw-thumb{left:calc(50%);background:var(--world-glow)}
.tog-sw[data-mode="world"] .tog-sw-opt[data-v="world"]{color:var(--world)}
.tog-sw[data-mode="private"] .tog-sw-thumb{background:var(--brand-glow)}
.tog-sw[data-mode="private"] .tog-sw-opt[data-v="private"]{color:var(--brand)}
.btn-send{height:40px;min-width:44px;padding:0 16px;border-radius:999px;background:var(--brand);
  color:white;font-size:14px;font-weight:600;display:inline-flex;align-items:center;
  justify-content:center;gap:6px;box-shadow:0 2px 8px var(--brand-glow);
  transition:transform .1s var(--ease),filter .15s var(--ease),opacity .15s var(--ease)}
.btn-send:active:not([disabled]){transform:scale(.95)}
.btn-send:hover:not([disabled]){filter:brightness(1.08)}
.btn-send[disabled]{opacity:.5}
.btn-send.sending{pointer-events:none;opacity:.7}
.btn-send svg{width:16px;height:16px;flex-shrink:0}
.btn-send.sending svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Сегменты категорий: симметричные отступы */
.seg{display:flex;gap:2px;margin:0 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-sm);flex-shrink:0;padding:6px 3px;min-height:44px}
.seg-b{flex:1;padding:0 6px;border-radius:6px;font-size:13px;font-weight:500;color:var(--text-3);
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s var(--ease),color .15s var(--ease);min-width:0;min-height:32px}
.seg-b.on{background:var(--surface-2);color:var(--text)}
.seg-b .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg-b .cnt{font-size:10px;padding:1px 6px;border-radius:9px;background:var(--surface-3);
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;
  flex-shrink:0;min-width:16px;text-align:center}
.seg-b.on[data-k="local"] .cnt{background:var(--brand-glow);color:var(--brand)}
.seg-b.on[data-k="world"] .cnt{background:var(--world-glow);color:var(--world)}
.seg-b.on[data-k="seren"] .cnt{background:var(--seren-glow);color:var(--seren)}
.carousel-wrap{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;margin:0}
.carousel{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  scroll-behavior:smooth;scroll-padding:0 12px;gap:10px;padding:0 12px 10px;min-height:0;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x}
.carousel::-webkit-scrollbar{display:none}
.carousel-item{flex:0 0 calc(100% - 4px);scroll-snap-align:center;scroll-snap-stop:always;
  display:flex;min-height:0;width:calc(100% - 4px);padding:2px 0;touch-action:pan-x}
.carousel-dots{display:flex;justify-content:center;align-items:center;gap:6px;
  padding:8px 12px 12px;flex-shrink:0;min-height:28px}
.carousel-dot{width:6px;height:6px;border-radius:50%;background:var(--line-strong);
  transition:background .2s var(--ease),transform .2s var(--ease),width .2s var(--ease)}
.carousel-dot.active{background:var(--brand);width:18px;border-radius:3px}
.carousel-counter{font-size:11px;color:var(--text-3);font-family:var(--mono);
  font-variant-numeric:tabular-nums;margin-left:10px}
/* Карточка: убран touch-action: pan-x для разрешения вертикального скролла в .fi-body */
.fi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;display:flex;flex-direction:column;gap:10px;width:100%;height:100%;
  min-height:0;transition:border-color .2s var(--ease)}
.fi.active{border-color:var(--line-strong)}
.fi-h{display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size:11px;flex-shrink:0}
.fi-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:4px;
  font-size:10px;font-weight:600;letter-spacing:.03em;background:var(--surface-2);
  color:var(--text-3);border:1px solid var(--line);text-transform:uppercase;flex-shrink:0}
.fi.t-local .fi-badge{color:var(--brand);border-color:var(--brand-glow)}
.fi.t-world .fi-badge{color:var(--world);border-color:var(--world-glow)}
.fi.t-seren .fi-badge{color:var(--seren);border-color:var(--seren-glow)}
.fi-score{font-family:var(--mono);color:var(--text-3);font-variant-numeric:tabular-nums;flex-shrink:0}
.fi-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;font-size:15px;
  line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word;
  overflow-wrap:anywhere;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;padding:2px;
  touch-action:pan-y}
.fi-body::-webkit-scrollbar{width:4px}
.fi-body::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:2px}
.fi-body mark{background:var(--brand-glow);color:var(--brand);padding:0 3px;
  border-radius:2px;font-weight:600}
.fi-foot{display:flex;gap:6px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line);flex-shrink:0}
.fi-act{min-height:38px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;
  color:var(--text-2);transition:background .12s var(--ease),color .12s var(--ease),opacity .12s var(--ease);
  border:1px solid var(--line);background:transparent;display:inline-flex;
  align-items:center;gap:6px;white-space:nowrap}
.fi-act:active:not([disabled]){background:var(--surface-2)}
.fi-act.danger:active:not([disabled]){background:rgba(239,68,68,.08);color:var(--danger);border-color:rgba(239,68,68,.3)}
.fi-act.primary{background:var(--brand);color:white;border-color:transparent}
.fi-act.primary:active:not([disabled]){filter:brightness(1.1);color:white}
.fi-act[disabled]{opacity:.45;cursor:not-allowed}
.feed-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px 24px;color:var(--text-3);margin:0 12px;
  background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r)}
.feed-empty-ic{font-size:28px;margin-bottom:12px;opacity:.5;width:52px;height:52px;
  display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px}
.feed-empty-t{font-size:14px;font-weight:600;color:var(--text-2);margin-bottom:4px}
.feed-empty-d{font-size:13px;max-width:280px;line-height:1.45}
.base{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.base-h{padding:10px 12px 0;flex-shrink:0}
.base-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px;text-align:center;min-width:0}
.stat-v{font-size:20px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stat-l{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;
  margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.base-ctrls{display:flex;gap:6px;align-items:center}
.base-search{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:9px 12px;font:14px var(--font);color:var(--text);
  outline:none;transition:border-color .15s var(--ease);min-height:40px}
.base-search:focus{border-color:var(--brand)}
.base-search::placeholder{color:var(--text-dim)}
.base-sort{flex:0 0 auto;min-width:0;max-width:140px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 28px 9px 12px;
  font:13px var(--font);color:var(--text-2);outline:none;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;appearance:none;
  -webkit-appearance:none;min-height:40px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath fill='none' stroke='%23888' stroke-width='1.5' stroke-linecap='round' d='M1 1l4 4 4-4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center}
.base-sort option{background:var(--surface);color:var(--text)}
.base-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 12px 100px;
  display:flex;flex-direction:column;gap:8px;min-height:0;width:100%;
  -webkit-overflow-scrolling:touch}
.bi{width:100%;flex-shrink:0;height:100px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:12px;
  display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;cursor:pointer;
  transition:border-color .15s var(--ease)}
.bi:active{border-color:var(--line-strong)}
.bi-t{font-size:14px;line-height:1.55;color:var(--text);white-space:pre-wrap;
  word-break:break-word;overflow-wrap:anywhere;flex:1;overflow:hidden;position:relative}
.bi-t.truncated::after{content:"";position:absolute;bottom:0;left:0;right:0;height:28px;
  background:linear-gradient(180deg,transparent,var(--surface));pointer-events:none}
.bi-f{display:flex;justify-content:space-between;align-items:center;gap:6px;
  flex-wrap:wrap;font-size:11px;flex-shrink:0;padding-top:4px;border-top:1px solid var(--line)}
.bi-meta{display:flex;align-items:center;gap:8px;color:var(--text-3);flex-wrap:wrap}
.bi-tag{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;
  background:var(--brand-glow);color:var(--brand);text-transform:uppercase;letter-spacing:.03em}
.bi.shared .bi-tag{background:var(--world-glow);color:var(--world)}
.bi-date{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:10px}
.nv{position:fixed;inset:0;background:var(--bg);z-index:900;display:none;
  flex-direction:column;animation:fadeScale .2s var(--ease)}
.nv.on{display:flex}
@keyframes fadeScale{from{opacity:0;transform:scale(.98)}}
.nv-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
  padding-top:calc(12px + var(--safe-top));background:var(--surface);
  border-bottom:1px solid var(--line);flex-shrink:0;gap:10px}
.nv-back{min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center;
  font-size:22px;color:var(--text-2);border-radius:8px;transition:background .12s var(--ease)}
.nv-back:active{background:var(--surface-2)}
.nv-title{flex:1;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nv-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-3);flex-shrink:0}
.nv-b{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.nv-text{font-size:16px;line-height:1.7;color:var(--text);white-space:pre-wrap;
  word-break:break-word;overflow-wrap:anywhere}
.nv-ta{width:100%;min-height:200px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px;font:15px/1.6 var(--font);color:var(--text);
  outline:none;resize:vertical;transition:border-color .15s var(--ease)}
.nv-ta:focus{border-color:var(--brand)}
/* Футер полноэкранного просмотра: кнопки в один ряд */
.nv-f{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;
  padding-bottom:calc(10px + var(--safe-bot));background:var(--surface);
  border-top:1px solid var(--line);flex-shrink:0;flex-wrap:nowrap}
.nv-act{min-height:40px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;
  color:var(--text-2);transition:background .12s var(--ease),color .12s var(--ease);
  border:1px solid var(--line);background:transparent;display:inline-flex;
  align-items:center;gap:6px;white-space:nowrap}
.nv-act:active:not([disabled]){background:var(--surface-2)}
.nv-act.danger:active:not([disabled]){background:rgba(239,68,68,.08);color:var(--danger);border-color:rgba(239,68,68,.3)}
.nv-act.primary{background:var(--brand);color:white;border-color:transparent}
.nv-act.primary:active:not([disabled]){filter:brightness(1.1);color:white}
.nv-act[disabled]{opacity:.45;cursor:not-allowed}
/* Нижний бар без подложки */
.btab{position:sticky;bottom:0;left:0;right:0;display:flex;
  padding:4px 6px;padding-bottom:calc(4px + var(--safe-bot));z-index:50;flex-shrink:0;
  height:auto;min-height:var(--btab-h)}
.btab-b{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 8px;color:var(--text-3);font-size:13px;font-weight:500;
  border-radius:var(--r-sm);transition:background .15s var(--ease),color .15s var(--ease);min-height:44px}
.btab-b:active{background:var(--surface-2)}
.btab-b.on{background:var(--surface-2);color:var(--text)}
.btab-ic{font-size:16px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);display:none;z-index:1000}
.mo.on{display:block}
.md{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--surface);
  border-left:1px solid var(--line);display:flex;flex-direction:column;animation:slideIn .25s var(--ease)}
@keyframes slideIn{from{transform:translateX(100%)}}
.md-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;
  padding-top:calc(14px + var(--safe-top));border-bottom:1px solid var(--line);
  flex-shrink:0;min-height:52px}
.md-t{font-size:16px;font-weight:600;letter-spacing:-.01em}
.md-x{min-width:36px;min-height:36px;padding:8px;border-radius:8px;display:flex;
  align-items:center;justify-content:center;font-size:20px;color:var(--text-3);
  transition:background .12s var(--ease)}
.md-x:active{background:var(--surface-2);color:var(--text)}
.md-b{flex:1;overflow-y:auto;padding:14px 16px;padding-bottom:calc(14px + var(--safe-bot));
  -webkit-overflow-scrolling:touch}

<body data-theme="dark">
<div id="app-root"></div>
<script>
(function() {
  'use strict';

  // ============================================================
  // Легковесный контейнер зависимостей (DI)
  // ============================================================
  const DI = (() => {
    const factories = new Map();
    const instances = new Map();

    function register(name, factory, deps) {
      factories.set(name, { factory, deps: deps || [] });
    }

    function resolve(name) {
      if (instances.has(name)) return instances.get(name);
      const def = factories.get(name);
      if (!def) throw new Error('Module not found: ' + name);
      const resolvedDeps = def.deps.map(function(d) { return resolve(d); });
      const instance = def.factory.apply(null, resolvedDeps);
      instances.set(name, instance);
      return instance;
    }

    return { register: register, resolve: resolve };
  })();

  // ============================================================
  // Module: Utils (Core.NooUtils)
  // ============================================================
  DI.register('Utils', function() {
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function escRe(s) {
      return String(s == null ? '' : s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }
    function plural(n, one, few, many) {
      n = Math.abs(n);
      const a = n % 10, b = n % 100;
      if (a === 1 && b !== 11) return one;
      if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return few;
      return many;
    }
    const words = {
      symbols: function(n, l) {
        return n + ' ' + (l === 'en' ? plural(n, 'char', 'chars', 'chars') : plural(n, 'символ', 'символа', 'символов'));
      },
      peers: function(n, l) {
        return n + ' ' + (l === 'en' ? plural(n, 'peer', 'peers', 'peers') : plural(n, 'узел', 'узла', 'узлов'));
      },
      thoughts: function(n, l) {
        return n + ' ' + (l === 'en' ? plural(n, 'note', 'notes', 'notes') : plural(n, 'мысль', 'мысли', 'мыслей'));
      }
    };
    function word(key, n, lang) {
      const fn = words[key];
      return fn ? fn(n, lang) : String(n);
    }
    function fmtDate(ts, lang) {
      if (!ts) return '';
      const d = new Date(ts);
      const loc = lang === 'en' ? 'en-US' : 'ru-RU';
      try { return d.toLocaleDateString(loc, { day: '2-digit', month: 'short' }); }
      catch (_) { return ''; }
    }
    return { esc: esc, escRe: escRe, word: word, fmtDate: fmtDate };
  }, []);

  // ============================================================
  // Module: Logger (Core.Logger)
  // ============================================================
  DI.register('Logger', function() {
    function emit(level, msg, data) {
      const ts = new Date().toISOString().substr(11, 8);
      const fn = console[level] || console.log;
      fn('[' + ts + '][' + level.toUpperCase() + ']', msg, data === undefined ? '' : data);
    }
    return {
      info: function(m, d) { emit('info', m, d); },
      warn: function(m, d) { emit('warn', m, d); },
      error: function(m, d) { emit('error', m, d); }
    };
  }, []);

  // ============================================================
  // Module: Bus (Core.Bus)
  // ============================================================
  DI.register('Bus', function() {
    const map = new Map();
    return {
      on: function(event, fn) {
        if (!map.has(event)) map.set(event, new Set());
        map.get(event).add(fn);
      },
      off: function(event, fn) {
        const set = map.get(event);
        if (set) { set.delete(fn); if (set.size === 0) map.delete(event); }
      },
      emit: function(event, payload) {
        const set = map.get(event) || [];
        for (const fn of set) { try { fn(payload); } catch (err) { console.error(err); } }
      }
    };
  }, []);

  // ============================================================
  // Module: Store (Core.Store)
  // ============================================================
  DI.register('Store', function() {
    const prefix = 'noomium:';
    return {
      get: function(key, def) {
        try { const r = localStorage.getItem(prefix + key); return r ? JSON.parse(r) : def; }
        catch (e) { return def; }
      },
      set: function(key, val) {
        try { localStorage.setItem(prefix + key, JSON.stringify(val)); } catch (e) { /* ignore */ }
      },
      remove: function(key) {
        try { localStorage.removeItem(prefix + key); } catch (e) { /* ignore */ }
      }
    };
  }, []);

  // ============================================================
  // Module: I18n (Core.I18n)
  // ============================================================
  DI.register('I18n', function(store, bus) {
    const KEY = 'lang';
    const dicts = Object.create(null);
    let current = 'ru';
    const listeners = [];

    function format(str, params) {
      const s = String(str == null ? '' : str);
      if (!params) return s;
      return s.replace(/\{(\w+)\}/g, function(match, k) {
        return (params[k] !== undefined && params[k] !== null) ? String(params[k]) : match;
      });
    }

    function setLang(lang) {
      current = String(lang || 'ru');
      try { if (store) store.set(KEY, current); } catch (_) { /* ignore */ }
      for (let i = 0; i < listeners.length; i++) {
        try { listeners[i](current); } catch (_) { /* ignore */ }
      }
      if (bus && bus.emit) { try { bus.emit('i18n:change', { lang: current }); } catch (_) { /* ignore */ } }
    }

    function getLang() { return current; }

    function addDict(lang, dict) {
      dicts[String(lang)] = Object.assign(dicts[String(lang)] || {}, dict || {});
    }

    function t(key, params, fallback) {
      const d = dicts[current] || {};
      let val = Object.prototype.hasOwnProperty.call(d, key) ? d[key] : undefined;
      if (val === undefined) {
        const en = dicts['en'] || {};
        val = Object.prototype.hasOwnProperty.call(en, key) ? en[key] : undefined;
      }
      const out = val !== undefined ? val : (fallback !== undefined ? fallback : String(key));
      return format(out, params);
    }

    function onChange(fn) { if (typeof fn === 'function') listeners.push(fn); }

    try {
      const saved = store ? store.get(KEY, null) : null;
      if (saved && (saved === 'ru' || saved === 'en')) current = saved;
      else {
        const pref = (navigator.language || 'ru').toLowerCase();
        current = pref.indexOf('ru') === 0 ? 'ru' : 'en';
      }
    } catch (_) { /* ignore */ }

    return { t: t, setLang: setLang, getLang: getLang, addDict: addDict, onChange: onChange };
  }, ['Store', 'Bus']);

  // ============================================================
  // Module: Config (Core.NooConfig)
  // ============================================================
  DI.register('Config', function(store, log) {
    const KEY = 'cfg';
    const defaults = {
      room: 'noomium-main', threshold: 0.30, serendipity: 0.15,
      relays: ['wss://relay.damus.io', 'wss://nos.lol', 'wss://relay.primal.net'],
      kQuery: 21000, kAnswer: 21001, model: 'Xenova/all-MiniLM-L6-v2', dim: 384, debounce: 800,
      peerTTL: 60000, heartbeat: 30000, subWindow: 300, queryRateLimit: 3000,
      dbName: 'noomium_v8', storeName: 'notes', theme: 'dark', onboarded: false,
      publishCooldown: 1500, maxAnswersPerQuery: 5
    };
    const state = Object.assign({}, defaults);
    try {
      const saved = store ? store.get(KEY, null) : null;
      if (saved && typeof saved === 'object') Object.assign(state, saved);
    } catch (e) {
      if (log) log.warn('Config load failed', String(e));
    }
    return {
      defaults: function() { return Object.assign({}, defaults); },
      get: function(k, def) { return state.hasOwnProperty(k) ? state[k] : def; },
      set: function(k, v) { state[k] = v; },
      save: function() {
        try { if (store) store.set(KEY, state); }
        catch (e) { if (log) log.warn('Config save failed', String(e)); }
      }
    };
  }, ['Store', 'Logger']);

  // ============================================================
  // Module: DB (Core.NooDB)
  // ============================================================
  DI.register('DB', function(cfg, log) {
    let db = null, mem = null;

    function dbName() { return cfg.get('dbName', 'noomium_v8'); }
    function storeName() { return cfg.get('storeName', 'notes'); }

    function open() {
      return new Promise(function(resolve, reject) {
        if (db) return resolve(db);
        if (!window.indexedDB) { mem = new Map(); return resolve(null); }
        try {
          const req = indexedDB.open(dbName(), 1);
          req.onupgradeneeded = function(e) {
            const d = e.target.result;
            const s = storeName();
            if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' });
          };
          req.onsuccess = function(e) { db = e.target.result; resolve(db); };
          req.onerror = function() {
            if (log) log.warn('IDB open error', String(req.error));
            mem = new Map(); resolve(null);
          };
          req.onblocked = function() { mem = new Map(); resolve(null); };
        } catch (err) {
          if (log) log.warn('IDB unsupported', String(err));
          mem = new Map(); resolve(null);
        }
      });
    }

    function tx(mode, fn) {
      return open().then(function(d) {
        return new Promise(function(resolve, reject) {
          try {
            if (!d) {
              const mockStore = {
                get: function(k) {
                  return {
                    result: mem.get(k),
                    onsuccess: function(cb) { cb && cb(); },
                    onerror: function(cb) { cb && cb(); }
                  };
                },
                put: function(v) {
                  mem.set(v.id, v);
                  return {
                    onsuccess: function(cb) { cb && cb(); },
                    onerror: function(cb) { cb && cb(); }
                  };
                },
                delete: function(k) {
                  mem.delete(k);
                  return {
                    onsuccess: function(cb) { cb && cb(); },
                    onerror: function(cb) { cb && cb(); }
                  };
                },
                getAll: function() {
                  return {
                    result: Array.from(mem.values()),
                    onsuccess: function(cb) { cb && cb(); },
                    onerror: function(cb) { cb && cb(); }
                  };
                }
              };
              const r = fn(mockStore);
              r.onsuccess && r.onsuccess();
              resolve(r.result);
              return;
            }
            const transaction = d.transaction(storeName(), mode);
            const store = transaction.objectStore(storeName());
            const r = fn(store);
            r.onsuccess = function() { resolve(r.result); };
            r.onerror = function() {
              if (log) log.warn('DB op error', String(r.error));
              reject(r.error);
            };
          } catch (err) {
            if (log) log.warn('DB tx error', String(err));
            reject(err);
          }
        });
      });
    }

    return {
      put: function(note) { return tx('readwrite', function(s) { return s.put(note); }); },
      get: function(id) { return tx('readonly', function(s) { return s.get(id); }); },
      del: function(id) { return tx('readwrite', function(s) { return s.delete(id); }); },
      all: function() { return tx('readonly', function(s) { return s.getAll(); }); },
      bulkPut: function(notes) {
        return open().then(function(d) {
          return new Promise(function(resolve, reject) {
            try {
              if (!d) {
                for (let i = 0; i < notes.length; i++) mem.set(notes[i].id, notes[i]);
                return resolve(notes.length);
              }
              const transaction = d.transaction(storeName(), 'readwrite');
              const store = transaction.objectStore(storeName());
              for (let i = 0; i < notes.length; i++) store.put(notes[i]);
              transaction.oncomplete = function() { resolve(notes.length); };
              transaction.onerror = function() { reject(transaction.error); };
            } catch (err) { reject(err); }
          });
        });
      },
      reset: function() {
        if (db) { try { db.close(); } catch (_) { /* ignore */ } db = null; }
        if (mem) mem.clear();
        return new Promise(function(resolve) {
          try {
            const req = indexedDB.deleteDatabase(dbName());
            req.onsuccess = req.onerror = req.onblocked = function() { resolve(); };
          } catch (_) { resolve(); }
        });
      }
    };
  }, ['Config', 'Logger']);

  // ============================================================
  // Module: AI (Core.NooAI)
  // ============================================================
  DI.register('AI', function(cfg, log, bus) {
    let extractor = null, mode = 'loading', cache = Object.create(null);
    const progressFns = [];
    let loadPromise = null;

    function hashEmbed(text) {
      const DIM = cfg.get('dim', 384);
      const vec = new Float32Array(DIM);
      const tokens = (text || '').toLowerCase().match(/[a-zа-яё0-9]+/gi) || [];
      for (let t = 0; t < tokens.length; t++) {
        const tok = tokens[t];
        let h = 2166136261;
        for (let i = 0; i < tok.length; i++) { h ^= tok.charCodeAt(i); h = Math.imul(h, 16777619); }
        vec[Math.abs(h) % DIM] += 1;
        const h2 = Math.imul(h ^ 0x9e3779b9, 2654435761);
        vec[Math.abs(h2) % DIM] += 0.5;
      }
      let norm = 0;
      for (let i = 0; i < DIM; i++) norm += vec[i] * vec[i];
      norm = Math.sqrt(norm) || 1;
      for (let i = 0; i < DIM; i++) vec[i] /= norm;
      return Array.from(vec);
    }

    function doLoad(onProgress, attempt) {
      attempt = attempt || 0;
      const MODEL = cfg.get('model', 'Xenova/all-MiniLM-L6-v2');
      return import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2').then(function(mod) {
        if (mod.env) { mod.env.allowLocalModels = false; mod.env.useBrowserCache = true; }
        return mod.pipeline('feature-extraction', MODEL, {
          quantized: true,
          progress_callback: function(p) {
            if (p.status === 'progress' && p.total > 0) {
              const pct = p.loaded / p.total * 100;
              if (typeof onProgress === 'function') onProgress(pct);
              for (let i = 0; i < progressFns.length; i++) {
                try { progressFns[i](pct); } catch (_) { /* ignore */ }
              }
              if (bus && bus.emit) bus.emit('ai:progress', { pct: pct });
            }
          }
        });
      }).then(function(pipe) {
        extractor = pipe;
        mode = 'model';
        if (log) log.info('AI loaded: ' + MODEL);
      }).catch(function(err) {
        if (attempt < 2) {
          const delay = Math.min(30000, 2000 * Math.pow(2, attempt));
          if (log) log.warn('AI load fail, retry ' + (attempt + 1) + ' in ' + delay + 'ms', String(err && err.message || err));
          return new Promise(function(r) { setTimeout(r, delay); }).then(function() { return doLoad(onProgress, attempt + 1); });
        }
        if (log) log.warn('AI load failed, hash mode', String(err && err.message || err));
        mode = 'demo';
      });
    }

    return {
      ready: function() { return extractor !== null || mode === 'demo'; },
      getMode: function() { return mode; },
      onProgress: function(fn) { if (typeof fn === 'function') progressFns.push(fn); },
      load: function(onProgress) {
        if (extractor || mode === 'demo') return Promise.resolve();
        if (loadPromise) return loadPromise;
        loadPromise = doLoad(onProgress).catch(function() { mode = 'demo'; loadPromise = null; return Promise.resolve(); });
        return loadPromise;
      },
      embed: function(text) {
        const t = (text || '').trim();
        if (!t) return Promise.resolve(null);
        if (cache[t]) return Promise.resolve(cache[t]);
        let promise;
        if (extractor) {
          promise = Promise.resolve().then(function() {
            return Promise.race([
              extractor(t, { pooling: 'mean', normalize: true }),
              new Promise(function(_, reject) { setTimeout(function() { reject(new Error('embed timeout')); }, 15000); })
            ]);
          }).then(function(out) {
            return Array.from(out.data);
          }).catch(function(err) {
            if (log) log.warn('embed fail, hash', String(err && err.message || err));
            return hashEmbed(t);
          });
        } else {
          promise = Promise.resolve(hashEmbed(t));
        }
        return promise.then(function(v) { cache[t] = v; return v; });
      },
      cosine: function(a, b) {
        if (!a || !b || a.length !== b.length) return 0;
        let sum = 0;
        for (let i = 0; i < a.length; i++) sum += a[i] * b[i];
        return Math.abs(sum) < 1e-8 ? 0 : sum;
      }
    };
  }, ['Config', 'Logger', 'Bus']);

  // ============================================================
  // Module: Net (Core.NooNet)
  // ============================================================
  DI.register('Net', function(cfg, DB, AI, log, bus) {
    let pool = null, sk = null, pk = null, queryId = null;
    const peers = new Map();
    const answers = [];
    let onUpdate = null, hbTimer = null, lastQueryTime = 0;
    let nostr = null, subscription = null;
    const peerListeners = [];
    let started = false, reconnecting = false;
    const seen = new Set();
    const rateLimitedUntil = new Map();
    let connAttempts = 0;
    const MAX_CONN_ATTEMPTS = 10;
    let netStatus = 'disconnected';

    function setStatus(s) {
      netStatus = s;
      if (bus && bus.emit) { try { bus.emit('net:status', { status: s }); } catch (_) { /* ignore */ } }
    }

    function notifyPeers() {
      const count = peers.size;
      for (let i = 0; i < peerListeners.length; i++) {
        try { peerListeners[i](count); } catch (_) { /* ignore */ }
      }
      if (bus && bus.emit) { try { bus.emit('net:peers', { count: count }); } catch (_) { /* ignore */ } }
    }

    function isValidEvent(ev) {
      if (!ev || typeof ev !== 'object') return false;
      if (typeof ev.id !== 'string' || ev.id.length !== 64) return false;
      if (typeof ev.pubkey !== 'string' || ev.pubkey.length !== 64) return false;
      if (typeof ev.kind !== 'number') return false;
      if (!Array.isArray(ev.tags)) return false;
      return true;
    }

    function isDuplicate(ev) {
      if (!ev || !ev.id) return true;
      if (seen.has(ev.id)) return true;
      seen.add(ev.id);
      if (seen.size > 1000) {
        const arr = Array.from(seen);
        seen.clear();
        for (let i = arr.length - 500; i < arr.length; i++) seen.add(arr[i]);
      }
      return false;
    }

    function safePublish(ev) {
      const relays = cfg.get('relays', []);
      const now = Date.now();
      const goodRelays = [];
      for (let i = 0; i < relays.length; i++) {
        const until = rateLimitedUntil.get(relays[i]) || 0;
        if (until <= now) goodRelays.push(relays[i]);
      }
      if (goodRelays.length === 0) {
        if (log) log.warn('All relays rate-limited, skipping publish');
        return Promise.resolve();
      }
      try {
        const pubs = pool.publish(goodRelays, ev);
        if (pubs && pubs.forEach) {
          pubs.forEach(function(p, relay) {
            if (p && p.then) {
              p.catch(function(err) {
                const msg = err && err.message ? String(err.message) : String(err);
                if (msg.indexOf('rate-limited') >= 0 || msg.indexOf('rate') >= 0 || msg.indexOf('blocked') >= 0) {
                  rateLimitedUntil.set(relay, Date.now() + 60000);
                  if (log) log.warn('Relay ' + relay + ' limited, 60s backoff');
                } else if (msg.indexOf('websocket') >= 0 || msg.indexOf('connect') >= 0) {
                  rateLimitedUntil.set(relay, Date.now() + 30000);
                  if (log) log.warn('Relay ' + relay + ' ws error, 30s backoff');
                  if (netStatus !== 'connected') scheduleReconnect();
                } else if (log) { log.warn('publish fail @ ' + relay + ': ' + msg); }
              });
            }
          });
        }
      } catch (err) {
        if (log) log.warn('publish throw', String(err));
      }
      return Promise.resolve();
    }

    function onEvent(ev) {
      try {
        if (!ev || typeof ev !== 'object') return;
        if (!Array.isArray(ev.tags)) return;
        if (!isValidEvent(ev)) return;
        if (isDuplicate(ev)) return;
        if (pk && ev.pubkey === pk) return;

        const had = peers.has(ev.pubkey);
        peers.set(ev.pubkey, Date.now());
        if (!had) notifyPeers();
        setStatus('connected');
        connAttempts = 0;

        const KQ = cfg.get('kQuery', 21000);
        const KA = cfg.get('kAnswer', 21001);
        const room = cfg.get('room', 'noomium-main');

        if (ev.kind === KQ) {
          let q;
          try { q = JSON.parse(ev.content); } catch (_) { return; }
          if (!q || !q.vector || !Array.isArray(q.vector)) return;
          DB.all().then(function(allNotes) {
            const floor = cfg.get('threshold', 0.30) - cfg.get('serendipity', 0.15);
            const toSend = [];
            for (let i = 0; i < allNotes.length; i++) {
              const n = allNotes[i];
              if (!n || !n.shared || !n.vector) continue;
              if (AI.cosine(q.vector, n.vector) >= floor) toSend.push(n);
            }
            toSend.sort(function(a, b) { return AI.cosine(q.vector, b.vector) - AI.cosine(q.vector, a.vector); });
            const maxAnswers = cfg.get('maxAnswersPerQuery', 5);
            const limited = toSend.slice(0, maxAnswers);
            for (let j = 0; j < limited.length; j++) {
              try {
                const ans = nostr.finalizeEvent({
                  kind: KA,
                  created_at: Math.floor(Date.now() / 1000),
                  tags: [['t', room], ['e', ev.id]],
                  content: JSON.stringify({ text: limited[j].text, vector: limited[j].vector })
                }, sk);
                (function(answer, delay) {
                  setTimeout(function() { safePublish(answer); }, delay);
                })(ans, j * 500);
              } catch (e) { if (log) log.warn('answer finalize fail', String(e)); }
            }
          }).catch(function(e) { if (log) log.warn('DB.all fail', String(e)); });
        }

        if (ev.kind === KA) {
          let eTag = null;
          for (let i = 0; i < ev.tags.length; i++) {
            const tag = ev.tags[i];
            if (Array.isArray(tag) && tag[0] === 'e') { eTag = tag[1]; break; }
          }
          if (eTag && eTag === queryId) {
            let data;
            try { data = JSON.parse(ev.content); } catch (_) { return; }
            if (data && data.text && data.vector) {
              let isDupAnswer = false;
              for (let j = 0; j < answers.length; j++) {
                if (answers[j].id === ev.id) { isDupAnswer = true; break; }
              }
              if (!isDupAnswer) {
                answers.push({
                  id: ev.id, text: data.text, vector: data.vector,
                  peer: ev.pubkey.slice(0, 6), fullPubkey: ev.pubkey, createdAt: Date.now()
                });
                if (typeof onUpdate === 'function') { try { onUpdate(); } catch (_) { /* ignore */ } }
              }
            }
          }
        }
      } catch (err) {
        if (log) log.warn('onEvent', String(err && err.message || err));
      }
    }

    function startHeartbeat() {
      if (hbTimer) clearInterval(hbTimer);
      const hbInterval = cfg.get('heartbeat', 30000);
      const ttl = cfg.get('peerTTL', 60000);
      hbTimer = setInterval(function() {
        const now = Date.now();
        let removed = 0;
        peers.forEach(function(ts, pubkey) {
          if (now - ts > ttl) { peers.delete(pubkey); removed++; }
        });
        if (removed > 0) {
          notifyPeers();
          if (typeof onUpdate === 'function') { try { onUpdate(); } catch (_) { /* ignore */ } }
        }
        const cutoff = now - 300000;
        for (let i = answers.length - 1; i >= 0; i--) {
          if (!peers.has(answers[i].fullPubkey) || answers[i].createdAt < cutoff) {
            answers.splice(i, 1);
          }
        }
      }, hbInterval);
    }

    function scheduleReconnect() {
      if (reconnecting || !started) return;
      if (connAttempts >= MAX_CONN_ATTEMPTS) {
        if (log) log.warn('Max reconnect attempts reached');
        setStatus('failed');
        return;
      }
      reconnecting = true;
      const delay = Math.min(60000, 1000 * Math.pow(2, connAttempts));
      connAttempts++;
      if (log) log.info('Reconnect attempt ' + connAttempts + ' in ' + delay + 'ms');
      setStatus('reconnecting');
      setTimeout(function() {
        reconnecting = false;
        try {
          if (subscription && typeof subscription.close === 'function') {
            try { subscription.close(); } catch (_) { /* ignore */ }
          }
          const room = cfg.get('room', 'noomium-main');
          const KQ = cfg.get('kQuery', 21000);
          const KA = cfg.get('kAnswer', 21001);
          const subWindow = cfg.get('subWindow', 300);
          const nowSec = Math.floor(Date.now() / 1000);
          if (pool) {
            subscription = pool.subscribeMany(cfg.get('relays', []),
              [{ kinds: [KQ, KA], '#t': [room], since: nowSec - subWindow }],
              { onevent: onEvent });
            if (log) log.info('Reconnect: subscribed');
          }
        } catch (err) {
          if (log) log.warn('Reconnect fail', String(err));
        }
      }, delay);
    }

    return {
      onPeers: function(fn) { if (typeof fn === 'function') peerListeners.push(fn); },
      getStatus: function() { return netStatus; },
      init: function(callback) {
        if (started) return Promise.resolve();
        onUpdate = callback;
        connAttempts = 0;
        return Promise.resolve().then(function() {
          return import('https://cdn.jsdelivr.net/npm/nostr-tools@2.7.2/+esm');
        }).then(function(mod) {
          nostr = mod;
          const KEY = 'noomium:sk';
          let keyHex = null;
          try { keyHex = localStorage.getItem(KEY); } catch (_) { /* ignore */ }
          if (!keyHex) {
            const raw = mod.generateSecretKey();
            keyHex = Array.from(raw).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
            try { localStorage.setItem(KEY, keyHex); } catch (_) { /* ignore */ }
          }
          sk = new Uint8Array(keyHex.match(/.{1,2}/g).map(function(b) { return parseInt(b, 16); }));
          pk = mod.getPublicKey(sk);
          pool = new mod.SimplePool();
          const nowSec = Math.floor(Date.now() / 1000);
          const room = cfg.get('room', 'noomium-main');
          const KQ = cfg.get('kQuery', 21000);
          const KA = cfg.get('kAnswer', 21001);
          const subWindow = cfg.get('subWindow', 300);
          try {
            subscription = pool.subscribeMany(cfg.get('relays', []),
              [{ kinds: [KQ, KA], '#t': [room], since: nowSec - subWindow }],
              { onevent: onEvent, onclose: function() { scheduleReconnect(); } });
          } catch (e) {
            if (log) log.warn('sub fail', String(e));
            scheduleReconnect();
          }
          started = true;
          startHeartbeat();
          notifyPeers();
          setStatus('connecting');
          if (log) log.info('net started, room=' + room);
        }).catch(function(err) {
          if (log) log.error('nostr load fail', String(err && err.message || err));
          setStatus('failed');
          return Promise.resolve();
        });
      },
      send: function(vector) {
        if (!pool || !nostr || AI.getMode() === 'demo') return;
        const now = Date.now();
        const rate = cfg.get('queryRateLimit', 3000);
        if (now - lastQueryTime < rate) return;
        lastQueryTime = now;
        answers.length = 0;
        try {
          const ev = nostr.finalizeEvent({
            kind: cfg.get('kQuery', 21000),
            created_at: Math.floor(Date.now() / 1000),
            tags: [['t', cfg.get('room', 'noomium-main')]],
            content: JSON.stringify({ vector: vector })
          }, sk);
          queryId = ev.id;
          safePublish(ev);
          if (typeof onUpdate === 'function') { try { onUpdate(); } catch (_) { /* ignore */ } }
        } catch (e) { if (log) log.warn('pub fail', String(e)); }
      },
      activeAnswers: function() {
        const out = [];
        for (let i = 0; i < answers.length; i++) {
          if (peers.has(answers[i].fullPubkey)) out.push(answers[i]);
        }
        return out;
      },
      peerCount: function() { return peers.size; },
      stop: function() {
        if (hbTimer) { clearInterval(hbTimer); hbTimer = null; }
        if (subscription && typeof subscription.close === 'function') {
          try { subscription.close(); } catch (_) { /* ignore */ }
        }
        if (pool && typeof pool.close === 'function') {
          try { pool.close(); } catch (_) { /* ignore */ }
        }
        started = false;
        subscription = null;
        pool = null;
        peers.clear();
        answers.length = 0;
        seen.clear();
        rateLimitedUntil.clear();
        peerListeners.length = 0;
        setStatus('disconnected');
      },
      restart: function(callback) {
        this.stop();
        onUpdate = callback;
        return this.init(callback);
      }
    };
  }, ['Config', 'DB', 'AI', 'Logger', 'Bus']);

  // Module: Modal (UI.Modal)

  DI.register('Modal', function() {
    let overlay = null, container = null, lastFocus = null, escHandler = null;

    function ensureDOM() {
      if (overlay) return;
      overlay = document.createElement('div');
      overlay.className = 'mo';
      container = document.createElement('div');
      container.className = 'md';
      overlay.appendChild(container);
      document.body.appendChild(overlay);
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeModal();
      });
    }

    function openModal(opts) {
      ensureDOM();
      container.innerHTML = '';
      lastFocus = document.activeElement;

      const header = document.createElement('div');
      header.className = 'md-h';
      const title = document.createElement('div');
      title.className = 'md-t';
      title.textContent = (opts && opts.title) || '';
      const closeBtn = document.createElement('button');
      closeBtn.className = 'md-x';
      closeBtn.textContent = '×';
      closeBtn.setAttribute('aria-label', 'Close');
      closeBtn.onclick = closeModal;
      header.appendChild(title);
      header.appendChild(closeBtn);

      const body = document.createElement('div');
      body.className = 'md-b';
      if (opts && opts.body) {
        if (opts.body.nodeType) {
          body.appendChild(opts.body);
        } else {
          body.textContent = String(opts.body);
        }
      }

      container.appendChild(header);
      container.appendChild(body);

      if (opts && opts.buttons && opts.buttons.length > 0) {
        const footer = document.createElement('div');
        footer.className = 'md-f';
        opts.buttons.forEach(function(btn) {
          const el = document.createElement('button');
          el.className = 'btn-send' + (btn.primary ? '' : '') + (btn.danger ? ' ' : '');
          if (!btn.primary) {
            el.style.cssText = 'background:var(--surface-2);color:var(--text);border:1px solid var(--line)';
          }
          el.textContent = btn.text || 'OK';
          if (btn.disabled) el.disabled = true;
          el.onclick = function() { if (btn.onClick) btn.onClick(); };
          footer.appendChild(el);
        });
        container.appendChild(footer);
      }

      overlay.classList.add('on');

      if (escHandler) {
        document.removeEventListener('keydown', escHandler);
        escHandler = null;
      }
      escHandler = function(e) {
        if (overlay && overlay.classList.contains('on') && e.key === 'Escape') {
          closeModal();
        }
      };
      document.addEventListener('keydown', escHandler);
    }

    function closeModal() {
      if (overlay) overlay.classList.remove('on');
      if (escHandler) {
        document.removeEventListener('keydown', escHandler);
        escHandler = null;
      }
      try {
        if (lastFocus && lastFocus.focus) lastFocus.focus();
      } catch (_) { /* ignore */ }
    }

    return { open: openModal, close: closeModal };
  }, []);

  DI.register('Toast', function() {
    let container = null;
    const LIMIT = 3;
    const icons = { ok: '✓', err: '×', warn: '!', info: '◆' };

    function ensureContainer() {
      if (container) return;
      container = document.createElement('div');
      container.className = 'tc';
      document.body.appendChild(container);
    }

    function show(type, msg, ms) {
      ensureContainer();
      const cls = type === 'ok' ? 'ok' : type === 'err' ? 'err' : type === 'warn' ? 'warn' : 'info';
      const el = document.createElement('div');
      el.className = 'tt ' + cls;
      const ic = document.createElement('span');
      ic.className = 'tt-ic';
      ic.textContent = icons[cls] || icons.info;
      const m = document.createElement('span');
      m.textContent = String(msg || '');
      el.appendChild(ic);
      el.appendChild(m);
      container.appendChild(el);
      while (container.childElementCount > LIMIT) {
        try { container.removeChild(container.firstChild); } catch (_) { break; }
      }
      setTimeout(function() {
        el.style.transition = 'opacity .2s';
        el.style.opacity = '0';
        setTimeout(function() { try { el.remove(); } catch (_) { /* ignore */ } }, 200);
      }, ms || 2200);
    }

    return { show: show };
  }, []);

        '<div class="aip-pct">0%</div>';
      overlay.appendChild(card);
      document.body.appendChild(overlay);
      fillEl = card.querySelector('.aip-fill');
      pctEl = card.querySelector('.aip-pct');
    }

    function update(percent) {
      if (!fillEl) return;
      const value = Math.max(0, Math.min(100, Math.round(percent)));

    function hide() {
      if (overlay) { try { overlay.remove(); } catch (_) { /* ignore */ } }
      overlay = null; fillEl = null; pctEl = null;
    }

    return { show: show, hide: hide, update: update };
  }, []);

    function highlightText(text, query) {
      if (!query) return Utils.esc(text);
      let out = Utils.esc(text);
      const words = query.toLowerCase().split(/\s+/).filter(function(w) { return w.length > 2; });
      for (let i = 0; i < words.length; i++) {
        const re = new RegExp('(' + Utils.escRe(words[i]) + ')', 'gi');
        out = out.replace(re, '<mark>$1</mark>');
      }
      return out;
    }

    function isOwnItem(item) { return !item.peer; }

    // renderItemHTML: кнопка «Развить» для своих мыслей теперь primary (фиолетовая)
    function renderItemHTML(item) {
      if (!item) return '';
      const own = isOwnItem(item);
      const typeLabel = own
        ? (item.shared ? translate('base.tag.shared') : translate('base.tag.private'))
        : ('· ' + item.peer);
      const score = typeof item.score === 'number' ? Math.round(item.score * 100) + '%' : '';
      const queryText = getEditorValue();
      let actions = '';

      if (own) {
        actions =
          '<button class="fi-act primary" data-act="develop" data-id="' + Utils.esc(item.id) + '">' + translate('btn.develop') + '</button>' +
          '<button class="fi-act" data-act="toggle" data-id="' + Utils.esc(item.id) + '">' +
            (item.shared ? translate('btn.toggle.priv') : translate('btn.toggle.pub')) +
          '</button>' +

          '<button class="fi-act danger" data-act="del" data-id="' + Utils.esc(item.id) + '">' + translate('btn.del') + '</button>';
      } else {
        actions = '<button class="fi-act primary" data-act="develop" data-id="' + Utils.esc(item.id) + '">' + translate('btn.develop') + '</button>';
      }

      return '<div class="fi t-' + state.seg + '" data-id="' + Utils.esc(item.id) + '">' +
        '<div class="fi-h"><span class="fi-badge">' + Utils.esc(typeLabel) + '</span><span class="fi-score">' + Utils.esc(score) + '</span></div>' +

        '<div class="fi-foot">' + actions + '</div></div>';
