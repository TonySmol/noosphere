<!doctype html>
<html lang="ru">
<head>
<meta name="app-version" content="1.2.8">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b10">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: wss:; worker-src 'self' blob:; connect-src * https: wss:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src * data: blob:;">
<title>NOOmium</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>◆</text></svg>">
<!-- NOOMIUM_MODULE_START CSS -->
<style>
:root{
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.7,.2,1);
  --gap:8px;
  --gap-sm:6px;
  --r:12px;--r-sm:8px;--r-xs:5px;
  --font:ui-sans-serif,-apple-system,'SF Pro Text','Inter','Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --hdr-h:48px;--btab-h:56px;
}
[data-theme="dark"]{
  --bg:#0b0b10;--bg-2:#121218;--surface:#16161e;--surface-2:#1c1c26;--surface-3:#242430;
  --text:#ececf1;--text-2:#a0a0ae;--text-3:#6c6c7a;--text-dim:#484855;
  --line:rgba(255,255,255,.06);--line-strong:rgba(255,255,255,.11);
  --brand:#8b7cff;--brand-glow:rgba(139,124,255,.14);
  --world:#38bdf8;--world-glow:rgba(56,189,248,.12);
  --seren:#4ade80;--seren-glow:rgba(74,222,128,.12);
  --danger:#ef4444;--danger-glow:rgba(239,68,68,.14);
  --warning:#eab308;--ok:#22c55e;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#fafafa;--bg-2:#ffffff;--surface:#ffffff;--surface-2:#f4f4f6;--surface-3:#eaeaed;
  --text:#1a1a22;--text-2:#52525c;--text-3:#8a8a95;--text-dim:#b4b4be;
  --line:rgba(0,0,0,.06);--line-strong:rgba(0,0,0,.12);
  --brand:#6d5ef5;--brand-glow:rgba(109,94,245,.10);
  --world:#0284c7;--world-glow:rgba(2,132,199,.08);
  --seren:#16a34a;--seren-glow:rgba(22,163,74,.08);
  --danger:#dc2626;--danger-glow:rgba(220,38,38,.10);
  --warning:#ca8a04;--ok:#16a34a;
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);
  font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;outline:none}
button[disabled]{opacity:.45;cursor:not-allowed}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
#app-root{height:100vh;height:100dvh;display:none;flex-direction:column;overflow:hidden;}
body.show-app #app-root{display:flex}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
  padding-top:calc(10px + var(--safe-top));padding-bottom:10px;background:var(--surface);
  border-bottom:1px solid var(--line);flex-shrink:0;min-height:var(--hdr-h);gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.01em;flex-shrink:0}
.logo-mark{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:6px;background:var(--brand);color:white;font-weight:800;font-size:12px}
.logo-dot{color:var(--brand);margin:0 .5px}
.hdr-status{display:flex;align-items:center;gap:10px;flex:1;min-width:0;justify-content:flex-end;
  font-size:11px;color:var(--text-3);font-family:var(--mono);letter-spacing:.02em;overflow:hidden}
.hdr-st-item{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0}
.hdr-st-dot{width:6px;height:6px;border-radius:50%;background:var(--text-dim);flex-shrink:0}
.hdr-st-dot.ok{background:var(--ok)}
.hdr-st-dot.warn{background:var(--warning)}
.hdr-st-dot.err{background:var(--danger)}
.hdr-st-dot.load{background:var(--brand);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.hdr-st-sep{color:var(--line-strong);flex-shrink:0}
.burger{min-width:44px;min-height:44px;padding:10px;border-radius:10px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transition:background .15s var(--ease);flex-shrink:0}
.burger:active{background:var(--surface-2)}
.burger-line{width:16px;height:2px;background:var(--text-2);border-radius:1px}
.ws{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0;
  gap:var(--gap);padding-bottom:0;padding-top:var(--gap)}
.seg{display:flex;gap:2px;margin:0 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-sm);flex-shrink:0;padding:6px 3px;min-height:44px}
.seg-b{flex:1;padding:0 6px;border-radius:6px;font-size:13px;font-weight:500;color:var(--text-3);
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s var(--ease),color .15s var(--ease);min-width:0;min-height:32px}
.seg-b.on{background:var(--surface-2);color:var(--text)}
.seg-b .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg-b .cnt{font-size:10px;padding:1px 6px;border-radius:9px;background:var(--surface-3);
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;
  flex-shrink:0;min-width:16px;text-align:center}
.seg-b.on[data-k="local"] .cnt{background:var(--brand-glow);color:var(--brand)}
.seg-b.on[data-k="world"] .cnt{background:var(--world-glow);color:var(--world)}
.seg-b.on[data-k="seren"] .cnt{background:var(--seren-glow);color:var(--seren)}
.carousel-wrap{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;margin:0;padding:0}
.carousel{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  scroll-behavior:smooth;scroll-padding:0 12px;gap:10px;padding:0 12px 0;min-height:0;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x}
.carousel::-webkit-scrollbar{display:none}
.carousel-item{flex:0 0 calc(100% - 4px);scroll-snap-align:center;scroll-snap-stop:always;
  display:flex;min-height:0;width:calc(100% - 4px);padding:2px 0;touch-action:pan-x}
.carousel-dots{display:flex;justify-content:center;align-items:center;gap:4px;
  padding:6px 12px 8px;flex-shrink:0;min-height:24px;flex-wrap:wrap}
.carousel-dot{width:4px;height:4px;border-radius:50%;background:var(--line-strong);
  transition:background .2s var(--ease),transform .2s var(--ease),width .2s var(--ease)}
.carousel-dot.active{background:var(--brand);width:12px;border-radius:2px}
.carousel-counter{font-size:11px;color:var(--text-3);font-family:var(--mono);
  font-variant-numeric:tabular-nums;margin-left:10px}
.fi{background:var(--surface);border:1px solid var(--line);border-style:solid;border-radius:var(--r);
  padding:14px;display:flex;flex-direction:column;gap:10px;width:100%;height:100%;
  min-height:0;transition:border-color .2s var(--ease)}
.fi.active{border-color:var(--line-strong)}
.fi-h{display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size:11px;flex-shrink:0}
.fi-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:4px;
  font-size:10px;font-weight:600;letter-spacing:.03em;background:var(--surface-2);
  color:var(--text-3);border:1px solid var(--line);text-transform:uppercase;flex-shrink:0}
.fi.t-local .fi-badge{color:var(--brand);border-color:var(--brand-glow)}
.fi.t-world .fi-badge{color:var(--world);border-color:var(--world-glow)}
.fi.t-seren .fi-badge{color:var(--seren);border-color:var(--seren-glow)}
.fi-score{display:inline-flex;align-items:center;gap:4px;flex-shrink:0;
  font-family:var(--mono);font-variant-numeric:tabular-nums}
.fi-score-label{font-size:10px;color:var(--text-3);text-transform:lowercase}
.fi-score-value{font-size:11px;font-weight:600}
.fi.t-local .fi-score-value{color:var(--brand)}
.fi.t-world .fi-score-value{color:var(--world)}
.fi.t-seren .fi-score-value{color:var(--seren)}
.fi-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;font-size:15px;
  line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word;
  overflow-wrap:anywhere;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;padding:2px;
  touch-action:pan-y pinch-zoom}
.fi-body::-webkit-scrollbar{width:4px}
.fi-body::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:2px}
.fi-body mark{background:var(--brand-glow);color:var(--brand);padding:0 3px;
  border-radius:2px;font-weight:600}
.fi-foot{display:flex;gap:6px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line);flex-shrink:0}
.fi-act{min-height:38px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;
  color:var(--text-2);transition:background .12s var(--ease),color .12s var(--ease),opacity .12s var(--ease);
  border:1px solid var(--line);background:transparent;display:inline-flex;
  align-items:center;gap:6px;white-space:nowrap}
.fi-act:active:not([disabled]){background:var(--surface-2)}
.fi-act.danger:active:not([disabled]){background:var(--danger-glow);color:var(--danger);border-color:rgba(239,68,68,.3)}
.fi-act.primary{background:var(--brand);color:white;border-color:transparent}
.fi-act.primary:active:not([disabled]){filter:brightness(1.1);color:white}
.fi-act[disabled]{opacity:.45;cursor:not-allowed}
.ed{background:var(--surface);margin:0 12px;border:1px solid var(--line);
  border-radius:var(--r);padding:10px 12px;flex-shrink:0;transition:border-color .15s var(--ease)}
.ed:focus-within{border-color:var(--brand)}
.ed-ta{width:100%;min-height:44px;max-height:110px;background:transparent;border:none;
  outline:none;resize:none;font:15px/1.5 var(--font);color:var(--text);padding:4px 0}
.ed-ta::placeholder{color:var(--text-dim)}
.ed-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line);gap:8px}
.ed-cnt{font-size:11px;color:var(--text-3);font-family:var(--mono);font-variant-numeric:tabular-nums}
.ed-acts{display:flex;gap:8px;align-items:center;flex:1;justify-content:flex-end}
.tog-sw{display:inline-flex;align-items:center;background:var(--surface-2);
  border:1px solid var(--line);border-radius:999px;padding:3px;position:relative;
  height:40px;min-width:140px;user-select:none}
.tog-sw-opt{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  height:100%;padding:0 12px;font-size:13px;font-weight:600;color:var(--text-3);
  border-radius:999px;z-index:2;position:relative;cursor:pointer;
  transition:color .2s var(--ease);white-space:nowrap;min-width:62px}
.tog-sw-opt.on{color:var(--text)}
.tog-sw-thumb{position:absolute;top:3px;bottom:3px;width:calc(50% - 3px);
  background:var(--surface-3);border-radius:999px;left:3px;
  transition:left .25s var(--ease),background .2s var(--ease);z-index:1;
  box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tog-sw[data-mode="world"] .tog-sw-thumb{left:calc(50%);background:var(--world-glow)}
.tog-sw[data-mode="world"] .tog-sw-opt[data-v="world"]{color:var(--world)}
.tog-sw[data-mode="private"] .tog-sw-thumb{background:var(--brand-glow)}
.tog-sw[data-mode="private"] .tog-sw-opt[data-v="private"]{color:var(--brand)}
.btn-send{height:40px;min-width:44px;padding:0 16px;border-radius:999px;background:var(--brand);
  color:white;font-size:14px;font-weight:600;display:inline-flex;align-items:center;
  justify-content:center;gap:6px;box-shadow:0 2px 8px var(--brand-glow);
  transition:transform .1s var(--ease),filter .15s var(--ease),opacity .15s var(--ease)}
.btn-send:active:not([disabled]){transform:scale(.95)}
.btn-send:hover:not([disabled]){filter:brightness(1.08)}
.btn-send[disabled]{opacity:.5}
.btn-send.sending{pointer-events:none;opacity:.7}
.btn-send svg{width:16px;height:16px;flex-shrink:0}
.btn-send.sending svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.md-btn{min-height:40px;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .1s var(--ease),filter .15s var(--ease),opacity .15s var(--ease);cursor:pointer}
.md-btn:active:not([disabled]){transform:scale(.95)}
.feed-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px 24px;color:var(--text-3);margin:0 12px;
  background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r)}
.feed-empty-ic{font-size:28px;margin-bottom:12px;opacity:.5;width:52px;height:52px;
  display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px}
.feed-empty-t{font-size:14px;font-weight:600;color:var(--text-2);margin-bottom:4px}
.feed-empty-d{font-size:13px;max-width:280px;line-height:1.45}
.base{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.base-h{padding:10px 12px 0;flex-shrink:0}
.base-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px;text-align:center;min-width:0}
.stat-v{font-size:20px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stat-l{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;
  margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.base-ctrls{display:flex;gap:6px;align-items:center}
.base-search{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:9px 12px;font:14px var(--font);color:var(--text);
  outline:none;transition:border-color .15s var(--ease);min-height:40px}
.base-search:focus{border-color:var(--brand)}
.base-search::placeholder{color:var(--text-dim)}
.base-sort{flex:0 0 auto;min-width:0;max-width:140px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 28px 9px 12px;
  font:13px var(--font);color:var(--text-2);outline:none;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;appearance:none;
  -webkit-appearance:none;min-height:40px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath fill='none' stroke='%23888' stroke-width='1.5' stroke-linecap='round' d='M1 1l4 4 4-4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center}
.base-sort option{background:var(--surface);color:var(--text)}
.base-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 12px 100px;
  display:flex;flex-direction:column;gap:8px;min-height:0;width:100%;
  -webkit-overflow-scrolling:touch}
.bi{width:100%;flex-shrink:0;height:100px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:12px;
  display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;cursor:pointer;
  transition:border-color .15s var(--ease)}
.bi:active{border-color:var(--line-strong)}
.bi-t{font-size:14px;line-height:1.55;color:var(--text);white-space:pre-wrap;
  word-break:break-word;overflow-wrap:anywhere;flex:1;overflow:hidden;position:relative}
.bi-t.truncated::after{content:"";position:absolute;bottom:0;left:0;right:0;height:28px;
  background:linear-gradient(180deg,transparent,var(--surface));pointer-events:none}
.bi-f{display:flex;justify-content:space-between;align-items:center;gap:6px;
  flex-wrap:wrap;font-size:11px;flex-shrink:0;padding-top:4px;border-top:1px solid var(--line)}
.bi-meta{display:flex;align-items:center;gap:8px;color:var(--text-3);flex-wrap:wrap}
.bi-tag{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;
  background:var(--brand-glow);color:var(--brand);text-transform:uppercase;letter-spacing:.03em}
.bi.shared .bi-tag{background:var(--world-glow);color:var(--world)}
.bi-date{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:10px}
.nv{position:fixed;inset:0;background:var(--bg);z-index:900;display:none;
  flex-direction:column;animation:fadeScale .2s var(--ease)}
.nv.on{display:flex}
@keyframes fadeScale{from{opacity:0;transform:scale(.98)}}
.nv-f{display:flex;justify-content:flex-start;gap:var(--gap-sm);padding:10px 14px;
  padding-top:calc(10px + var(--safe-top));background:var(--surface);
  border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap}
.nv-b{flex:1;overflow-y:auto;padding:16px;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.nv-text{font-size:16px;line-height:1.7;color:var(--text);white-space:pre-wrap;
  word-break:break-word;overflow-wrap:anywhere}
.nv-ta{width:100%;min-height:200px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px;font:15px/1.6 var(--font);color:var(--text);
  outline:none;resize:vertical;transition:border-color .15s var(--ease)}
.nv-ta:focus{border-color:var(--brand)}
.nv-f-bottom{display:flex;justify-content:flex-end;gap:var(--gap-sm);padding:10px 14px;
  padding-bottom:calc(10px + var(--safe-bot));background:var(--surface);
  border-top:1px solid var(--line);flex-shrink:0;flex-wrap:nowrap}
.nv-act{min-height:40px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;
  color:var(--text-2);transition:background .12s var(--ease),color .12s var(--ease);
  border:1px solid var(--line);background:transparent;display:inline-flex;
  align-items:center;gap:6px;white-space:nowrap}
.nv-act:active:not([disabled]){background:var(--surface-2)}
.nv-act.danger{color:var(--danger);border-color:rgba(239,68,68,.3)}
.nv-act.danger:active:not([disabled]){background:var(--danger-glow);color:var(--danger);border-color:rgba(239,68,68,.3)}
.nv-act.primary{background:var(--brand);color:white;border-color:transparent}
.nv-act.primary:active:not([disabled]){filter:brightness(1.1);color:white}
.nv-act[disabled]{opacity:.45;cursor:not-allowed}
.onb-row{display:flex;align-items:center;gap:10px;padding:12px 0 4px;
  font-size:13px;color:var(--text-2);cursor:pointer;user-select:none}
.onb-row input[type="checkbox"]{width:18px;height:18px;accent-color:var(--brand);cursor:pointer;flex-shrink:0}
.btab{position:sticky;bottom:0;left:0;right:0;display:flex;
  padding:4px 6px;padding-bottom:calc(4px + var(--safe-bot));z-index:50;flex-shrink:0;
  height:auto;min-height:var(--btab-h);margin-top:var(--gap);
  background:var(--surface);border-top:1px solid var(--line)}
.btab-b{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 8px;color:var(--text-3);font-size:13px;font-weight:500;
  border-radius:var(--r-sm);transition:background .15s var(--ease),color .15s var(--ease);min-height:44px}
.btab-b:active{background:var(--surface-2)}
.btab-b.on{background:var(--surface-2);color:var(--text)}
.btab-ic{font-size:16px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);display:none;z-index:1000}
.mo.on{display:block}
.md{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--surface);
  border-left:1px solid var(--line);display:flex;flex-direction:column;animation:slideIn .25s var(--ease)}
@keyframes slideIn{from{transform:translateX(100%)}}
.md-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;

  const DI = (() => {
    const factories = new Map();
    const instances = new Map();

    function register(name, factory, deps) {
      factories.set(name, { factory, deps: deps || [] });
    }

    function resolve(name, visiting) {
      if (instances.has(name)) return instances.get(name);
      const def = factories.get(name);
      if (!def) throw new Error('Module not found: ' + name);
      
      if (!visiting) visiting = new Set();
      if (visiting.has(name)) throw new Error('Circular dependency detected: ' + name);
      visiting.add(name);
      
      const resolvedDeps = def.deps.map(function(d) { return resolve(d, visiting); });
      visiting.delete(name);
      
      const instance = def.factory.apply(null, resolvedDeps);
      instances.set(name, instance);
      return instance;
    }

    return { register: register, resolve: resolve };
  })();

  DI.register('Utils', function() {

      });
    }
    function escRe(s) {
      return String(s == null ? '' : s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }
    function plural(n, one, few, many) {
      n = Math.abs(n);
      const a = n % 10, b = n % 100;
      if (a === 1 && b !== 11) return one;
      if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return few;
      return many;
    }
    const words = {
      symbols: function(n, l) {
        return n + ' ' + (l === 'en' ? plural(n, 'char', 'chars', 'chars') : plural(n, 'символ', 'символа', 'символов'));
      },
      peers: function(n, l) {
        return n + ' ' + (l === 'en' ? plural(n, 'peer', 'peers', 'peers') : plural(n, 'узел', 'узла', 'узлов'));
      },
      thoughts: function(n, l) {
        return n + ' ' + (l === 'en' ? plural(n, 'note', 'notes', 'notes') : plural(n, 'мысль', 'мысли', 'мыслей'));

    };
    function word(key, n, lang) {
      const fn = words[key];

    }

      try { return d.toLocaleDateString(loc, { day: '2-digit', month: 'short' }); }

  DI.register('Bus', function() {
    const map = new Map();

      on: function(event, fn) {
        if (!map.has(event)) map.set(event, new Set());
        map.get(event).add(fn);
      },
      off: function(event, fn) {
        const set = map.get(event);
        if (set) { set.delete(fn); if (set.size === 0) map.delete(event); }
      },
      emit: function(event, payload) {
        const set = map.get(event) || [];
        for (const fn of set) { try { fn(payload); } catch (err) { console.error(err); } }
      }
    };
  }, []);

  DI.register('I18n', function(store, bus) {
    var KEY = 'lang';
    var dicts = Object.create(null);
    var current = 'ru';
    var listeners = [];

    function format(str, params) {
      var s = String(str == null ? '' : str);
      if (!params) return s;
      return s.replace(/\{(\w+)\}/g, function(match, k) {
        return (params[k] !== undefined && params[k] !== null) ? String(params[k]) : match;
      });
    }

    function setLang(lang) {
      current = String(lang || 'ru');
      try { if (store) store.set(KEY, current); } catch (_) { /* ignore */ }
      for (var i = 0; i < listeners.length; i++) {
        try { listeners[i](current); } catch (_) { /* ignore */ }
      }
      if (bus && bus.emit) { try { bus.emit('i18n:change', { lang: current }); } catch (_) { /* ignore */ } }
    }

    function getLang() { return current; }

    function addDict(lang, dict) {
      dicts[String(lang)] = Object.assign(dicts[String(lang)] || {}, dict || {});
    }

    function t(key, params, fallback) {
      var d = dicts[current] || {};
      var val = Object.prototype.hasOwnProperty.call(d, key) ? d[key] : undefined;
      if (val === undefined) {
        var en = dicts['en'] || {};
        val = Object.prototype.hasOwnProperty.call(en, key) ? en[key] : undefined;
      }
      var out = val !== undefined ? val : (fallback !== undefined ? fallback : String(key));
      return format(out, params);
    }

    function onChange(fn) { if (typeof fn === 'function') listeners.push(fn); }

    try {
      var saved = store ? store.get(KEY, null) : null;
      if (saved && (saved === 'ru' || saved === 'en')) current = saved;
      else {
        var pref = (navigator.language || 'ru').toLowerCase();
        current = pref.indexOf('ru') === 0 ? 'ru' : 'en';
      }
    } catch (_) { /* ignore */ }

    return { t: t, setLang: setLang, getLang: getLang, addDict: addDict, onChange: onChange };
  }, ['Store', 'Bus']);

  DI.register('DB', function(cfg, log, bus) {
    var db = null, mem = null;

    function dbName() { return cfg.get('dbName', 'noomium_v8'); }
    function storeName() { return cfg.get('storeName', 'notes'); }

    function emitChange() {
      if (bus && bus.emit) { try { bus.emit('db:change'); } catch(_) {} }
    }

    function open() {
      return new Promise(function(resolve, reject) {
        if (db) return resolve(db);
        if (!window.indexedDB) { mem = new Map(); return resolve(null); }
        try {
          var req = indexedDB.open(dbName(), 1);
          req.onupgradeneeded = function(e) {
            var d = e.target.result;
            var s = storeName();
            if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' });

          req.onerror = function() {
            if (log) log.warn('IDB open error', String(req.error));
            mem = new Map(); resolve(null);
          };
          req.onblocked = function() { mem = new Map(); resolve(null); };
        } catch (err) {
          if (log) log.warn('IDB unsupported', String(err));
          mem = new Map(); resolve(null);
        }
      });
    }

    function tx(mode, fn) {
      return open().then(function(d) {
        return new Promise(function(resolve, reject) {
          try {
            if (!d) {
              var mockStore = {
                get: function(k) {
                  return { result: mem.get(k) };
                },
                put: function(v) {
                  mem.set(v.id, v);
                  return {};
                },
                delete: function(k) {
                  mem.delete(k);
                  return {};
                },
                getAll: function() {
                  return { result: Array.from(mem.values()) };
                }
              };
              var req = { result: null, onsuccess: null, onerror: null };
              try {
                var r = fn(mockStore);
                if (!r || typeof r.onsuccess !== 'function') {
                  resolve(r && r.result !== undefined ? r.result : r);
                  return;
                }
                req.result = r.result !== undefined ? r.result : r;
                req.onsuccess = function() { resolve(req.result); };
                req.onerror = function(e) { reject(e); };
                setTimeout(function() { if (req.onsuccess) req.onsuccess(); }, 0);
              } catch (e) {
                req.onerror = function() { reject(e); };
                setTimeout(function() { if (req.onerror) req.onerror(); }, 0);
              }
              return;
            }
            var transaction = d.transaction(storeName(), mode);
            var store = transaction.objectStore(storeName());
            var r = fn(store);
            r.onsuccess = function() { resolve(r.result); };
            r.onerror = function() {
              if (log) log.warn('DB op error', String(r.error));
              reject(r.error);
            };
          } catch (err) {
            if (log) log.warn('DB tx error', String(err));
            reject(err);
          }
        });
      });
    }

    return {
      put: function(note) { 
        return tx('readwrite', function(s) { return s.put(note); }).then(function(res) { emitChange(); return res; }); 
      },
      get: function(id) { return tx('readonly', function(s) { return s.get(id); }); },
      del: function(id) { 
        return tx('readwrite', function(s) { return s.delete(id); }).then(function(res) { emitChange(); return res; }); 
      },
      all: function() { return tx('readonly', function(s) { return s.getAll(); }); },
      getAllPaginated: function(offset, limit) {
        return open().then(function(d) {
          return new Promise(function(resolve, reject) {
            if (!d) {
              var all = mem ? Array.from(mem.values()) : [];
              resolve(all.slice(offset, offset + limit));
              return;
            }
            var transaction = d.transaction(storeName(), 'readonly');
            var store = transaction.objectStore(storeName());
            var request = store.openCursor();
            var result = [];
            var advanced = false;
            
            request.onsuccess = function(event) {
              var cursor = event.target.result;
              if (!cursor) {
                resolve(result);
                return;
              }
              if (!advanced && offset > 0) {
                advanced = true;
                try {
                  cursor.advance(offset);
                } catch (e) {
                  resolve(result);
                }
                return;
              }
              result.push(cursor.value);
              if (result.length >= limit) {
                resolve(result);
                return;
              }
              cursor.continue();
            };
            
            request.onerror = function() {
              if (log) log.warn('DB cursor error', String(request.error));
              reject(request.error);
            };
          });
        });
      },
      bulkPut: function(notes) {
        return open().then(function(d) {
          return new Promise(function(resolve, reject) {
            try {
              if (!d) {
                for (var i = 0; i < notes.length; i++) mem.set(notes[i].id, notes[i]);
                emitChange();
                return resolve(notes.length);
              }
              var transaction = d.transaction(storeName(), 'readwrite');
              var store = transaction.objectStore(storeName());
              for (var i = 0; i < notes.length; i++) store.put(notes[i]);
              transaction.oncomplete = function() { emitChange(); resolve(notes.length); };
              transaction.onerror = function() { reject(transaction.error); };
            } catch (err) { reject(err); }
          });
        });
      },
      reset: function() {
        if (db) { try { db.close(); } catch (_) { /* ignore */ } db = null; }
        if (mem) mem.clear();
        return new Promise(function(resolve) {
          try {
            var req = indexedDB.deleteDatabase(dbName());
            req.onsuccess = req.onerror = req.onblocked = function() { emitChange(); resolve(); };
          } catch (_) { emitChange(); resolve(); }
        });
      }
    };
  }, ['Config', 'Logger', 'Bus']);

      closeBtn.textContent = '×';

          body.textContent = String(opts.body);

      container.appendChild(header);
      container.appendChild(body);

      if (opts && opts.buttons && opts.buttons.length > 0) {
        var footer = document.createElement('div');
        footer.className = 'md-f';
        opts.buttons.forEach(function(btn) {
          var el = document.createElement('button');
          if (btn.primary) {
            el.className = 'btn-send';

            el.className = 'md-btn';
            el.style.cssText = 'background:var(--surface-2);color:var(--text);border:1px solid var(--line)';
          }
          if (btn.danger) el.classList.add('danger');
          el.textContent = btn.text || 'OK';
          if (btn.disabled) el.disabled = true;
          el.onclick = function() { if (btn.onClick) btn.onClick(); };
          footer.appendChild(el);
        });
        container.appendChild(footer);
      }

      overlay.classList.add('on');

      if (escHandler) {
        document.removeEventListener('keydown', escHandler);
        escHandler = null;
      }
      escHandler = function(e) {
        if (overlay && overlay.classList.contains('on') && e.key === 'Escape') {
          closeModal();
        }
      };
      document.addEventListener('keydown', escHandler);

      if (trapHandler) {
        overlay.removeEventListener('keydown', trapHandler);
      }
      trapHandler = function(e) {
        if (e.key !== 'Tab') return;
        var focusable = container.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
        if (focusable.length === 0) return;
        var first = focusable[0];
        var last = focusable[focusable.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first) {
            e.preventDefault();
            last.focus();
          }
        } else {
          if (document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      };
      overlay.addEventListener('keydown', trapHandler);

      setTimeout(function() {
        var focusable = container.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
        if (focusable.length > 0) focusable[0].focus();
      }, Config.get('modalFocusDelay', 50));
    }

    function closeModal() {
      if (overlay) overlay.classList.remove('on');
      if (escHandler) {
        document.removeEventListener('keydown', escHandler);
        escHandler = null;
      }
      if (trapHandler && overlay) {
        overlay.removeEventListener('keydown', trapHandler);
        trapHandler = null;
      }
      try {
        if (lastFocus && lastFocus.focus) lastFocus.focus();
      } catch (_) { /* ignore */ }
    }

    return { open: openModal, close: closeModal };
  }, []);

DI.register('StateManager', function() {
  /**
   * Внутреннее состояние приложения (единый источник истины)
   * @type {Object}
   */
  var state = {
    view: 'stream',
    seg: 'local',
    sendMode: 'private',
    sendLock: false,
    lastVec: null,
    lastQuery: 0,
    netAuthorized: false,
    requestNetworkAuth: null,
    lists: { local: [], world: [], seren: [] }
  };
  
  /**
   * Список подписчиков на изменения состояния
   * @type {Function[]}
   */
  var listeners = [];
  
  /**
   * Получить текущее состояние
   * @returns {Object} Текущее состояние
   */
  function getState() {
    return state;
  }
  
  /**
   * Обновить состояние (частичное обновление)
   * @param {Object} partial - Объект с изменениями
   */
  function setState(partial) {
    if (partial && typeof partial === 'object') {
      Object.assign(state, partial);
      // Уведомляем всех подписчиков
      for (var i = 0; i < listeners.length; i++) {
        try { listeners[i](state); } catch (e) { /* ignore listener errors */ }
      }
    }
  }
  
  /**
   * Подписаться на изменения состояния
   * @param {Function} listener - Функция-обработчик
   * @returns {Function} Функция для отписки
   */
  function subscribe(listener) {
    if (typeof listener === 'function') {
      listeners.push(listener);
    }
    return function unsubscribe() {
      var idx = listeners.indexOf(listener);
      if (idx > -1) listeners.splice(idx, 1);
    };
  }
  
  /**
   * Dispatch action (заготовка для будущего)
   * @param {Object} action - Объект действия
   */
  function dispatch(action) {
    if (action && typeof action === 'object') {
      setState(action);
    }
  }
  
  return {
    getState: getState,
    setState: setState,
    subscribe: subscribe,
    dispatch: dispatch
  };
}, []);

DI.register('SearchService', function(AI, DB, Net, Config, Bus, StateManager, I18n, Toast, Logger, Utils) {
  /**
   * Внутреннее состояние сервиса
   */
  var sendLock = false;
  var lastVec = null;
  var lastQuery = 0;
  var searchAbortController = null;
  
  /**
   * Получить текущий режим отправки
   * @returns {string} 'private' или 'world'
   */
  function getSendMode() {
    return StateManager.getState().sendMode;
  }
  
  /**
   * Установить режим отправки
   * @param {string} mode - 'private' или 'world'
   */
  function setSendMode(mode) {
    StateManager.setState({ sendMode: mode });
  }
  
  /**
   * Проверить, идёт ли сейчас отправка
   * @returns {boolean}
   */
  function isSending() {
    return sendLock;
  }
  
  /**
   * Основная функция поиска похожих мыслей
   * @param {string} text - Текст запроса
   * @param {boolean} force - Принудительный поиск (игнорировать порог похожести)
   * @returns {Promise<void>}
   */
  function search(text, force) {
    if (!text || !AI.ready()) {
      StateManager.setState({ lists: { local: [], world: [], seren: [] } });
      return Promise.resolve();
    }
    
    // Отменяем предыдущий запрос
    if (searchAbortController) {
      searchAbortController.abort();
    }
    var controller = new AbortController();
    searchAbortController = controller;
    var signal = controller.signal;
    
    return AI.embed(text).then(function(vec) {
      if (signal.aborted) return;
      if (!vec) return;
      
      // Проверяем, достаточно ли изменился вектор для нового запроса в сеть
      var shouldSendToNet = false;
      if (!lastVec || AI.cosine(vec, lastVec) < Config.get('vectorSimilarityThreshold', 0.98) || force) {
        lastVec = vec;
        lastQuery = Date.now();
        shouldSendToNet = true;
      }
      
      if (shouldSendToNet && AI.getMode() === 'model') {
        var state = StateManager.getState();
        if (state.netAuthorized && Net && typeof Net.send === 'function') {
          Net.send(vec);
        }
      }
      
      // Получаем все заметки и вычисляем similarity scores
      return getAllNotesCached().then(function(notes) {
        if (signal.aborted) return;
        
        var localScored = [];
        for (var i = 0; i < notes.length; i++) {
          var note = notes[i];
          if (note && note.vector) {
            localScored.push({
              id: note.id,
              text: note.text,
              vector: note.vector,
              score: AI.cosine(vec, note.vector),
              shared: note.shared,
              peer: note.peer,
              createdAt: note.createdAt
            });
          }
        }
        
        var state = StateManager.getState();
        var worldAnswers = state.netAuthorized ? Net.activeAnswers() : [];
        var worldScored = [];
        for (var i = 0; i < worldAnswers.length; i++) {
          worldScored.push({
            id: worldAnswers[i].id,
            text: worldAnswers[i].text,
            vector: worldAnswers[i].vector,
            score: AI.cosine(vec, worldAnswers[i].vector),
            shared: worldAnswers[i].shared,
            peer: worldAnswers[i].peer,
            createdAt: worldAnswers[i].createdAt
          });
        }
        
        var threshold = Config.get('threshold', 0.30);
        var serendipityDelta = Config.get('serendipity', 0.15);
        
        var newLists = {
          local: localScored.filter(function(n) { return n.score >= threshold; })
            .sort(function(a, b) { return b.score - a.score; }),
          world: worldScored.filter(function(n) { return n.score >= threshold; })
            .sort(function(a, b) { return b.score - a.score; }),
          seren: localScored.concat(worldScored)
            .filter(function(n) { return n.score >= (threshold - serendipityDelta) && n.score < threshold; })
            .sort(function(a, b) { return b.score - a.score; })
        };
        
        StateManager.setState({ lists: newLists });
      });
    }).catch(function(err) {
      if (signal.aborted) return;
      Toast.show('err', String(err && err.message || err) || 'Search failed');
      Logger.warn('SearchService.search error', String(err && err.message || err));
    }).finally(function() {
      searchAbortController = null;
    });
  }
  
  /**
   * Отправить новую мысль
   * @param {string} text - Текст мысли
   * @param {string} mode - Режим отправки ('private' или 'world')
   * @returns {Promise<void>}
   */
  function send(text, mode) {
    if (sendLock) return Promise.resolve();
    
    var trimmedText = (text || '').trim();
    if (!trimmedText) {
      Toast.show('warn', I18n.t('toast.empty'));
      return Promise.resolve();
    }
    
    if (!AI.ready()) {
      Toast.show('err', I18n.t('toast.ai.notready'));
      return Promise.resolve();
    }
    
    var state = StateManager.getState();
    if (mode === 'world' && !state.netAuthorized) {
      // Запрашиваем авторизацию через callback из StateManager
      if (state.requestNetworkAuth) {
        state.requestNetworkAuth(function() {
          send(trimmedText, mode);
        });
      }
      return Promise.resolve();
    }
    
    var isWorld = mode === 'world';
    sendLock = true;
    StateManager.setState({ sendLock: true });
    
    return AI.embed(trimmedText)
      .then(function(vector) {
        return DB.put({
          id: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          text: trimmedText,
          vector: vector,
          shared: !!isWorld,
          createdAt: Date.now()
        });
      })
      .then(function() {
        lastVec = null;
        Toast.show('ok', isWorld ? I18n.t('toast.saved.public') : I18n.t('toast.saved.private'));
      })
      .catch(function(err) {
        Toast.show('err', String(err && err.message || err) || 'Send failed');
      })
      .finally(function() {
        sendLock = false;
        StateManager.setState({ sendLock: false });
      });
  }
  
  /**
   * Инициализация сервиса (подписки на события)
   */
  function init() {
    // Подписка на изменения БД для сброса кеша
    Bus.on('db:change', function() {
      // Кеш сбрасывается в App.State через allNotesCache = null
    });
  }
  
  return {
    search: search,
    send: send,
    getSendMode: getSendMode,
    setSendMode: setSendMode,
    isSending: isSending,
    init: init
  };
}, ['AI', 'DB', 'Net', 'Config', 'Bus', 'StateManager', 'I18n', 'Toast', 'Logger', 'Utils']);

  var StateManager = DI.resolve('StateManager');

  function highlightText(text, query) {
    var fragment = document.createDocumentFragment();
    if (!text) return fragment;
    
    if (!query) {
      fragment.appendChild(document.createTextNode(String(text)));
      return fragment;
    }
    
    if (query !== cachedQuery) {
      var words = query.toLowerCase().split(/\s+/).filter(function(w) { return w.length > 2; });
      if (words.length === 0) {
        cachedRegex = null;
      } else {
        var escapedWords = words.map(function(w) { return Utils.escRe(w); });
        cachedRegex = new RegExp('(' + escapedWords.join('|') + ')', 'gi');
      }
      cachedQuery = query;
    }
    
    if (!cachedRegex) {
      fragment.appendChild(document.createTextNode(String(text)));
      return fragment;
    }
    
    var parts = String(text).split(cachedRegex);
    for (var i = 0; i < parts.length; i++) {
      if (parts[i] === '') continue;
      if (i % 2 === 1) {
        var mark = document.createElement('mark');
        mark.textContent = parts[i];
        fragment.appendChild(mark);
      } else {
        fragment.appendChild(document.createTextNode(parts[i]));
      }
    }
    
    return fragment;
  }

  function renderCarousel() {
    var wrap = document.getElementById('carousel-wrap');
    if (!wrap) return;
    
    if (uiState.carouselObserver) {
      try { uiState.carouselObserver.disconnect(); } catch (_) { /* ignore */ }
      uiState.carouselObserver = null;
    }
    
    var state = StateManager.getState();
    var list = state.lists[state.seg];
    
    while (wrap.firstChild) {
      wrap.removeChild(wrap.firstChild);
    }
    
    if (!list || list.length === 0) {
      var emptyMessages = {
        local: { t: translate('empty.local.t'), d: translate('empty.local.d') },
        world: { t: translate('empty.world.t'), d: translate('empty.world.d') },
        seren: { t: translate('empty.seren.t'), d: translate('empty.seren.d') }
      };
      var msg = emptyMessages[state.seg];
      
      var emptyDiv = document.createElement('div');
      emptyDiv.className = 'feed-empty';
      
      var emptyIc = document.createElement('div');
      emptyIc.className = 'feed-empty-ic';
      emptyIc.textContent = '◇';
      emptyDiv.appendChild(emptyIc);
      
      var emptyT = document.createElement('div');
      emptyT.className = 'feed-empty-t';
      emptyT.textContent = msg.t;
      emptyDiv.appendChild(emptyT);
      
      var emptyD = document.createElement('div');
      emptyD.className = 'feed-empty-d';
      emptyD.textContent = msg.d;
      emptyDiv.appendChild(emptyD);
      
      wrap.appendChild(emptyDiv);
      return;
    }
    
    var carousel = document.createElement('div');
    carousel.className = 'carousel';
    carousel.id = 'carousel';
    carousel.setAttribute('tabindex', '0');
    
    for (var i = 0; i < list.length; i++) {
      var item = document.createElement('div');
      item.className = 'carousel-item';
      item.setAttribute('data-idx', String(i));
      item.appendChild(renderItemHTML(list[i]));
      carousel.appendChild(item);
    }
    
    wrap.appendChild(carousel);
    
    var dotsWrap = document.createElement('div');
    dotsWrap.className = 'carousel-dots';
    dotsWrap.id = 'carousel-dots';
    
    for (var j = 0; j < list.length; j++) {
      var dot = document.createElement('span');
      dot.className = 'carousel-dot' + (j === 0 ? ' active' : '');
      dot.setAttribute('data-i', String(j));
      dotsWrap.appendChild(dot);
    }
    
    var counter = document.createElement('span');
    counter.className = 'carousel-counter';
    counter.id = 'carousel-counter';
    counter.textContent = '1 / ' + list.length;
    dotsWrap.appendChild(counter);
    
    wrap.appendChild(dotsWrap);
    
    if ('IntersectionObserver' in window) {
      uiState.carouselObserver = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting && entry.intersectionRatio >= Config.get('carouselIntersectionThreshold', 0.55)) {
            var idx = parseInt(entry.target.getAttribute('data-idx') || '0', 10);
            var currentState = StateManager.getState();
            uiState.activeIdx[currentState.seg] = idx;
            updateCarouselDots(idx, list.length);
            var allFi = carousel.querySelectorAll('.fi');
            for (var k = 0; k < allFi.length; k++) {
              allFi[k].classList.remove('active');
            }
            var fi = entry.target.querySelector('.fi');
            if (fi) fi.classList.add('active');
          }
        });
      }, { root: carousel, threshold: [Config.get('carouselIntersectionThreshold', 0.55)] });
      
      var items = carousel.querySelectorAll('.carousel-item');
      for (var m = 0; m < items.length; m++) {
        uiState.carouselObserver.observe(items[m]);
      }
    }
    
    carousel.addEventListener('keydown', function(e) {
      var currentState = StateManager.getState();
      var currentList = currentState.lists[currentState.seg];
      
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        if (uiState.activeIdx[currentState.seg] < currentList.length - 1) {
          uiState.activeIdx[currentState.seg]++;
          var target = carousel.querySelector('[data-idx="' + uiState.activeIdx[currentState.seg] + '"]');
          if (target) target.scrollIntoView({behavior: 'smooth', inline: 'center'});
          updateCarouselDots(uiState.activeIdx[currentState.seg], currentList.length);
        }
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (uiState.activeIdx[currentState.seg] > 0) {
          uiState.activeIdx[currentState.seg]--;
          var target = carousel.querySelector('[data-idx="' + uiState.activeIdx[currentState.seg] + '"]');
          if (target) target.scrollIntoView({behavior: 'smooth', inline: 'center'});
          updateCarouselDots(uiState.activeIdx[currentState.seg], currentList.length);
        }
      }
    });
    
    carousel.scrollLeft = 0;
    uiState.activeIdx[state.seg] = 0;
  }

  function updateCarouselDots(idx, total) {
    var dots = document.querySelectorAll('#carousel-dots .carousel-dot');
    for (var i = 0; i < dots.length; i++) {
      dots[i].classList.toggle('active', i === idx);
    }
    var counter = document.getElementById('carousel-counter');
    if (counter) counter.textContent = (idx + 1) + ' / ' + total;
  }

  function handleItemAction(action, element) {
    if (!element) return;
    var id = element.getAttribute('data-id');
    var state = StateManager.getState();
    
    if (action === 'edit') {
      openNoteView(id);
      return;
    }
    
    if (action === 'copy') {
      var item = findItemById(id, state.lists[state.seg]);
      if (item) copyToClipboard(item.text);
      return;
    }
    
    if (action === 'del') {
      if (!confirm(translate('del.confirm'))) return;
      DB.del(id).then(function() {
        toast(translate('toast.deleted'), 'ok');
        var currentState = StateManager.getState();
        var currentList = currentState.lists[currentState.seg];
        var newList = currentList.filter(function(n) { return n.id !== id; });
        var newLists = Object.assign({}, currentState.lists);
        newLists[currentState.seg] = newList;
        StateManager.setState({ lists: newLists });
        if (uiState.activeIdx[currentState.seg] >= newList.length) {
          uiState.activeIdx[currentState.seg] = Math.max(0, newList.length - 1);
        }
        renderCarousel();
        if (currentState.view === 'base') renderBase();
      }).catch(function(err) {
        toast(String(err && err.message || err) || 'Delete failed', 'err');
      });
      return;
    }
    
    if (action === 'toggle') {
      DB.get(id).then(function(record) {
        if (!record) return;
        record.shared = !record.shared;
        return DB.put(record).then(function() {
          toast(record.shared ? translate('toast.saved.public') : translate('toast.saved.private'), 'ok');
          executeSearch();
          var currentState = StateManager.getState();
          if (currentState.view === 'base') renderBase();
        });
      }).catch(function(err) {
        toast(String(err && err.message || err) || 'Toggle failed', 'err');
      });
      return;
    }
  }

  function copyToClipboard(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function() { toast(translate('toast.copied'), 'ok'); },
          function() { toast(translate('toast.copy.fail'), 'err'); }
        );
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); toast(translate('toast.copied'), 'ok'); }
        catch (err) { toast(translate('toast.copy.fail'), 'err'); }
        document.body.removeChild(ta);
      }
    } catch (err) {
      toast(translate('toast.copy.fail'), 'err');
    }
  }

  function loadBaseNotesChunked() {
    if (baseIsLoading || !baseHasMore) return;
    baseIsLoading = true;
    
    var chunkSize = Config.get('baseChunkSize', 20);
    var container = document.getElementById('base-list');
    var queryInput = document.getElementById('base-q');
    var sortSelect = document.getElementById('base-sort');
    var queryValue = queryInput ? queryInput.value.trim().toLowerCase() : '';
    var sortValue = sortSelect ? sortSelect.value : 'new';
    
    DB.getAllPaginated(baseOffset, chunkSize).then(function(chunk) {
      baseIsLoading = false;
      if (!chunk || chunk.length === 0) {
        baseHasMore = false;
        if (baseOffset === 0 && container) {
          var emptyTitle = translate('empty.base.t');
          var emptyDesc = baseTotalNotes === 0 ? translate('empty.base.d') : translate('empty.base.empty');
          while (container.firstChild) {
            container.removeChild(container.firstChild);
          }
          container.appendChild(buildEmptyState('▤', emptyTitle, emptyDesc));
        }
        return;
      }
      
      if (chunk.length < chunkSize) {
        baseHasMore = false;
      }
      
      var filtered = chunk;
      if (queryValue) {
        filtered = filtered.filter(function(n) { return n.text && n.text.toLowerCase().indexOf(queryValue) >= 0; });
      }
      if (sortValue === 'old') {
        filtered.sort(function(a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
      } else if (sortValue === 'az') {
        filtered.sort(function(a, b) { return (a.text || '').localeCompare(b.text || '', I18n.getLang() === 'en' ? 'en' : 'ru'); });
      } else {
        filtered.sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
      }
      
      var fragment = document.createDocumentFragment();
      var truncateLength = Config.get('truncateTextLength', 120);
      
      for (var i = 0; i < filtered.length; i++) {
        var note = filtered[i];
        var div = document.createElement('div');
        div.className = 'bi' + (note.shared ? ' shared' : '');
        div.setAttribute('data-id', note.id);
        
        var textEl = document.createElement('div');
        textEl.className = 'bi-t' + (note.text && note.text.length > truncateLength ? ' truncated' : '');
        textEl.textContent = note.text || '';
        div.appendChild(textEl);
        
        var foot = document.createElement('div');
        foot.className = 'bi-f';
        
        var meta = document.createElement('div');
        meta.className = 'bi-meta';
        
        var tagEl = document.createElement('span');
        tagEl.className = 'bi-tag';
        tagEl.textContent = note.shared ? translate('base.tag.shared') : translate('base.tag.private');
        meta.appendChild(tagEl);
        
        var dateEl = document.createElement('span');
        dateEl.className = 'bi-date';
        dateEl.textContent = Utils.fmtDate(note.createdAt, I18n.getLang());
        meta.appendChild(dateEl);
        
        foot.appendChild(meta);
        div.appendChild(foot);
        fragment.appendChild(div);
      }
      
      if (container) container.appendChild(fragment);
      
      baseOffset += chunk.length;
      
      if (filtered.length === 0 && baseHasMore) {
        loadBaseNotesChunked();
      }
      
    }).catch(function(err) {
      baseIsLoading = false;
      toast(String(err && err.message || err) || 'Chunk load failed', 'err');
    });
  }

  function updateCounts() {
    var state = StateManager.getState();
    ['local', 'world', 'seren'].forEach(function(key) {
      var el = document.getElementById('c-' + key);
      if (el) el.textContent = state.lists[key].length;
    });
  }

  function renderBase() {
    var container = document.getElementById('base-list');
    if (container) {
      container.removeEventListener('scroll', onBaseScroll);
      container.addEventListener('scroll', onBaseScroll);
      
      // Безопасная очистка контейнера
      while (container.firstChild) {
        container.removeChild(container.firstChild);
      }
    }
    
    baseOffset = 0;
    baseHasMore = true;
    baseIsLoading = false;

    getAllNotesCached().then(function(allNotes) {
      var statsEl = document.getElementById('base-stats');
      if (statsEl) {
        // Очистка статистики
        while (statsEl.firstChild) {
          statsEl.removeChild(statsEl.firstChild);
        }
        
        var sharedCount = 0;
        for (var i = 0; i < allNotes.length; i++) {
          if (allNotes[i] && allNotes[i].shared) sharedCount++;

  function openNoteView(id) {
    DB.get(id).then(function(record) {
      if (!record) return;

      var isEditing = false;
      var nvOverlay = null;

      if (uiState.noteViewEscHandler) {
        document.removeEventListener('keydown', uiState.noteViewEscHandler);
        uiState.noteViewEscHandler = null;
      }

      function renderNoteView() {

        if (!nvOverlay) {

          nvOverlay.className = 'nv on';
          document.body.appendChild(nvOverlay);
        }
        
        // Очистка предыдущего содержимого
        while (nvOverlay.firstChild) {
          nvOverlay.removeChild(nvOverlay.firstChild);
        }

        var dateStr = Utils.fmtDate(record.createdAt, I18n.getLang());
        var tagLabel = record.shared ? translate('base.tag.shared') : translate('base.tag.private');

        if (isEditing) {
          // Режим редактирования
          var body = document.createElement('div');
          body.className = 'nv-b';
          
          var ta = document.createElement('textarea');
          ta.className = 'nv-ta';
          ta.id = 'nv-ta';

          body.appendChild(ta);
          
          var bottomFooter = document.createElement('div');
          bottomFooter.className = 'nv-f-bottom';

          saveBtn.id = 'nv-save';

              record.vector = v;
              return DB.put(record);
            }).then(function() {
              toast(translate('toast.edit.saved'), 'ok');
              isEditing = false;
              renderNoteView();
              renderBase();
              executeSearch();
            }).catch(function(err) {
              toast(String(err && err.message || err) || 'Edit failed', 'err');
            });
          };
          
          bottomFooter.appendChild(cancelBtn);
          bottomFooter.appendChild(saveBtn);
          
          nvOverlay.appendChild(body);
          nvOverlay.appendChild(bottomFooter);
          
        } else {
          // Режим просмотра
          var topFooter = document.createElement('div');
          topFooter.className = 'nv-f';
          
          var delBtn = document.createElement('button');
          delBtn.className = 'nv-act danger';

          delBtn.textContent = translate('btn.del');
          delBtn.onclick = function() {
            if (!confirm(translate('nv.delete.confirm'))) return;
            DB.del(id).then(function() {
              toast(translate('toast.deleted'), 'ok');
              closeNoteView();
              renderBase();
              executeSearch();

              toast(String(err && err.message || err) || 'Delete failed', 'err');
            });
          };
          
          var copyBtn = document.createElement('button');
          copyBtn.className = 'nv-act';
          copyBtn.id = 'nv-copy';

      function closeNoteView() {
        if (uiState.noteViewEscHandler) {
          document.removeEventListener('keydown', uiState.noteViewEscHandler);
          uiState.noteViewEscHandler = null;
        }
        if (nvOverlay) {
          nvOverlay.classList.remove('on');
          setTimeout(function() {
            if (nvOverlay && nvOverlay.parentNode) {
              try { nvOverlay.parentNode.removeChild(nvOverlay); } catch (_) { /* ignore */ }
            }
            nvOverlay = null;
          }, Config.get('noteViewAnimationDelay', 200));
        }
      }

      uiState.noteViewEscHandler = function(e) {
        if (e.key === 'Escape') {
          closeNoteView();
        }
      };
      document.addEventListener('keydown', uiState.noteViewEscHandler);

      renderNoteView();
    }).catch(function(err) {
      toast(String(err && err.message || err) || 'Load note failed', 'err');
    });
  }

  function exportData() {
    DB.all().then(function(notes) {
      if (!notes || notes.length === 0) { toast('0', 'err'); return; }
      var capsule = { app: 'noomium', format: 'v1', version: 1, exportedAt: Date.now(), notes: notes };
      var blob = new Blob([JSON.stringify(capsule, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = 'noomium-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(anchor);
      anchor.click();
      URL.revokeObjectURL(url);
      anchor.remove();
      toast('✓ ' + notes.length, 'ok');
    }).catch(function(err) {
      toast(String(err && err.message || err) || 'Export failed', 'err');
    });
  }

  function importData() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.onchange = function() {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function() {
        try {
          var data = JSON.parse(String(reader.result || '{}'));
          var notes = Array.isArray(data) ? data : (data.notes || []);
          if (!Array.isArray(notes)) throw new Error('bad format');
          var clean = [];
          for (var i = 0; i < notes.length; i++) {
            var note = notes[i];
            if (!note || typeof note.text !== 'string' || !note.text.trim()) continue;
            clean.push({
              id: note.id || ('i' + Math.random().toString(36).slice(2, 10)),
              text: note.text.trim(),
              vector: Array.isArray(note.vector) ? note.vector : null,
              shared: !!note.shared,
              createdAt: typeof note.createdAt === 'number' ? note.createdAt : Date.now()
            });
          }
          DB.bulkPut(clean).then(function() {
            toast('✓ ' + clean.length, 'ok');
            var state = StateManager.getState();
            if (state.view === 'base') renderBase();
            executeSearch();
          }).catch(function(err) {
            toast(String(err && err.message || err) || 'Import failed', 'err');
          });
        } catch (err) {
          toast(String(err && err.message || err) || 'Import parse failed', 'err');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }

        e.preventDefault();
        if (editor) editor.focus();
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && document.activeElement === editor) {
        e.preventDefault();
        handleSend();
      }

    netPeerHandler = function(count) {
      setStatus('net',
        count > 0
          ? translate('st.net.online') + ' · ' + Utils.word('peers', count, I18n.getLang())

    };

    var netStatusHandler = function(payload) {
      var status = payload && payload.status ? payload.status : 'disconnected';
      var text = translate('st.net');

      if (status === 'connected') {
        text = translate('st.net.online') + ' · ' + Utils.word('peers', Net.peerCount(), I18n.getLang());
        cls = 'ok';
      } else if (status === 'connecting') {
        text = translate('st.net.connecting'); cls = 'load';
      } else if (status === 'reconnecting') {
        text = translate('st.net.reconnecting'); cls = 'warn';
      } else if (status === 'failed') {

    busHandlers.push({event: 'net:outbox', fn: outboxHandler});

    updateOfflineBar();

  function setupWindowListeners() {
    var handlers = uiState.windowHandlers;

    if (handlers.resize) window.removeEventListener('resize', handlers.resize);
    if (handlers.focusin) window.removeEventListener('focusin', handlers.focusin);
    if (handlers.focusout) window.removeEventListener('focusout', handlers.focusout);
    if (handlers.orientationchange) window.removeEventListener('orientationchange', handlers.orientationchange);
    if (handlers.beforeunload) window.removeEventListener('beforeunload', handlers.beforeunload);

    var setVH = function() {
      var vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
    };

    handlers.resize = setVH;
    handlers.focusin = setVH;
    handlers.focusout = setVH;
    handlers.orientationchange = function() { setTimeout(setVH, 100); };
    
    handlers.beforeunload = function(e) {
      var ta = document.getElementById('ed-ta');
      if (ta && ta.value.trim().length > 0) {
        e.preventDefault();
        e.returnValue = '';
      }
    };

    window.addEventListener('resize', handlers.resize);
    window.addEventListener('focusin', handlers.focusin);
    window.addEventListener('focusout', handlers.focusout);
    window.addEventListener('orientationchange', handlers.orientationchange);
    window.addEventListener('beforeunload', handlers.beforeunload);

    setVH();
  }

    if (handlers.resize) window.removeEventListener('resize', handlers.resize);

    if (handlers.focusout) window.removeEventListener('focusout', handlers.focusout);
    if (handlers.orientationchange) window.removeEventListener('orientationchange', handlers.orientationchange);

  function bootApp() {
    I18n.addDict('ru', { 'btn.forgot': 'Забыли пароль?' });
    I18n.addDict('en', { 'btn.forgot': 'Forgot password?' });

    setStatus('net', translate('st.net.connecting'), 'load');
    setStatus('ai', translate('st.ai.loading'), 'load');
    Progress.show();

    uiState.progressHandler = function(percent) {
      setStatus('ai', translate('st.ai.loading') + ' ' + Math.round(percent) + '%', 'load');
      Progress.update(percent);
    };
    AI.onProgress(uiState.progressHandler);

    var aiLoaded = false;
    var netInitialized = false;

    function checkOnboarding() {
      if (aiLoaded && netInitialized && !Config.get('onboarded', false)) {
        openHelp(true);
      }
    }

    AI.load().then(function() {
      Progress.hide();
      setStatus('ai',
        AI.getMode() === 'model' ? translate('st.ai.ready') : translate('st.ai.demo'),
        AI.getMode() === 'model' ? 'ok' : 'warn'
      );
      aiLoaded = true;

      if (!Net.isKeyEncrypted()) {
        promptNewPassword(function(pwd) {
          tryInit(pwd, 0);
        });
      } else {
        promptExistingPassword(tryInit, 0);
      }

      checkOnboarding();
    }).catch(function(err) {
      Progress.hide();
      if (Logger) Logger.error('AI', String(err && err.message || err));
      setStatus('ai', translate('st.ai.demo'), 'warn');
      aiLoaded = true;
      checkOnboarding();
    });

    function tryInit(password, attempts) {
      return Net.init(function() { executeSearch(); }, password).then(function() {
        netInitialized = true;
        StateManager.setState({ netAuthorized: true });
        checkOnboarding();
      }).catch(function(err) {
        if (err && err.message === 'WRONG_PASSWORD') {
          toast('Неверный пароль', 'err');
          var nextAttempts = attempts + 1;
          if (nextAttempts >= Config.get('maxPasswordAttempts', 3)) {
            showResetModal();
          } else {
            promptExistingPassword(tryInit, nextAttempts);
          }
        } else {
          if (Logger) Logger.error('Net', String(err && err.message || err));
          setStatus('net', translate('st.net.failed'), 'err');
        }
      });
    }

    function showResetModal() {
      var body = document.createElement('div');
      body.innerHTML = '<p style="color:var(--text-2);margin-bottom:16px">Превышено количество попыток. Необходимо сбросить данные.</p>';
      Modal.open({
        title: 'Ошибка доступа',
        body: body,
        buttons: [
          {
            text: 'Сбросить данные', danger: true, primary: true,
            onClick: function() {
              try {
                localStorage.removeItem('noomium:sk');
                localStorage.removeItem('noomium:cfg');
                localStorage.removeItem('noomium:appVersion');
                localStorage.removeItem('noomium:lang');
              } catch (e) { /* ignore */ }
              DB.reset().then(function() {
                location.reload(true);
              });
            }
          }
        ]
      });
    }

    function promptNewPassword(callback) {
      var body = document.createElement('div');
      body.innerHTML = '<div class="fg"><label class="fl">Придумайте пароль</label><input type="password" class="fi-input" id="pwd1" /></div>' +
                       '<div class="fg"><label class="fl">Подтвердите пароль</label><input type="password" class="fi-input" id="pwd2" /></div>';
      var errorEl = document.createElement('div');
      errorEl.style.color = 'var(--danger)';
      errorEl.style.fontSize = '12px';
      errorEl.style.marginTop = '8px';
      body.appendChild(errorEl);

      Modal.open({
        title: 'Защита данных',
        body: body,
        buttons: [
          {
            text: 'Сохранить', primary: true,
            onClick: function() {
              var p1 = document.getElementById('pwd1').value;
              var p2 = document.getElementById('pwd2').value;
              if (!p1) { errorEl.textContent = 'Пароль не может быть пустым'; return; }
              if (p1 !== p2) { errorEl.textContent = 'Пароли не совпадают'; return; }
              Modal.close();
              callback(p1);
            }
          }
        ]
      });
    }

    function promptExistingPassword(callback, attempts) {
      var body = document.createElement('div');
      body.innerHTML = '<div class="fg"><label class="fl">Введите пароль</label><input type="password" class="fi-input" id="pwd1" /></div>';

      var forgotBtn = document.createElement('button');
      forgotBtn.type = 'button';
      forgotBtn.className = 'nv-act danger';
      forgotBtn.textContent = translate('btn.reset_storage');
      forgotBtn.style.cssText = 'margin-top:10px;width:100%;justify-content:center;display:inline-flex';
      forgotBtn.onclick = function() {
        if (!confirm(translate('reset_storage.confirm'))) return;
        Modal.close();
        try {
          localStorage.removeItem('noomium:sk');
          localStorage.removeItem('noomium:cfg');
          localStorage.removeItem('noomium:appVersion');
          localStorage.removeItem('noomium:lang');
        } catch (e) { /* ignore */ }
        DB.reset().then(function() {
          location.reload(true);
        }).catch(function(err) {
          toast(String(err && err.message || err) || 'Reset failed', 'err');
        });
      };
      body.appendChild(forgotBtn);

      var errorEl = document.createElement('div');
      errorEl.style.color = 'var(--danger)';
      errorEl.style.fontSize = '12px';
      errorEl.style.marginTop = '8px';
      body.appendChild(errorEl);

      var buttons = [];
      if (attempts >= Config.get('maxPasswordAttempts', 3)) {
        buttons.push({
          text: 'Сбросить данные', danger: true,
          onClick: function() {
            try {
              localStorage.removeItem('noomium:sk');
              localStorage.removeItem('noomium:cfg');
              localStorage.removeItem('noomium:appVersion');
              localStorage.removeItem('noomium:lang');
            } catch (e) { /* ignore */ }
            DB.reset().then(function() {
              location.reload(true);
            });
          }
        });
      }
      buttons.push({
        text: 'Войти', primary: true,
        onClick: function() {
          var p1 = document.getElementById('pwd1').value;
          if (!p1) { errorEl.textContent = 'Введите пароль'; return; }
          Modal.close();
          callback(p1, attempts);
        }
      });

      Modal.open({
        title: 'Доступ к данным',
        body: body,
        buttons: buttons
      });
    }

    function requestNetworkAuth(onSuccess) {
      if (StateManager.getState().netAuthorized) {
        if (typeof onSuccess === 'function') onSuccess();
        return;
      }
      
      var initCallback = function(password) {
        tryInit(password, 0).then(function() {
          if (typeof onSuccess === 'function') onSuccess();
        }).catch(function() {
          // Ошибки обработаны в tryInit
        });
      };

      if (Net.isKeyEncrypted()) {
        promptExistingPassword(initCallback, 0);
      } else {
        promptNewPassword(initCallback);
      }
    }

    StateManager.setState({ requestNetworkAuth: requestNetworkAuth });
  }

  function mountApp() {
    try {
      cleanup();
      
      var root = document.getElementById('app-root');
      if (!root) {
        root = document.createElement('div');
        root.id = 'app-root';
        document.body.appendChild(root);
      }
      document.body.classList.add('show-app');
      root.innerHTML = buildMarkup();
      setupWindowListeners();
      bindEvents();
      bootApp();
      if (Logger) Logger.info('App mounted');
    } catch (err) {
      console.error('App mount failed:', err);
      var root = document.getElementById('app-root');
      if (root) {
        root.textContent = '';
        var wrapper = document.createElement('div');
        wrapper.style.cssText = 'padding:40px;text-align:center;color:#ef4444';

        var heading = document.createElement('h2');
        heading.textContent = 'NOOmium failed to start';

        var message = document.createElement('p');
        message.style.cssText = 'color:#a0a0ae;margin-top:10px';
        message.textContent = String(err && err.message || err);

        var reloadBtn = document.createElement('button');
        reloadBtn.style.cssText = 'margin-top:20px;padding:10px 20px;background:#8b7cff;color:white;border:none;border-radius:8px;cursor:pointer';
        reloadBtn.textContent = 'Reload';
        reloadBtn.onclick = function() { location.reload(); };

        wrapper.appendChild(heading);
        wrapper.appendChild(message);
        wrapper.appendChild(reloadBtn);
        root.appendChild(wrapper);
        document.body.classList.add('show-app');
      }
    }
  }
