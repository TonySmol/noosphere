<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>NOOmium</title>
<!-- CDN: nostr-tools — статический import в NET/Nostr; transformers — ленивый в AI/Embedder. Обе ESM. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;700&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#10131a; --bg-2:#161b24; --surface:#1a2029; --surface-2:#212936; --surface-3:#2a3342;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --text:#e7e3da; --text-2:#a3a89f; --text-3:#6b7069;
  --amber:#e8a33d; --amber-glow:rgba(232,163,61,.14);
  --teal:#56c2b8;  --teal-glow:rgba(86,194,184,.13);
  --rose:#e5646e;  --rose-glow:rgba(229,100,110,.14);
  --green:#6bbf7a;
  --font:'Manrope',system-ui,sans-serif; --display:'Spectral',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:12px; --r-sm:8px; --ease:cubic-bezier(.2,.7,.2,1);
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{
  --bg:#f4f1ea; --bg-2:#fff; --surface:#fff; --surface-2:#f0ede5; --surface-3:#e6e2d8;
  --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.15);
  --text:#22262e; --text-2:#5a5f57; --text-3:#8a8f86;
  --amber:#c47f17; --teal:#2c8f86; --rose:#c23b46; --green:#3f9455;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(720px 460px at 92% -6%,var(--amber-glow),transparent 60%),radial-gradient(720px 480px at -6% 108%,var(--teal-glow),transparent 60%)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}::-webkit-scrollbar-track{background:transparent}

#app{display:none;flex-direction:column;height:100vh;height:100dvh}
body.ready #app{display:flex}

/* HEADER */
#hdr{display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + var(--safe-top));min-height:52px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
.logo{font:700 19px var(--display)}.logo b{color:var(--amber)}
#hdr-status{display:flex;align-items:center;gap:12px;flex:1;justify-content:flex-end;font:400 11px var(--mono);color:var(--text-3);overflow:hidden}
.st{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.st .dot{width:6px;height:6px;border-radius:50%;background:var(--text-3)}
.st .dot.ok{background:var(--green)}.st .dot.warn{background:var(--amber)}.st .dot.err{background:var(--rose)}.st .dot.load{background:var(--teal);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.icon-btn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text-2);font-size:16px;transition:background .15s var(--ease)}
.icon-btn:active{background:var(--surface-2)}
#btn-menu{flex-direction:column;gap:4px}#btn-menu i{width:16px;height:2px;background:var(--text-2);border-radius:1px;display:block}

#offline-bar{display:none;background:var(--rose-glow);color:var(--rose);font:500 11px var(--mono);padding:5px 16px;text-align:center;border-bottom:1px solid var(--line-2)}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}

/* CONTEXT BANNER — скрыт в просмотре */
#ctx-banner{display:none;align-items:center;gap:10px;margin:10px 14px 0;padding:9px 12px;background:var(--amber-glow);border:1px solid var(--line-2);border-radius:var(--r-sm);font-size:12px}
#ctx-banner.on{display:flex}
#ctx-banner .ctx-src{font:600 10px var(--mono);color:var(--amber);text-transform:uppercase;letter-spacing:.04em}
#ctx-banner .ctx-txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
#ctx-banner .ctx-x{color:var(--text-3);font-size:16px;padding:0 4px}

/* SEGMENTS — скрыты в просмотре */
#seg{display:none;gap:2px;margin:10px 14px;padding:5px 3px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);flex-shrink:0}
#seg.on{display:flex}
.seg-b{flex:1;padding:8px 6px;border-radius:6px;font-size:13px;font-weight:600;color:var(--text-3);display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s var(--ease)}
.seg-b.on{background:var(--surface-2);color:var(--text)}
.seg-b .cnt{font:600 10px var(--mono);padding:1px 6px;border-radius:9px;background:var(--surface-3);min-width:16px;text-align:center}
.seg-b.on .cnt{background:var(--amber-glow);color:var(--amber)}

/* FEED — всегда видим */
#feed-wrap{flex:1;position:relative;overflow:hidden;min-height:0}
#feed{position:absolute;inset:0;overflow-y:auto;padding:10px 14px 12px;-webkit-overflow-scrolling:touch}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .15s var(--ease),transform .15s var(--ease);animation:noteIn .25s var(--ease) both}
.note:hover{border-color:var(--line-2)}.note.pinned{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber-glow)}
@keyframes noteIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.note-txt{font-size:15px;white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
.note-txt mark{background:var(--amber-glow);color:var(--amber);border-radius:3px;padding:0 2px}
.note-meta{display:flex;align-items:center;gap:10px;font:400 11px var(--mono);color:var(--text-3);flex-wrap:wrap}
.note-tag{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.note-tag.priv{background:var(--surface-3);color:var(--text-2)}.note-tag.world{background:var(--teal-glow);color:var(--teal)}
.note-sim{color:var(--amber);font-weight:600}.note-parent{color:var(--teal)}
#feed-empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;color:var(--text-3)}
#feed-empty.on{display:flex}#feed-empty .ic{font:700 30px var(--display);opacity:.5;margin-bottom:12px}

/* COMPOSER — всегда видим */
#composer{margin:0 14px 12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);flex-shrink:0;transition:border-color .15s var(--ease)}
#composer:focus-within{border-color:var(--amber)}
#ed-ta{width:100%;min-height:44px;max-height:120px;background:none;border:none;outline:none;resize:none;font:15px/1.5 var(--font);color:var(--text)}
#ed-ta::placeholder{color:var(--text-3)}
#ed-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
#ed-cnt{font:400 11px var(--mono);color:var(--text-3)}
#ed-acts{display:flex;align-items:center;gap:8px}
#mode-toggle{display:inline-flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;position:relative;height:38px}
.mt-opt{position:relative;z-index:2;padding:0 14px;height:100%;display:flex;align-items:center;font-size:12px;font-weight:700;color:var(--text-3);transition:color .2s var(--ease)}
.mt-opt.on{color:var(--text)}
#mode-toggle[data-mode="world"] .mt-opt[data-v="world"]{color:var(--teal)}
#mode-toggle[data-mode="private"] .mt-opt[data-v="private"]{color:var(--amber)}
.mt-thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--surface-3);border-radius:999px;transition:left .25s var(--ease),background .2s var(--ease);z-index:1}
#mode-toggle[data-mode="world"] .mt-thumb{left:50%;background:var(--teal-glow)}
#mode-toggle[data-mode="private"] .mt-thumb{background:var(--amber-glow)}
#btn-send{height:38px;min-width:44px;padding:0 16px;border-radius:999px;background:var(--amber);color:#1a1206;font-weight:700;display:flex;align-items:center;justify-content:center;transition:transform .1s var(--ease),filter .15s var(--ease)}
#btn-send:active:not(:disabled){transform:scale(.95)}#btn-send.sending{opacity:.7;pointer-events:none}

/* BASE — скрыта по умолчанию, открывается из меню */
#base{display:none;flex-direction:column;flex:1;overflow:hidden;min-height:0}
#base.on{display:flex}
#base-h{padding:10px 14px 0;flex-shrink:0}
#base-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.bstat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px;text-align:center}
.bstat b{display:block;font:700 20px var(--mono)}.bstat span{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
#base-ctrls{display:flex;gap:6px}
#base-q{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;outline:none}
#base-q:focus{border-color:var(--amber)}
#base-sort{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;outline:none;appearance:none;cursor:pointer;color:var(--text-2)}
#base-list{flex:1;overflow-y:auto;padding:8px 14px;-webkit-overflow-scrolling:touch}
.bi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px;cursor:pointer}
.bi-t{font-size:14px;white-space:pre-wrap;word-break:break-word;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bi-f{display:flex;justify-content:space-between;align-items:center;font:400 11px var(--mono);color:var(--text-3)}

/* OVERLAYS */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:1000}
#overlay.on{display:flex}
#modal{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);width:min(460px,100%);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.5);animation:mIn .2s var(--ease)}
@keyframes mIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
#modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line)}
#modal-t{font:700 17px var(--display)}#modal-x{width:32px;height:32px;border-radius:8px;font-size:18px;color:var(--text-3)}
#modal-b{flex:1;overflow-y:auto;padding:16px}
#modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 16px;border-top:1px solid var(--line)}
.mbtn{padding:9px 18px;border-radius:8px;font-weight:700;font-size:13px;border:1px solid var(--line);transition:all .12s var(--ease)}
.mbtn.primary{background:var(--amber);color:#1a1206;border-color:transparent}.mbtn.danger{color:var(--rose);border-color:var(--rose-glow)}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column-reverse;gap:6px;z-index:1100;pointer-events:none;max-width:calc(100vw - 24px)}
.toast{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 14px;box-shadow:0 6px 20px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center;font-size:13px;white-space:nowrap;animation:tIn .2s var(--ease)}
@keyframes tIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#progress{position:fixed;inset:0;background:rgba(16,19,26,.85);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1200;padding:20px}
#progress.on{display:flex}
.prog-c{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:26px;max-width:340px;width:100%;text-align:center}
.prog-bar{height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin:14px 0 8px}.prog-fill{height:100%;width:0;background:var(--amber);transition:width .3s var(--ease)}
#noteview{position:fixed;inset:0;background:var(--bg);z-index:900;display:none;flex-direction:column}#noteview.on{display:flex}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:480px){.logo{font-size:17px}#hdr-status .st .lbl{display:none}}
</style>
</head>
<body data-theme="dark">

    <div id="hdr-status">
      <span class="st"><span class="dot load" id="st-net-dot"></span><span class="lbl" id="st-net-txt">сеть</span></span>

    <button class="icon-btn" id="btn-base" aria-label="Моя база">▤</button>

  <div id="offline-bar"><span id="offline-text"></span></div>

      <button class="seg-b on" data-k="local"><span>Моё</span><span class="cnt" id="c-local">0</span></button>

    <!-- Лента (всегда) -->

        <span id="ed-cnt">0 симв.</span>
        <div id="ed-acts">
          <div id="mode-toggle" data-mode="private">
            <div class="mt-thumb"></div>

    <!-- База (скрыта, открывается из меню/кнопки) -->
    <div id="base">
      <div id="base-h">
        <div id="base-stats">
          <div class="bstat"><b id="bs-total">0</b><span>всего</span></div>
          <div class="bstat"><b id="bs-open">0</b><span>открыто</span></div>
          <div class="bstat"><b id="bs-priv">0</b><span>лично</span></div>
        </div>
        <div id="base-ctrls">
          <input id="base-q" placeholder="поиск...">
          <select id="base-sort"><option value="new">новые</option><option value="old">старые</option><option value="az">а-я</option></select>
        </div>

      <div id="base-list"></div>

  </div>
</div>

<div id="overlay"><div id="modal">
  <div id="modal-h"><div id="modal-t"></div><button id="modal-x">✕</button></div>
  <div id="modal-b"></div><div id="modal-f"></div>
</div></div>
<div id="toasts"></div>
<div id="progress"><div class="prog-c">
  <div style="font:700 18px var(--display)">Загружаем модель</div>
  <div style="font-size:13px;color:var(--text-3);margin-top:6px">Один раз, чтобы искать по смыслу</div>
  <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
  <div id="prog-pct" style="font:400 12px var(--mono);color:var(--text-3)">0%</div>
</div></div>
<div id="noteview"></div>

<script type="module">
'use strict';

// ═══════════════════════════════════════════════════════════════
// CORE/DI — ПРЕАМБУЛА (готова, не модуль). Всегда выполнена первой.
// Все модули ниже регистрируются через DI.register; порядок их
// вставки не важен — DI.resolve ленивый и сам тянет зависимости.
// ═══════════════════════════════════════════════════════════════
const DI = (() => {
  const factories = new Map();
  const instances = new Map();
  /**
   * Регистрирует фабрику модуля.
   * @param {string} name - Имя модуля.
   * @param {Function} factory - Фабрика, получает разрешённые зависимости аргументами.
   * @param {string[]} [deps] - Имена зависимостей.
   */
  function register(name, factory, deps) { factories.set(name, { factory, deps: deps || [] }); }
  /**
   * Разрешает модуль (лениво, с кэшем и детекцией циклов).
   * @param {string} name
   * @param {Set<string>} [visiting]
   * @returns {*} Инстанс модуля.
   */
  function resolve(name, visiting) {
    if (instances.has(name)) return instances.get(name);
    const def = factories.get(name);
    if (!def) throw new Error('Module not found: ' + name);
    visiting = visiting || new Set();
    if (visiting.has(name)) throw new Error('Circular dependency: ' + name);
    visiting.add(name);
    const args = def.deps.map(d => resolve(d, visiting));
    visiting.delete(name);
    const inst = def.factory(...args);
    instances.set(name, inst);
    return inst;
  }
  return { register, resolve };
})();

// ═══════════════════ CORE ═══════════════════

// ─── МОДУЛЬ 1: CORE/Config ─── START ─────────────────────────
/**
 * Конфигурация приложения: дефолты + персист в localStorage.
 *
 * Принципы:
 *  - Дефолты заморожены — единственный источник «правды по умолчанию».
 *  - Из localStorage мержатся ТОЛЬКО известные ключи: чужая/устаревшая схема
 *    не занесёт мусор и не сломает приложение после обновления.
 *  - set() сохраняет автоматически: настройки меняются редко, терять их нельзя.
 *  - Поля «задел» зарезервированы под будущие фичи и уже версионируются.
 *
 * @exports Config
 */
DI.register('Config', function () {
  /** Ключ в localStorage. @type {string} */
  const KEY = 'noomium:cfg';

  /** Значения по умолчанию (заморожены). @readonly */
  const defaults = Object.freeze({
    version: 2,                          // версия схемы конфига

    // ── Общее ──
    room: 'noomium-main',                // Nostr-комната (тег #t)
    theme: 'dark',                       // 'dark' | 'light'
    lang: null,                          // null = автодетект; 'ru' | 'en'
    onboarded: false,                    // пройден ли онбординг
    logLevel: 'info',                    // 'debug' | 'info' | 'warn' | 'error'

    // ── AI ──
    model: 'Xenova/paraphrase-multilingual-MiniLM-L12-v2',
    dim: 384,                            // размерность вектора
    aiCacheLimit: 300,                   // LRU-кэш векторов
    aiEmbedTimeout: 15000,               // таймаут эмбеддинга, мс

    // ── Ранжирование ──
    threshold: 0.7,                      // порог «похожести»
    serendipity: 0.3,                    // ширина «озарений» ниже порога
    vectorSimilarityThreshold: 0.98,     // дедупликация запросов

    // ── Сеть ──
    relays: ['wss://relay.damus.io', 'wss://nos.lol', 'wss://offchain.pub'],
    kNote: 1,                            // kind заметки (regular → хранится релеями)
    kQuery: 21000,                       // kind запроса (ephemeral)
    kAnswer: 21001,                      // kind ответа (ephemeral)
    queryRateLimit: 3000,                // мин. интервал между запросами, мс
    maxResponses: 8,                     // лимит ответов на один запрос
    responseWindow: 6000,                // окно сбора ответов, мс
    centroidCount: 12,                   // центроидов для сетевого префильтра
    peerTTL: 60000,                      // время жизни пира, мс
    heartbeat: 30000,                    // интервал очистки пиров, мс
    subWindow: 300,                      // окно подписки, сек
    relayErrorThreshold: 5,              // ошибок до circuit-break
    relayCircuitBreakTime: 120000,       // блокировка релея, мс
    relayBackoff1: 15000,
    relayBackoff2: 30000,
    reconnectMaxAttempts: 10,

    cloudView: false,                    // облако смыслов
  });

  /** Текущее состояние (дефолты + сохранённое). @type {Object} */
  const state = Object.assign({}, defaults);

  // Загрузка: мержим только известные ключи.
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      if (saved && typeof saved === 'object') {
        for (const k of Object.keys(defaults)) if (k in saved) state[k] = saved[k];
      }
    }
  } catch (_) { /* битый JSON / приватный режим — живём с дефолтами */ }

  /** Сохраняет состояние в localStorage. */
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) { /* quota */ }
  }

  return {
    /**
     * Читает значение.
     * @param {string} k - Ключ.
     * @param {*} [def] - Запасное, если ключа нет.
     * @returns {*}
     */
    get(k, def) { return (k in state) ? state[k] : def; },

    /**
     * Устанавливает значение и сразу сохраняет.
     * @param {string} k - Ключ.
     * @param {*} v - Значение.
     */
    set(k, v) { state[k] = v; persist(); },

    /** Принудительное сохранение (обычно не нужно). */
    save: persist,

    /** Копия дефолтов — для «сбросить к стандартным». @returns {Object} */
    defaults() { return Object.assign({}, defaults); },

    /** Копия текущего состояния. @returns {Object} */
    all() { return Object.assign({}, state); },

    /** Сбрасывает всё к дефолтам и сохраняет. */
    reset() {
      for (const k of Object.keys(defaults)) state[k] = defaults[k];
      persist();
    },
  };
});

// ─── МОДУЛЬ 2: CORE/EventBus ─── START ───────────────────────
/**
 * Шина событий (pub/sub) — единственный канал «кто кому не друг».
 *
 * Подписчики вызываются в порядке подписки; ошибка одного не валит остальных.
 * Wildcard '*' получает (event, payload) для всех событий — удобно для отладки.
 * on() возвращает функцию отписки: держи её и вызывай в cleanup.
 *
 * @example
 *   const off = bus.on('note:created', note => render(note));
 *   bus.once('model:ready', () => start());
 *   bus.emit('note:created', { id: 'n1' });
 *   off();
 *
 * @exports EventBus
 */
DI.register('EventBus', function () {
  /** event -> Set<fn>. @type {Map<string, Set<Function>>} */
  const map = new Map();
  /** wildcard-слушатели. @type {Set<Function>} */
  const wild = new Set();

  /**
   * Подписывает обработчик.
   * @param {string} event - Имя события или '*'.
   * @param {Function} fn - (payload) для обычных; (event, payload) для '*'.
   * @returns {Function} Функция отписки.
   */
  function on(event, fn) {
    if (typeof fn !== 'function') return () => {};
    if (event === '*') { wild.add(fn); return () => wild.delete(fn); }
    if (!map.has(event)) map.set(event, new Set());
    map.get(event).add(fn);
    return () => {
      const s = map.get(event);
      if (s) { s.delete(fn); if (!s.size) map.delete(event); }
    };
  }

  /**
   * Подписка на одно срабатывание.
   * @param {string} event
   * @param {Function} fn
   * @returns {Function} Функция отписки (можно вызвать раньше).
   */
  function once(event, fn) {
    const off = on(event, (...a) => { off(); fn(...a); });
    return off;
  }

  /**
   * Отписка по ссылке (альтернатива вызову функции отписки).
   * @param {string} event
   * @param {Function} fn
   */
  function off(event, fn) {
    if (event === '*') { wild.delete(fn); return; }
    const s = map.get(event);
    if (s) { s.delete(fn); if (!s.size) map.delete(event); }
  }

  /**
   * Публикует событие. Список слушателей копируется до обхода,
   * чтобы отписка/подписка внутри обработчика не ломала итерацию.
   * @param {string} event - Имя события.
   * @param {*} [payload] - Данные.
   */
  function emit(event, payload) {
    const s = map.get(event);
    if (s) for (const fn of Array.from(s)) {
      try { fn(payload); } catch (e) { console.error('[bus:' + event + ']', e); }
    }
    if (wild.size) for (const fn of Array.from(wild)) {
      try { fn(event, payload); } catch (e) { console.error('[bus:*]', e); }
    }
  }

  return { on, once, off, emit };
});

// ─── МОДУЛЬ 3: CORE/Logger ─── START ─────────────────────────
/**
 * Логгер с уровнями, цветным выводом и кольцевой историей.
 *
 * - Порог отбрасывает всё ниже уровня (debug < info < warn < error).
 * - Уровни подсвечены в консоли — логи читаются глазами, а не grep'ом.
 * - Кольцевой буфер хранит последние 200 записей ВСЕХ уровней (даже скрытых
 *   порогом): историю можно отмотать при разборе инцидента (history/dump).
 *
 * Фундамент: ни от кого не зависит. Порог из Config выставляет Boot.
 *
 * @exports Logger
 */
DI.register('Logger', function () {
  /** Числовые веса уровней. @readonly */
  const LEVELS = { debug: 10, info: 20, warn: 30, error: 40 };

  /** Цвета уровней для консоли. @readonly */
  const COLORS = {
    debug: 'color:#56c2b8',
    info:  'color:#e8a33d',
    warn:  'color:#e5c156',
    error: 'color:#e5646e;font-weight:bold',
  };

  /** Текущий порог. @type {number} */
  let threshold = LEVELS.info;

  /** Кольцевой буфер. @type {Array<{ts:string,level:string,msg:string,data:*}>} */
  const ring = [];
  const RING_MAX = 200;

  /** Время HH:MM:SS.mmm. @returns {string} */
  const ts = () => new Date().toISOString().substr(11, 12);

  /**
   * Вывод в консоль + запись в буфер (буфер пишется ДО порога —
   * чтобы скрытые debug-записи всё равно попали в историю).
   * @param {string} level
   * @param {string} msg
   * @param {*} [data]
   */
  function write(level, msg, data) {
    const time = ts();
    ring.push({ ts: time, level, msg, data });
    if (ring.length > RING_MAX) ring.shift();

    if (LEVELS[level] < threshold) return;
    const fn = console[level] || console.log;
    const prefix = '%c[' + time + '][' + level.toUpperCase() + ']';
    if (data === undefined) fn(prefix, COLORS[level], msg);
    else fn(prefix, COLORS[level], msg, data);
  }

  return {
    /**
     * Устанавливает порог.
     * @param {'debug'|'info'|'warn'|'error'} l
     */
    setLevel(l) { if (LEVELS[l]) threshold = LEVELS[l]; },

    /** @param {string} m @param {*} [d] */ debug(m, d) { write('debug', m, d); },
    /** @param {string} m @param {*} [d] */ info(m, d)  { write('info', m, d); },
    /** @param {string} m @param {*} [d] */ warn(m, d)  { write('warn', m, d); },
    /** @param {string} m @param {*} [d] */ error(m, d) { write('error', m, d); },

    /** Копия истории (до 200 записей). @returns {Array} */
    history() { return ring.slice(); },

    /** Выводит всю историю в консоль — для разбора инцидентов. */
    dump() {
      for (const r of ring) {
        const fn = console[r.level] || console.log;
        fn('[' + r.ts + '][' + r.level.toUpperCase() + ']', r.msg, r.data === undefined ? '' : r.data);
      }
    },
  };
});

    bus: got, wildcard: wildGot, room: Config.get('room'), history: Logger.history().length,
  });
} catch (e) {
  console.error('[SELF-TEST] FAIL', e);
}
// ─── SELF-TEST Пачки 1 ─── END ───────────────────────────────

// ═══ ВРЕМЕННЫЙ ЗАПУСК (заменит BOOT): показать ракушку + превью 2-режимов ═══
document.body.classList.add('ready');
(function preview2Modes() {
  const ta = document.getElementById('ed-ta');
  const seg = document.getElementById('seg');
  const ctx = document.getElementById('ctx-banner');
  const src = document.getElementById('ctx-src');
  const txt = document.getElementById('ctx-txt');
  const ctxX = document.getElementById('ctx-x');
  let pinned = null; // симуляция пина

  function render() {
    const typing = ta.value.trim().length > 0;
    seg.classList.toggle('on', typing || !!pinned); // бар — ввод ИЛИ пин
    ctx.classList.toggle('on', !!pinned);           // баннер — ТОЛЬКО пин
    if (pinned) { src.textContent = 'пин'; txt.textContent = pinned; }
  }

  ta.addEventListener('input', render);
  ctxX.addEventListener('click', () => { pinned = null; render(); });

  // демо-пин: двойной клик по логотипу (в жизни — клик по заметке в ленте)
  document.querySelector('.logo').addEventListener('dblclick', () => {
    pinned = 'Пример закреплённой мысли — в жизни её закрепит клик по заметке';
    render();
  });
})();
console.info('[NOOmium] каркас v2 · DI готов · модулей к наполнению: 31 · набери текст — увидишь режим автора');
</script>
