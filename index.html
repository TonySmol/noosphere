<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOOmium — лента смыслов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f141b; --card:#171e28; --line:#242e3c;
    --text:#e8ecf1; --dim:#8b97a8;
    --coral:#ff8a5c; --teal:#5eead4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh; background:var(--bg); color:var(--text);
    font:15px/1.55 'Manrope',sans-serif;
    background-image:
      radial-gradient(700px 400px at 8% -5%, rgba(94,234,212,.07), transparent 60%),
      radial-gradient(700px 420px at 95% 105%, rgba(255,138,92,.07), transparent 60%);
  }
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px 80px}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
  h1{font:700 26px 'Unbounded',sans-serif;letter-spacing:-.02em}
  h1 em{font-style:normal;color:var(--coral)}
  #me{font:400 11px 'JetBrains Mono',monospace;color:var(--dim)}
  #status{font:400 12px 'JetBrains Mono',monospace;color:var(--teal);margin-bottom:24px;min-height:18px}

  .composer{display:flex;gap:10px;margin-bottom:28px}
  textarea{
    flex:1;resize:none;min-height:52px;padding:14px 16px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    color:var(--text);font:inherit;outline:none;transition:border-color .15s;
  }
  textarea:focus{border-color:var(--coral)}
  button{
    padding:0 22px;border:none;border-radius:12px;cursor:pointer;
    background:var(--coral);color:#1a0f08;font:600 14px 'Manrope',sans-serif;
    transition:transform .1s,filter .15s;
  }
  button:hover:not(:disabled){filter:brightness(1.1)}
  button:active:not(:disabled){transform:scale(.96)}
  button:disabled{opacity:.5;cursor:not-allowed}

  .hint{font-size:12px;color:var(--dim);margin-bottom:14px}
  .hint b{color:var(--teal);font-weight:600}

  .note{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:10px;cursor:pointer;
    transition:border-color .15s,transform .15s;
    animation:in .25s ease both;
  }
  .note:hover{border-color:var(--teal);transform:translateY(-1px)}
  .note.pinned{border-color:var(--coral)}
  .note-text{white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
  .note-meta{display:flex;gap:12px;font:400 11px 'JetBrains Mono',monospace;color:var(--dim)}
  .sim{color:var(--coral);font-weight:600}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>NOO<em>mium</em></h1><span id="me"></span></header>
  <div id="status"></div>

  <div class="composer">
    <textarea id="input" placeholder="О чём думаешь?"></textarea>
    <button id="send">→</button>
  </div>
  <div class="hint">клик по заметке — <b>закрепить</b> и перестроить ленту по смыслу</div>

  <div id="feed"></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
