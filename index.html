<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NOO·mium</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Spectral:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">

<div id="app">
  <header id="hdr">
    <div class="logo">NOO<b>·</b>mium</div>
    <div id="hdr-status">
      <span class="st"><span class="dot load" id="st-net-dot"></span><span class="lbl" id="st-net-txt">сеть</span></span>
      <span class="st"><span class="dot load" id="st-ai-dot"></span><span class="lbl" id="st-ai-txt">модель</span></span>
    </div>
    <button class="icon-btn" id="btn-base" aria-label="Моя база">▤</button>
    <button class="icon-btn" id="btn-menu" aria-label="Меню"><i></i><i></i><i></i></button>
  </header>

  <div id="offline-bar"><span id="offline-text"></span></div>

  <div id="main">
    <div id="ctx-banner">
      <span class="ctx-src" id="ctx-src"></span>
      <span class="ctx-txt" id="ctx-txt"></span>
      <button class="ctx-x" id="ctx-x" aria-label="Снять контекст">✕</button>
    </div>
    <div id="seg">
      <button class="seg-b on" data-k="local"><span>Моё</span><span class="cnt" id="c-local">0</span></button>
      <button class="seg-b" data-k="world"><span>Мир</span><span class="cnt" id="c-world">0</span></button>
      <button class="seg-b" data-k="seren"><span>Озарения</span><span class="cnt" id="c-seren">0</span></button>
    </div>

    <div id="feed-wrap">
      <div id="feed"></div>
      <div id="feed-empty"><div class="ic">◇</div><div id="feed-empty-t"></div></div>
    </div>

    <button id="btn-history" class="hist-btn">Загрузить ещё</button>

    <div id="composer">
      <textarea id="ed-ta" placeholder="О чём думаешь?"></textarea>
      <div id="ed-foot">
        <span id="ed-cnt">0 симв.</span>
        <div id="ed-acts">
          <div id="mode-toggle" data-mode="private">
            <div class="mt-thumb"></div>
            <div class="mt-opt on" data-v="private">Личное</div>
            <div class="mt-opt" data-v="world">Мир</div>
          </div>
          <button id="btn-send" aria-label="Отправить">→</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="overlay"></div>
<div id="base-view">
  <div class="bv-h"><span class="bv-t">Моя база</span><button class="bv-x" aria-label="Закрыть">✕</button></div>
  <div class="bv-stats">
    <div class="bs-it"><span class="bs-n" id="bs-total">0</span><span class="bs-l">всего</span></div>
    <div class="bs-it"><span class="bs-n" id="bs-week">0</span><span class="bs-l">за неделю</span></div>
    <div class="bs-it"><span class="bs-n" id="bs-vec">0%</span><span class="bs-l">озарения</span></div>
  </div>
  <div class="bv-actions">
    <button id="wipe-btn" class="wa-btn">Стереть всё</button>
  </div>
</div>

<div id="menu-view">
  <div class="mv-h"><span class="mv-t">Меню</span><button class="mv-x" aria-label="Закрыть">✕</button></div>
  <div class="mv-body">
    <div class="mi"><span class="mi-l">Тема</span><div id="theme-toggle" class="th-sw"><div class="th-knob"></div></div></div>
    <div class="mi"><span class="mi-l">Язык</span><select id="lang-sel"><option value="ru">RU</option><option value="en">EN</option></select></div>
    <div class="mi-sp"></div>
    <div class="mi"><span class="mi-l">Версия</span><span class="mi-v" id="app-ver">-</span></div>
  </div>
</div>

<div id="prog-wrap"><div id="prog-bar"><div id="prog-fill"></div><div id="prog-pct">0%</div></div></div>
<div id="noteview"></div>

<script type="module" src="js/boot.js"></script>
</body>
</html>
