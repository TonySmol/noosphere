<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0b10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>NOOmium</title>
  
  <!-- Tailwind CSS + DaisyUI -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
  
  <!-- NDK (Nostr Development Kit) -->
  <script src="https://cdn.jsdelivr.net/npm/@nostr-dev-kit/ndk@2.8.0/dist/index.umd.js"></script>
  
  <!-- Dexie.js -->
  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.11/dist/dexie.min.js"></script>
  
  <!-- Transformers.js -->
  <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    .safe-top { padding-top: env(safe-area-inset-top); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body class="min-h-screen bg-base-100 text-base-content">

<div id="app" x-data="app()" x-init="init()" x-cloak>
  
  <!-- Header -->
  <header class="navbar bg-base-200 shadow-lg safe-top sticky top-0 z-50">
    <div class="flex-1">
      <span class="text-xl font-bold px-4">NOO<span class="text-primary">.</span>mium</span>
    </div>
    <div class="flex-none gap-2">
      <div class="flex items-center gap-2 text-sm">
        <span class="badge" :class="$store.ndk.status === 'connected' ? 'badge-success' : 'badge-warning'">
          <span x-text="$store.ndk.status === 'connected' ? 'онлайн' : 'сеть'"></span>
        </span>
        <span class="badge" :class="$store.ai.ready ? 'badge-success' : 'badge-info'">
          <span x-text="$store.ai.ready ? 'ии' : 'модель'"></span>
        </span>
      </div>
      <button class="btn btn-ghost btn-circle" @click="showNotifications = true">
        <div class="indicator">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span class="badge badge-xs badge-primary indicator-item" x-show="$store.notifications.getUnreadCount() > 0" x-text="$store.notifications.getUnreadCount()"></span>
        </div>
      </button>
      <button class="btn btn-ghost btn-circle" @click="showMenu = true">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto px-4 pb-20">
    
    <!-- Stream View -->
    <div x-show="currentView === 'stream'" x-transition>
      <div x-data="editor()" class="card bg-base-200 shadow-xl mt-4">
        <div class="card-body">
          <textarea 
            x-model="text"
            class="textarea textarea-bordered w-full h-24 resize-none" 
            placeholder="О чём думаешь?"
          ></textarea>
          <div class="card-actions justify-between items-center mt-2">
            <span class="text-sm opacity-70" x-text="text.length + ' симв.'"></span>
            <div class="flex gap-2">
              <div class="join">
                <button 
                  class="join-item btn btn-sm" 
                  :class="mode === 'private' ? 'btn-primary' : 'btn-ghost'"
                  @click="mode = 'private'"
                >Себе</button>
                <button 
                  class="join-item btn btn-sm" 
                  :class="mode === 'world' ? 'btn-primary' : 'btn-ghost'"
                  @click="mode = 'world'"
                >Миру</button>
              </div>
              <button 
                class="btn btn-primary btn-sm"
                :disabled="!text.trim() || sending"
                @click="send()"
              >
                <span class="loading loading-spinner loading-xs" x-show="sending"></span>
                <span x-show="!sending">Отправить</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div x-data="carousel()" class="mt-4">
        <div class="text-center py-12 opacity-50">
          <div class="text-6xl mb-4">◇</div>
          <p>Здесь будет карусель мыслей</p>
        </div>
      </div>
    </div>

    <!-- Feed View -->
    <div x-data="feed()" x-show="currentView === 'feed'" x-transition>
      <h2 class="text-2xl font-bold mt-4 mb-4">Лента</h2>
      <div class="text-center py-12 opacity-50">
        <div class="text-6xl mb-4">◇</div>
        <p>Здесь будет лента публичных мыслей</p>
      </div>
    </div>

    <!-- Base View -->
    <div x-data="base()" x-show="currentView === 'base'" x-transition x-init="init()">
      <h2 class="text-2xl font-bold mt-4 mb-4">База</h2>
      <div class="form-control mb-4">
        <input type="text" placeholder="Поиск..." class="input input-bordered" x-model="searchQuery" @input="updateSearch()">
      </div>
      <div class="space-y-2">
        <template x-for="note in filteredNotes" :key="note.id">
          <div class="card bg-base-200 shadow cursor-pointer" @click="openNote(note.id)">
            <div class="card-body p-4">
              <p class="line-clamp-2" x-text="note.text"></p>
              <div class="flex justify-between items-center mt-2">
                <span class="badge badge-sm" :class="note.shared ? 'badge-info' : 'badge-primary'" x-text="note.shared ? 'открыто' : 'лично'"></span>
                <span class="text-xs opacity-50" x-text="formatDate(note.createdAt)"></span>
              </div>
            </div>
          </div>
        </template>
        <div x-show="filteredNotes.length === 0" class="text-center py-12 opacity-50">
          <p>Нет заметок</p>
        </div>
      </div>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav class="btm-nav btm-nav-sm fixed bottom-0 left-0 right-0 bg-base-200 safe-bottom z-40">
    <button 
      :class="currentView === 'stream' ? 'active' : ''"
      @click="currentView = 'stream'"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
      <span class="btm-nav-label">Поток</span>
    </button>
    <button 
      :class="currentView === 'feed' ? 'active' : ''"
      @click="currentView = 'feed'"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
      </svg>
      <span class="btm-nav-label">Лента</span>
    </button>
    <button 
      :class="currentView === 'base' ? 'active' : ''"
      @click="currentView = 'base'"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
      </svg>
      <span class="btm-nav-label">База</span>
    </button>
  </nav>

  <!-- Notifications Modal -->
  <div x-data="notifications()" x-show="showNotifications" x-transition class="modal modal-open">
    <div class="modal-box">
      <h3 class="font-bold text-lg">Уведомления</h3>
      <div class="py-4 space-y-2">
        <template x-for="(notif, idx) in $store.notifications.items" :key="notif.id">
          <div class="alert" :class="notif.read ? 'alert-info' : 'alert-warning'">
            <div>
              <span class="badge badge-sm" x-text="notif.type"></span>
              <p class="text-sm mt-1" x-text="notif.text"></p>
            </div>
            <button class="btn btn-sm btn-ghost" @click="markRead(idx)">✓</button>
          </div>
        </template>
        <div x-show="$store.notifications.items.length === 0" class="text-center opacity-50 py-8">
          Нет уведомлений
        </div>
      </div>
      <div class="modal-action">
        <button class="btn btn-ghost btn-sm" @click="$store.notifications.clear()">Очистить все</button>
        <button class="btn btn-primary btn-sm" @click="showNotifications = false">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Menu Modal -->
  <div x-show="showMenu" x-transition class="modal modal-open">
    <div class="modal-box">
      <h3 class="font-bold text-lg mb-4">Настройки</h3>
      <div class="space-y-4">
        <div class="form-control">
          <label class="label cursor-pointer">
            <span class="label-text">Тёмная тема</span>
            <input type="checkbox" class="toggle toggle-primary" x-model="$store.config.darkTheme" @change="$store.config.toggleTheme()">
          </label>
        </div>
        <div class="divider">Опасная зона</div>
        <button class="btn btn-error btn-outline btn-block" @click="wipeData()">Стереть всё</button>
      </div>
      <div class="modal-action">
        <button class="btn btn-primary" @click="showMenu = false">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Password Modal -->
  <div x-data="passwordModal()" x-show="showPasswordModal" x-transition class="modal modal-open">
    <div class="modal-box">
      <h3 class="font-bold text-lg" x-text="isNewUser ? 'Создать пароль' : 'Введите пароль'"></h3>
      <div class="py-4 space-y-4">
        <input type="password" placeholder="Пароль" class="input input-bordered w-full" x-model="password">
        <input x-show="isNewUser" type="password" placeholder="Подтвердите пароль" class="input input-bordered w-full" x-model="passwordConfirm">
        <div x-show="passwordError" class="alert alert-error text-sm" x-text="passwordError"></div>
      </div>
      <div class="modal-action">
        <button class="btn btn-primary" @click="submitPassword()">Продолжить</button>
      </div>
    </div>
  </div>

</div>

<script>
// ============================================================================
// СЕРВИСНЫЙ СЛОЙ (Alpine Stores)
// ============================================================================

document.addEventListener('alpine:init', () => {
  
  // $store.config — конфигурация
  Alpine.store('config', {
    darkTheme: true,
    echoThreshold: 0.8,
    
    init() {
      const saved = localStorage.getItem('noomium:config');
      if (saved) {
        try {
          Object.assign(this, JSON.parse(saved));
        } catch (e) {}
      }
      document.documentElement.setAttribute('data-theme', this.darkTheme ? 'dark' : 'light');
    },
    
    save() {
      localStorage.setItem('noomium:config', JSON.stringify({
        darkTheme: this.darkTheme,
        echoThreshold: this.echoThreshold
      }));
    },
    
    toggleTheme() {
      document.documentElement.setAttribute('data-theme', this.darkTheme ? 'dark' : 'light');
      this.save();
    }
  });

  // $store.db — база данных
  Alpine.store('db', {
    db: null,
    ready: false,
    
    async init() {
      this.db = new Dexie('noomium');
      this.db.version(1).stores({
        notes: 'id, text, shared, createdAt, replyTo, parentId'
      });
      await this.db.open();
      this.ready = true;
    },
    
    async put(note) {
      await this.db.notes.put(note);
    },
    
    async get(id) {
      return await this.db.notes.get(id);
    },
    
    async del(id) {
      await this.db.notes.delete(id);
    },
    
    async all() {
      return await this.db.notes.toArray();
    },
    
    async filtered(query) {
      const all = await this.all();
      if (!query) return all;
      const q = query.toLowerCase();
      return all.filter(n => n.text.toLowerCase().includes(q));
    }
  });

  // $store.ai — векторизация (ЗАГЛУШКА)
  Alpine.store('ai', {
    ready: false,
    
    async init() {
      // TODO: реализовать загрузку Transformers.js модели
      // Пока просто устанавливаем ready = true
      this.ready = true;
      console.log('AI store initialized (stub)');
    },
    
    async embed(text) {
      // TODO: реализовать реальную векторизацию через Transformers.js
      // Пока возвращаем хеш-вектор
      console.log('embed (stub):', text);
      const vector = new Array(384).fill(0).map(() => Math.random());
      return vector;
    },
    
    cosine(a, b) {
      // TODO: реализовать реальное косинусное сходство
      console.log('cosine (stub)');
      return 0.5;
    }
  });

  // $store.ndk — Nostr сеть (ЗАГЛУШКА)
  Alpine.store('ndk', {
    status: 'disconnected',
    sk: null,
    pk: '0'.repeat(64),
    
    async init(password) {
      // TODO: реализовать реальную инициализацию NDK
      // TODO: реализовать шифрование/дешифрование ключа (PBKDF2 + AES-GCM)
      // TODO: реализовать подключение к relay
      // TODO: реализовать подписку на kind 20202
      
      console.log('NDK init (stub) with password');
      
      // Имитация подключения
      setTimeout(() => {
        this.status = 'connected';
      }, 1000);
    },
    
    async publishThought(text, vector, replyToEventId = null) {
      // TODO: реализовать реальную публикацию через NDK
      console.log('publishThought (stub):', { text, vector, replyToEventId });
    },
    
    stop() {
      // TODO: реализовать отключение NDK
      console.log('NDK stop (stub)');
      this.status = 'disconnected';
    }
  });

  // $store.notifications — уведомления
  Alpine.store('notifications', {
    items: [],
    
    init() {
      const saved = localStorage.getItem('noomium:notifications');
      if (saved) {
        try {
          this.items = JSON.parse(saved);
        } catch (e) {}
      }
    },
    
    add(notification) {
      const notif = {
        id: notification.id || (Date.now() + '_' + Math.random()),
        type: notification.type || 'info',
        text: notification.text || '',
        timestamp: notification.timestamp || Date.now(),
        read: false
      };
      this.items.unshift(notif);
      this.save();
    },
    
    getAll() {
      return [...this.items];
    },
    
    markRead(index) {
      if (this.items[index]) {
        this.items[index].read = true;
        this.save();
      }
    },
    
    clear() {
      this.items = [];
      this.save();
    },
    
    getUnreadCount() {
      return this.items.filter(n => !n.read).length;
    },
    
    save() {
      localStorage.setItem('noomium:notifications', JSON.stringify(this.items));
    }
  });

  // $store.echo — детектор эха (ЗАГЛУШКА)
  Alpine.store('echo', {
    init() {
      // TODO: реализовать детектор смыслового эха
      console.log('Echo store initialized (stub)');
    }
  });

});

// ============================================================================
// UI КОМПОНЕНТЫ (Alpine x-data)
// ============================================================================

function app() {
  return {
    currentView: 'stream',
    showNotifications: false,
    showMenu: false,
    showPasswordModal: false,
    
    async init() {
      Alpine.store('config').init();
      await Alpine.store('db').init();
      await Alpine.store('ai').init();
      
      // Показать модалку пароля
      this.showPasswordModal = true;
    },
    
    async completeInit(password) {
      try {
        await Alpine.store('ndk').init(password);
        Alpine.store('notifications').init();
        Alpine.store('echo').init();
        this.showPasswordModal = false;
      } catch (err) {
        console.error('Init failed:', err);
        alert('Ошибка инициализации: ' + err.message);
      }
    },
    
    async wipeData() {
      if (!confirm('Удалить ВСЕ данные навсегда?')) return;
      await Alpine.store('db').db.notes.clear();
      localStorage.clear();
      location.reload();
    }
  };
}

function editor() {
  return {
    text: '',
    mode: 'private',
    sending: false,
    
    async send() {
      if (!this.text.trim()) return;
      
      this.sending = true;
      
      try {
        const vector = await Alpine.store('ai').embed(this.text);
        
        const note = {
          id: 'n' + Date.now() + Math.random().toString(36).slice(2, 6),
          text: this.text,
          vector: vector,
          shared: this.mode === 'world',
          createdAt: Date.now(),
          replyTo: null,
          parentId: null
        };
        
        await Alpine.store('db').put(note);
        
        if (this.mode === 'world') {
          await Alpine.store('ndk').publishThought(this.text, vector, null);
        }
        
        this.text = '';
        alert('Заметка сохранена');
      } catch (err) {
        console.error('Send failed:', err);
        alert('Ошибка отправки: ' + err.message);
      } finally {
        this.sending = false;
      }
    }
  };
}

function carousel() {
  return {
    // TODO: реализовать карусель мыслей
    // Данные будут браться из $store после поиска по вектору
  };
}

function feed() {
  return {
    // TODO: реализовать ленту публичных мыслей
    // Данные будут браться из $store.ndk.publicThoughts
  };
}

function base() {
  return {
    filteredNotes: [],
    searchQuery: '',
    
    async init() {
      await this.updateSearch();
    },
    
    async updateSearch() {
      this.filteredNotes = await Alpine.store('db').filtered(this.searchQuery);
    },
    
    formatDate(ts) {
      return new Date(ts).toLocaleDateString('ru-RU', { day: '2-digit', month: 'short' });
    },
    
    openNote(id) {
      // TODO: реализовать просмотр заметки
      console.log('Open note:', id);
    }
  };
}

function notifications() {
  return {
    markRead(idx) {
      Alpine.store('notifications').markRead(idx);
    }
  };
}

function passwordModal() {
  return {
    isNewUser: !localStorage.getItem('noomium:sk'),
    password: '',
    passwordConfirm: '',
    passwordError: '',
    
    async submitPassword() {
      if (this.isNewUser && this.password !== this.passwordConfirm) {
        this.passwordError = 'Пароли не совпадают';
        return;
      }
      if (!this.password) {
        this.passwordError = 'Введите пароль';
        return;
      }
      
      try {
        await this.$root.completeInit(this.password);
        this.passwordError = '';
      } catch (err) {
        this.passwordError = 'Ошибка: ' + err.message;
      }
    }
  };
}

// ============================================================================
// SERVICE WORKER & MANIFEST
// ============================================================================

if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'noomium-v1';
    
    self.addEventListener('install', e => {
      self.skipWaiting();
    });
    
    self.addEventListener('activate', e => {
      e.waitUntil(clients.claim());
    });
    
    self.addEventListener('fetch', e => {
      if (e.request.method !== 'GET') return;
      
      // Network first strategy
      e.respondWith(
        fetch(e.request)
          .then(response => {
            // Кешируем успешные ответы
            if (response.status === 200) {
              const responseClone = response.clone();
              caches.open(CACHE).then(cache => {
                cache.put(e.request, responseClone);
              });
            }
            return response;
          })
          .catch(() => {
            // Если сеть недоступна, пытаемся достать из кеша
            return caches.match(e.request).then(response => {
              return response || new Response('Offline', { status: 503 });
            });
          })
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(err => {
    console.warn('SW registration failed:', err);
  });
}

const manifest = {
  name: 'NOOmium',
  short_name: 'NOOmium',
  description: 'Блокнот с антисоцсетью',
  start_url: '.',
  display: 'standalone',
  background_color: '#0b0b10',
  theme_color: '#0b0b10',
  icons: [{
    src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">◆</text></svg>',
    sizes: 'any',
    type: 'image/svg+xml'
  }]
};
const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
const manifestUrl = URL.createObjectURL(manifestBlob);
const link = document.createElement('link');
link.rel = 'manifest';
link.href = manifestUrl;
document.head.appendChild(link);

</script>

</body>
</html>
